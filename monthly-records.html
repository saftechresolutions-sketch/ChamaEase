<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>ChamaEase | Monthly Records</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <style>
        /* Additional styles for monthly records */
        .filter-section {
            background: white;
            border-radius: 20px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--gray-border);
        }
        
        .filter-title {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--primary);
            display: inline-block;
        }
        
        .filter-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: flex-end;
        }
        
        .filter-group {
            flex: 1;
            min-width: 120px;
        }
        
        .filter-label {
            font-size: 0.7rem;
            font-weight: 600;
            margin-bottom: 0.3rem;
            color: #1e2a3e;
            display: block;
        }
        
        .filter-select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--gray-border);
            border-radius: 12px;
            font-size: 0.8rem;
            background: white;
            cursor: pointer;
        }
        
        .filter-select:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .filter-buttons {
            display: flex;
            gap: 0.5rem;
        }
        
        .btn-apply {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.75rem;
        }
        
        .btn-reset {
            background: #f1f5f9;
            color: #64748b;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.75rem;
        }
        
        .active-filter-badge {
            display: inline-block;
            background: var(--primary-light);
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            margin-top: 0.8rem;
        }
        
        .action-buttons-container {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        
        .action-btn-clean {
            padding: 12px 24px;
            border-radius: 40px;
            border: none;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        
        .btn-whatsapp {
            background: #25D366;
            color: white;
        }
        
        .btn-whatsapp:hover {
            background: #128C7E;
            transform: translateY(-2px);
        }
        
        .btn-excel {
            background: #10b981;
            color: white;
        }
        
        .btn-excel:hover {
            background: #059669;
            transform: translateY(-2px);
        }
        
        .btn-pdf {
            background: #dc2626;
            color: white;
        }
        
        .btn-pdf:hover {
            background: #b91c1c;
            transform: translateY(-2px);
        }
        
        .btn-save {
            background: #3b82f6;
            color: white;
        }
        
        .btn-save:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }
        
        @media (max-width: 640px) {
            .filter-controls {
                flex-direction: column;
            }
            .filter-buttons {
                width: 100%;
            }
            .btn-apply, .btn-reset {
                flex: 1;
            }
            .action-buttons-container {
                flex-direction: column;
            }
            .action-btn-clean {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
<div class="app-wrapper">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">ChamaEase</div>
            <button class="sidebar-close" id="sidebarClose">✕</button>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item"><span class="icon">📊</span><span class="label">DASHBOARD</span></a>
            <a href="members.html" class="nav-item"><span class="icon">👥</span><span class="label">MEMBERS</span></a>
            <a href="member-history.html" class="nav-item"><span class="icon">📜</span><span class="label">MEMBER HISTORY</span></a>
            <a href="monthly-records.html" class="nav-item active"><span class="icon">📅</span><span class="label">MONTHLY RECORDS</span></a>
            <a href="reports.html" class="nav-item"><span class="icon">📈</span><span class="label">REPORTS</span></a>
            <a href="settings.html" class="nav-item"><span class="icon">⚙️</span><span class="label">SETTINGS</span></a>
        </nav>
    </aside>

    <main class="main-content">
        <div class="top-bar">
            <button class="menu-toggle" id="menuToggle">☰</button>
            <div class="page-title">📅 MONTHLY RECORDS</div>
            <div class="user-info">
                <span class="user-email" id="userEmail"></span>
                <button id="logoutBtn" class="logout-btn">LOGOUT</button>
            </div>
        </div>
        <div id="app-root" class="container">
            <div style="text-align: center; padding: 2rem;">
                <div class="loading-spinner"></div>
                <p>Loading spreadsheet...</p>
            </div>
        </div>
        <footer>Smart Chama Management · Click any cell to edit · Auto-saves</footer>
    </main>
</div>

<script>
// Using supabaseClient from supabase-config.js
let allMembers = [];
let allRecords = [];
let currentMonth = new Date().getMonth() + 1;
let currentYear = new Date().getFullYear();
let saveTimeout = null;
let pendingSaves = new Map();

// Available years
let availableYears = [];
let monthNames = ["JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE", "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"];

// Sidebar functions
function openSidebar() {
    document.getElementById("sidebar").classList.add("open");
    document.getElementById("sidebarOverlay").classList.add("active");
}

function closeSidebar() {
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("sidebarOverlay").classList.remove("active");
}

document.getElementById("menuToggle").addEventListener("click", openSidebar);
document.getElementById("sidebarClose").addEventListener("click", closeSidebar);
document.getElementById("sidebarOverlay").addEventListener("click", closeSidebar);
document.getElementById("logoutBtn").addEventListener("click", async function() {
    await logoutUser();
    window.location.href = "index.html";
});

// Toast notification function
function showToast(message, type = 'success') {
    const toast = document.createElement('div');
    toast.className = `toast-notification ${type}`;
    toast.innerHTML = type === 'success' ? '✓ ' : '⚠️ ';
    toast.innerHTML += message;
    document.body.appendChild(toast);
    
    setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}

// Helper functions
function safeValue(value) {
    if (value === null || value === undefined || value === '' || isNaN(value)) {
        return 0;
    }
    return parseFloat(value);
}

function formatNumber(num) {
    if (num === null || num === undefined) return "0";
    return num.toLocaleString('en-KE');
}

function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/[&<>]/g, function(m) {
        if (m === "&") return "&amp;";
        if (m === "<") return "&lt;";
        if (m === ">") return "&gt;";
        return m;
    });
}

function showSavedIndicator(success, message = null) {
    const indicator = document.getElementById("saving-indicator");
    if (indicator) {
        if (success) {
            indicator.textContent = message || "✓ Saved";
            indicator.style.color = "#2c7a4d";
        } else {
            indicator.textContent = message || "✗ Error";
            indicator.style.color = "#dc2626";
        }
        setTimeout(function() {
            indicator.textContent = "";
        }, 2000);
    }
}

// Save all pending changes
async function saveAllChanges() {
    if (pendingSaves.size === 0) {
        showToast("No pending changes to save", "warning");
        return;
    }
    
    const saveBtn = document.getElementById("saveAllBtn");
    if (saveBtn) {
        saveBtn.disabled = true;
        saveBtn.innerHTML = '<span class="loading-spinner" style="width:16px;height:16px;"></span> Saving...';
    }
    
    let successCount = 0;
    let errorCount = 0;
    
    for (const [key, change] of pendingSaves) {
        try {
            await updateRecordValue(change.memberId, change.field, change.value, true);
            successCount++;
            pendingSaves.delete(key);
        } catch (error) {
            errorCount++;
            console.error("Save failed:", error);
        }
    }
    
    if (saveBtn) {
        saveBtn.disabled = false;
        saveBtn.innerHTML = '💾 Save All Changes';
    }
    
    if (successCount > 0) {
        showToast(`Saved ${successCount} change${successCount > 1 ? 's' : ''} successfully`);
        showSavedIndicator(true, `Saved ${successCount} item(s)`);
    }
    if (errorCount > 0) {
        showToast(`Failed to save ${errorCount} item(s)`, "error");
    }
}

// Data functions
async function loadData() {
    try {
        const { data: membersData, error: membersError } = await supabaseClient
            .from("members")
            .select("*")
            .order("name");
        
        if (membersError) throw membersError;
        allMembers = membersData || [];
        
        const { data: recordsData, error: recordsError } = await supabaseClient
            .from("monthly_records")
            .select("*");
        
        if (recordsError) throw recordsError;
        allRecords = recordsData || [];
        
        // Extract available years from records
        var yearsSet = new Set();
        for (var i = 0; i < allRecords.length; i++) {
            yearsSet.add(allRecords[i].year);
        }
        // Also add current year
        yearsSet.add(new Date().getFullYear());
        availableYears = Array.from(yearsSet).sort((a, b) => b - a);
        
        renderSpreadsheet();
    } catch (error) {
        document.getElementById("app-root").innerHTML = '<div style="padding:2rem;text-align:center"><h3>⚠️ Error</h3><p>' + error.message + '</p><button class="btn" onclick="location.reload()">Retry</button></div>';
    }
}

function getRecordForMember(memberId) {
    for (var i = 0; i < allRecords.length; i++) {
        var record = allRecords[i];
        if (record.member_id === memberId && record.month === currentMonth && record.year === currentYear) {
            return record;
        }
    }
    return null;
}

function getRecordValue(memberId, field) {
    var record = getRecordForMember(memberId);
    if (record && record[field] !== null && record[field] !== undefined) {
        return record[field];
    }
    return 0;
}

async function updateRecordValue(memberId, field, value, isBulkSave = false) {
    var record = getRecordForMember(memberId);
    var numValue = safeValue(value);
    
    try {
        if (record) {
            var updateData = {};
            updateData[field] = numValue;
            updateData.updated_at = new Date().toISOString();
            
            var { error } = await supabaseClient
                .from("monthly_records")
                .update(updateData)
                .eq("id", record.id);
            
            if (error) throw error;
            record[field] = numValue;
        } else {
            var newRecord = {
                member_id: memberId,
                month: currentMonth,
                year: currentYear,
                loan: 0,
                loan_deductions: 0,
                loan_balance: 0,
                monthly_contribution: 0,
                penalties: 0
            };
            newRecord[field] = numValue;
            
            var { data, error } = await supabaseClient
                .from("monthly_records")
                .insert([newRecord])
                .select();
            
            if (error) throw error;
            if (data && data[0]) {
                allRecords.push(data[0]);
            }
        }
        updateTotalsRow();
        if (!isBulkSave) {
            showSavedIndicator(true);
            showToast("Saved successfully");
        }
        return true;
    } catch (error) {
        console.error("Update error:", error);
        if (!isBulkSave) {
            showSavedIndicator(false);
            showToast(error.message, "error");
        }
        return false;
    }
}

function updateTotalsRow() {
    var totalLoan = 0;
    var totalLoanDeductions = 0;
    var totalLoanBalance = 0;
    var totalMonthlyContribution = 0;
    var totalPenalties = 0;
    
    for (var i = 0; i < allMembers.length; i++) {
        var member = allMembers[i];
        totalLoan += safeValue(getRecordValue(member.id, "loan"));
        totalLoanDeductions += safeValue(getRecordValue(member.id, "loan_deductions"));
        totalLoanBalance += safeValue(getRecordValue(member.id, "loan_balance"));
        totalMonthlyContribution += safeValue(getRecordValue(member.id, "monthly_contribution"));
        totalPenalties += safeValue(getRecordValue(member.id, "penalties"));
    }
    
    var totalsRow = document.getElementById("totals-row");
    if (totalsRow) {
        var cells = totalsRow.getElementsByTagName("td");
        if (cells.length >= 6) {
            cells[1].innerHTML = "KES " + formatNumber(totalLoan);
            cells[2].innerHTML = "KES " + formatNumber(totalLoanDeductions);
            cells[3].innerHTML = "KES " + formatNumber(totalLoanBalance);
            cells[4].innerHTML = "KES " + formatNumber(totalMonthlyContribution);
            cells[5].innerHTML = "KES " + formatNumber(totalPenalties);
        }
    }
}

// Handle cell change with pending saves tracking
window.handleCellChange = function(memberId, field, event) {
    var newValue = event.target.value;
    var indicator = document.getElementById("saving-indicator");
    if (indicator) {
        indicator.textContent = "Pending...";
        indicator.style.color = "#f59e0b";
    }
    
    var changeKey = memberId + '_' + field;
    pendingSaves.set(changeKey, { memberId, field, value: newValue });
    
    var pendingCountSpan = document.getElementById("pendingCount");
    if (pendingCountSpan) {
        pendingCountSpan.textContent = pendingSaves.size;
        pendingCountSpan.style.display = pendingSaves.size > 0 ? 'inline' : 'none';
    }
    
    if (saveTimeout) clearTimeout(saveTimeout);
    saveTimeout = setTimeout(function() {
        if (pendingSaves.size > 0) {
            saveAllChanges();
        }
    }, 2000);
};

// Export functions
function exportToExcel() {
    var monthName = monthNames[currentMonth - 1];
    
    var csvRows = [];
    csvRows.push(["CHAMA RECORDS - " + monthName + " " + currentYear]);
    csvRows.push(["Generated:", new Date().toLocaleString()]);
    csvRows.push([]);
    csvRows.push(["MEMBER", "LOAN", "LOAN DEDUCTIONS", "LOAN BALANCE", "MONTHLY CONTRIBUTION", "PENALTIES"]);
    
    for (var i = 0; i < allMembers.length; i++) {
        var member = allMembers[i];
        csvRows.push([
            member.name,
            "KES " + safeValue(getRecordValue(member.id, "loan")),
            "KES " + safeValue(getRecordValue(member.id, "loan_deductions")),
            "KES " + safeValue(getRecordValue(member.id, "loan_balance")),
            "KES " + safeValue(getRecordValue(member.id, "monthly_contribution")),
            "KES " + safeValue(getRecordValue(member.id, "penalties"))
        ]);
    }
    
    var totalLoan = 0, totalLoanDeductions = 0, totalLoanBalance = 0, totalMonthlyContribution = 0, totalPenalties = 0;
    for (var i = 0; i < allMembers.length; i++) {
        var member = allMembers[i];
        totalLoan += safeValue(getRecordValue(member.id, "loan"));
        totalLoanDeductions += safeValue(getRecordValue(member.id, "loan_deductions"));
        totalLoanBalance += safeValue(getRecordValue(member.id, "loan_balance"));
        totalMonthlyContribution += safeValue(getRecordValue(member.id, "monthly_contribution"));
        totalPenalties += safeValue(getRecordValue(member.id, "penalties"));
    }
    csvRows.push(["TOTAL", "KES " + formatNumber(totalLoan), "KES " + formatNumber(totalLoanDeductions), "KES " + formatNumber(totalLoanBalance), "KES " + formatNumber(totalMonthlyContribution), "KES " + formatNumber(totalPenalties)]);
    
    var csv = "";
    for (var i = 0; i < csvRows.length; i++) {
        csv += csvRows[i].join(",") + "\n";
    }
    
    var blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    var link = document.createElement("a");
    var url = URL.createObjectURL(blob);
    link.href = url;
    link.setAttribute("download", "chama_" + monthName + "_" + currentYear + ".csv");
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
    showToast("Excel file downloaded!");
}

function exportToPDF() {
    var printContents = document.getElementById("data-table").outerHTML;
    var monthName = monthNames[currentMonth - 1];
    
    var printWindow = window.open("", "_blank");
    printWindow.document.write("<html><head><title>ChamaEase Report</title>");
    printWindow.document.write("<style>");
    printWindow.document.write("body { font-family: Arial, sans-serif; padding: 20px; }");
    printWindow.document.write("table { border-collapse: collapse; width: 100%; margin-top: 20px; }");
    printWindow.document.write("th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }");
    printWindow.document.write("th { background: #2c7a4d; color: white; }");
    printWindow.document.write("h2 { color: #2c7a4d; }");
    printWindow.document.write("</style>");
    printWindow.document.write("</head><body>");
    printWindow.document.write("<h2>🏦 CHAMA RECORDS - " + monthName + " " + currentYear + "</h2>");
    printWindow.document.write("<p>Generated: " + new Date().toLocaleString() + "</p>");
    printWindow.document.write(printContents);
    printWindow.document.write("</body></html>");
    printWindow.document.close();
    printWindow.print();
    showToast("PDF ready for printing");
}

// WhatsApp Share - Opens WhatsApp App Directly
function shareToWhatsApp() {
    var monthName = monthNames[currentMonth - 1];
    
    var message = "🏦 *CHAMA RECORDS* - " + monthName + " " + currentYear + "\n\n";
    
    for (var i = 0; i < allMembers.length; i++) {
        var member = allMembers[i];
        var loan = safeValue(getRecordValue(member.id, "loan"));
        var loanDeductions = safeValue(getRecordValue(member.id, "loan_deductions"));
        var loanBalance = safeValue(getRecordValue(member.id, "loan_balance"));
        var monthlyContribution = safeValue(getRecordValue(member.id, "monthly_contribution"));
        var penalties = safeValue(getRecordValue(member.id, "penalties"));
        
        // Only show members with any activity
        if (loan > 0 || loanDeductions > 0 || loanBalance > 0 || monthlyContribution > 0 || penalties > 0) {
            message += "*" + member.name + "*\n";
            if (loan > 0) message += "💰 Loan: KES " + formatNumber(loan) + "\n";
            if (loanDeductions > 0) message += "📉 Deductions: KES " + formatNumber(loanDeductions) + "\n";
            if (loanBalance > 0) message += "⚖️ Balance: KES " + formatNumber(loanBalance) + "\n";
            if (monthlyContribution > 0) message += "📋 Contribution: KES " + formatNumber(monthlyContribution) + "\n";
            if (penalties > 0) message += "⚠️ Penalties: KES " + formatNumber(penalties) + "\n";
            message += "\n";
        }
    }
    
    // Add totals
    var totalLoan = 0, totalLoanBalance = 0, totalMonthlyContribution = 0, totalPenalties = 0;
    for (var i = 0; i < allMembers.length; i++) {
        var member = allMembers[i];
        totalLoan += safeValue(getRecordValue(member.id, "loan"));
        totalLoanBalance += safeValue(getRecordValue(member.id, "loan_balance"));
        totalMonthlyContribution += safeValue(getRecordValue(member.id, "monthly_contribution"));
        totalPenalties += safeValue(getRecordValue(member.id, "penalties"));
    }
    message += "📊 *TOTALS*\n";
    message += "💰 Total Loans: KES " + formatNumber(totalLoan) + "\n";
    message += "⚖️ Outstanding Balance: KES " + formatNumber(totalLoanBalance) + "\n";
    message += "📋 Total Contributions: KES " + formatNumber(totalMonthlyContribution) + "\n";
    message += "⚠️ Total Penalties: KES " + formatNumber(totalPenalties) + "\n";
    message += "\n📅 Generated by ChamaEase";
    
    var encodedMessage = encodeURIComponent(message);
    var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    
    if (isMobile) {
        window.location.href = "whatsapp://send?text=" + encodedMessage;
        setTimeout(function() {
            window.open("https://wa.me/?text=" + encodedMessage, "_blank");
        }, 500);
    } else {
        window.open("https://wa.me/?text=" + encodedMessage, "_blank");
    }
    
    showToast("Opening WhatsApp...");
}

function renderSpreadsheet() {
    var container = document.getElementById("app-root");
    
    // Build month options for filter
    var monthOptions = '';
    for (var i = 1; i <= 12; i++) {
        var selected = (currentMonth === i) ? 'selected' : '';
        monthOptions += '<option value="' + i + '" ' + selected + '>' + monthNames[i - 1] + '</option>';
    }
    
    // Build year options for filter
    var yearOptions = '';
    for (var i = 0; i < availableYears.length; i++) {
        var selected = (currentYear === availableYears[i]) ? 'selected' : '';
        yearOptions += '<option value="' + availableYears[i] + '" ' + selected + '>' + availableYears[i] + '</option>';
    }
    
    var tableRows = "";
    
    for (var i = 0; i < allMembers.length; i++) {
        var member = allMembers[i];
        var loan = safeValue(getRecordValue(member.id, "loan"));
        var loanDeductions = safeValue(getRecordValue(member.id, "loan_deductions"));
        var loanBalance = safeValue(getRecordValue(member.id, "loan_balance"));
        var monthlyContribution = safeValue(getRecordValue(member.id, "monthly_contribution"));
        var penalties = safeValue(getRecordValue(member.id, "penalties"));
        
        tableRows += "<tr>";
        tableRows += "<td class=\"member-name-cell\"><strong>" + escapeHtml(member.name) + "</strong></td>";
        tableRows += "<td><input type=\"number\" value=\"" + loan + "\" step=\"any\" onchange=\"handleCellChange('" + member.id + "', 'loan', event)\" placeholder=\"0\"></td>";
        tableRows += "<td><input type=\"number\" value=\"" + loanDeductions + "\" step=\"any\" onchange=\"handleCellChange('" + member.id + "', 'loan_deductions', event)\" placeholder=\"0\"></td>";
        tableRows += "<td><input type=\"number\" value=\"" + loanBalance + "\" step=\"any\" onchange=\"handleCellChange('" + member.id + "', 'loan_balance', event)\" placeholder=\"0\"></td>";
        tableRows += "<td><input type=\"number\" value=\"" + monthlyContribution + "\" step=\"any\" onchange=\"handleCellChange('" + member.id + "', 'monthly_contribution', event)\" placeholder=\"0\"></td>";
        tableRows += "<td><input type=\"number\" value=\"" + penalties + "\" step=\"any\" onchange=\"handleCellChange('" + member.id + "', 'penalties', event)\" placeholder=\"0\"></td>";
        tableRows += "</tr>";
    }
    
    if (allMembers.length === 0) {
        tableRows = "<tr><td colspan=\"6\" style=\"text-align:center; padding: 2rem;\">👥 No members found. Please <a href=\"members.html\">add members</a> first.侧</td></tr>";
    }
    
    var totalLoan = 0, totalLoanDeductions = 0, totalLoanBalance = 0, totalMonthlyContribution = 0, totalPenalties = 0;
    
    for (var i = 0; i < allMembers.length; i++) {
        var member = allMembers[i];
        totalLoan += safeValue(getRecordValue(member.id, "loan"));
        totalLoanDeductions += safeValue(getRecordValue(member.id, "loan_deductions"));
        totalLoanBalance += safeValue(getRecordValue(member.id, "loan_balance"));
        totalMonthlyContribution += safeValue(getRecordValue(member.id, "monthly_contribution"));
        totalPenalties += safeValue(getRecordValue(member.id, "penalties"));
    }
    
    var html = `
        <!-- Filter Section -->
        <div class="filter-section">
            <div class="filter-title">📅 Select Period</div>
            <div class="filter-controls">
                <div class="filter-group">
                    <label class="filter-label">Select Month</label>
                    <select id="monthFilter" class="filter-select">${monthOptions}</select>
                </div>
                <div class="filter-group">
                    <label class="filter-label">Select Year</label>
                    <select id="yearFilter" class="filter-select">${yearOptions}</select>
                </div>
                <div class="filter-buttons">
                    <button class="btn-apply" id="applyFilterBtn">Apply Filter</button>
                </div>
            </div>
            <div class="active-filter-badge">
                📅 Showing: <strong>${monthNames[currentMonth - 1]} ${currentYear}</strong>
            </div>
        </div>
        
        <!-- Action Buttons -->
        <div class="action-buttons-container">
            <button class="action-btn-clean btn-whatsapp" id="shareWABtn">
                📱 Share on WhatsApp
            </button>
            <button class="action-btn-clean btn-excel" id="exportExcelBtn">
                📊 Export to Excel
            </button>
            <button class="action-btn-clean btn-pdf" id="exportPDFBtn">
                📄 Export to PDF
            </button>
            <button class="action-btn-clean btn-save" id="saveAllBtn">
                💾 Save All Changes <span id="pendingCount" style="display:none; background:#f59e0b; color:white; border-radius:50%; padding:2px 6px; margin-left:5px; font-size:10px;"></span>
            </button>
        </div>
        
        <!-- Records Table -->
        <div class="spreadsheet-container">
            <table class="spreadsheet-table" id="data-table">
                <thead>
                    <tr>
                        <th style="min-width:140px;">👤 MEMBER</th>
                        <th style="min-width:110px;">💰 LOAN</th>
                        <th style="min-width:140px;">📉 LOAN DEDUCTIONS</th>
                        <th style="min-width:130px;">⚖️ LOAN BALANCE</th>
                        <th style="min-width:160px;">📋 MONTHLY CONTRIBUTION</th>
                        <th style="min-width:110px;">⚠️ PENALTIES</th>
                    </tr>
                </thead>
                <tbody>
                    ${tableRows}
                    <tr id="totals-row" class="totals-row">
                        <td><strong>📊 TOTAL</strong>侧
                        <td><strong>KES ${formatNumber(totalLoan)}</strong>侧
                        <td><strong>KES ${formatNumber(totalLoanDeductions)}</strong>侧
                        <td><strong>KES ${formatNumber(totalLoanBalance)}</strong>侧
                        <td><strong>KES ${formatNumber(totalMonthlyContribution)}</strong>侧
                        <td><strong>KES ${formatNumber(totalPenalties)}</strong>侧
                    </tr>
                </tbody>
            </table>
        </div>
        
        <div style="margin-top: 1rem; padding: 0.8rem; background: var(--primary-light); border-radius: 12px; text-align: center; font-size: 0.75rem; color: var(--primary);">
            💡 <strong>Tip:</strong> Click any cell to edit. Changes auto-save after 2 seconds or use "Save All Changes" button.
        </div>
    `;
    
    container.innerHTML = html;
    
    // Bind filter events
    document.getElementById("applyFilterBtn").addEventListener("click", function() {
        if (pendingSaves.size > 0) {
            if (confirm("You have unsaved changes. Save before changing period?")) {
                saveAllChanges();
            }
        }
        currentMonth = parseInt(document.getElementById("monthFilter").value);
        currentYear = parseInt(document.getElementById("yearFilter").value);
        renderSpreadsheet();
    });
    
    document.getElementById("saveAllBtn").addEventListener("click", saveAllChanges);
    document.getElementById("exportExcelBtn").addEventListener("click", exportToExcel);
    document.getElementById("exportPDFBtn").addEventListener("click", exportToPDF);
    document.getElementById("shareWABtn").addEventListener("click", shareToWhatsApp);
}

// Initialize
(async function() {
    const isAuth = await protectPage();
    if (isAuth) {
        const user = await getCurrentUser();
        if (user && document.getElementById("userEmail")) {
            document.getElementById("userEmail").textContent = user.email || "Admin";
        }
        await loadData();
    }
})();
</script>
</body>
</html>
