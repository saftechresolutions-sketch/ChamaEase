<script type="module">
    import { supabase } from './auth.js';
    
    let allShifts = [], allTransactions = [];
    let isMobile = window.innerWidth <= 768;
    let currentUser = null;
    let currentBranchId = null;
    let currentBranch = null;

    // ==================== SIDEBAR FUNCTIONS ====================
    window.toggleMenu = () => {
        document.getElementById('sidebar').classList.toggle('mobile-active');
        document.getElementById('overlay').classList.toggle('active');
    };

    // ==================== BRANCH FUNCTIONS ====================

    // Get current user's branch ID from session
    function getCurrentBranchId() {
        const session = JSON.parse(localStorage.getItem('pos_session') || '{}');
        return session.branch?.id || currentBranchId;
    }

    // Load user profile with branch info
    async function loadUserProfile() {
        try {
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) {
                window.location.href = 'index.html';
                return null;
            }
            
            currentUser = user;
            
            // Get profile with branch info
            const { data: profile, error } = await supabase
                .from('profiles')
                .select(`
                    *,
                    branches (
                        id,
                        name,
                        code,
                        location
                    )
                `)
                .eq('id', user.id)
                .maybeSingle();
            
            if (error) throw error;
            if (!profile) {
                console.error("No profile found");
                return null;
            }
            
            currentBranchId = profile.branch_id;
            currentBranch = profile.branches;
            
            const session = {
                user: user,
                profile: profile,
                branch: profile.branches,
                role: profile.role
            };
            localStorage.setItem('pos_session', JSON.stringify(session));
            
            // Update sidebar with user's assigned branch
            const sidebarBranchName = document.querySelector('#sidebarBranchName span');
            if (profile.branches && sidebarBranchName) {
                sidebarBranchName.textContent = profile.branches.name;
            }
            
            // Update branch display
            const branchNameSpan = document.getElementById('branchName');
            if (branchNameSpan && profile.branches) {
                branchNameSpan.textContent = profile.branches.name;
            }
            
            return profile;
        } catch (error) {
            console.error("Error loading profile:", error);
            return null;
        }
    }

    window.logoutUser = async () => { 
        localStorage.removeItem('pos_session');
        await supabase.auth.signOut(); 
        location.href = 'index.html'; 
    };

    async function fetchData() {
        showLoading(true);
        
        try {
            const branchId = getCurrentBranchId();
            if (!branchId) {
                console.error("No branch ID found");
                return;
            }

            // Fetch shifts with pre-calculated totals
            const [shiftsRes, transRes] = await Promise.all([
                supabase.from('daily_shifts')
                    .select('*')
                    .eq('branch_id', branchId)
                    .order('start_time', { ascending: false }),
                supabase.from('cash_transactions')
                    .select('shift_id, amount, type')
                    .eq('branch_id', branchId)
            ]);

            allShifts = shiftsRes.data || [];
            allTransactions = transRes.data || [];
            
            console.log(`Loaded ${allShifts.length} shifts`);
            
            render();
        } catch (error) {
            console.error("Error fetching data:", error);
            alert("Error loading shift data. Please try again.");
        } finally {
            showLoading(false);
        }
    }

    function showLoading(show) {
        const loadingEl = document.getElementById('loadingSpinner');
        const refreshBtn = document.getElementById('refreshBtn');
        
        if (loadingEl) loadingEl.style.display = show ? 'flex' : 'none';
        if (refreshBtn) refreshBtn.disabled = show;
    }

    function render(data = allShifts) {
        if (isMobile) {
            renderMobile(data);
        } else {
            renderDesktop(data);
        }
        
        // Show/hide no results message
        const noResultsEl = document.getElementById('noResults');
        if (noResultsEl) {
            noResultsEl.style.display = data.length === 0 ? 'block' : 'none';
        }
    }

    function renderDesktop(data = allShifts) {
        const tbody = document.getElementById('audit-body-desktop');
        if (!tbody) return;
        
        let tableHtml = '';

        data.forEach(sh => {
            const shiftLogs = allTransactions.filter(t => t.shift_id === sh.id);
            
            // Use pre-calculated totals from the shift table
            const cashSales = sh.total_cash_sales || 0;
            const kcbPaybillSales = sh.total_kcb_paybill_sales || 0;
            const totalRevenue = sh.total_sales_amount || 0;
            
            // Format the date for the URL (YYYY-MM-DD)
            const shiftDate = new Date(sh.start_time).toISOString().split('T')[0];

            const moneyIn = shiftLogs.filter(t => t.type === 'Money In').reduce((s, t) => s + (t.amount || 0), 0);
            const moneyOut = shiftLogs.filter(t => t.type === 'Money Out').reduce((s, t) => s + (t.amount || 0), 0);

            const openTotal = (sh.open_cash||0) + (sh.open_mpesa||0) + (sh.open_kcb||0) + (sh.open_kcb_bank||0) + (sh.open_equity||0);
            const closeTotal = (sh.close_cash||0) + (sh.close_mpesa||0) + (sh.close_kcb||0) + (sh.close_kcb_bank||0) + (sh.close_equity||0);

            // Fix: Check status correctly (case insensitive)
            const isClosed = sh.status && sh.status.toLowerCase() === 'closed';
            
            const expected = sh.system_expected_total || (openTotal + totalRevenue + moneyIn - moneyOut);
            
            // LOGIC FOR VARIANCE DISPLAY
            let varianceVal = isClosed ? (closeTotal - expected) : 0;
            let varianceDisplay = '';
            let varianceClass = '';

            if (!isClosed) {
                varianceDisplay = 'OPEN';
                varianceClass = 'status-open';
            } else {
                // If closed, check the amount for sign and color
                if (varianceVal > 0) {
                    varianceDisplay = '+ ' + varianceVal.toLocaleString();
                    varianceClass = 'var-positive';
                } else if (varianceVal < 0) {
                    varianceDisplay = varianceVal.toLocaleString();
                    varianceClass = 'var-negative';
                } else {
                    varianceDisplay = 'BALANCED';
                    varianceClass = 'var-balanced';
                }
            }

            const startD = new Date(sh.start_time);
            const endD = sh.end_time ? new Date(sh.end_time) : null;
            
            // Build payment methods HTML using pre-calculated totals, wrapped in a link
            let paymentMethodsHtml = '';
            
            // Only show if there are sales
            if (cashSales > 0 || kcbPaybillSales > 0 || totalRevenue > 0) {
                if (cashSales > 0) {
                    paymentMethodsHtml += `
                        <div class="payment-method-item">
                            <span class="payment-label">Cash</span>
                            <span class="payment-amount positive">+${cashSales.toLocaleString()}</span>
                        </div>
                    `;
                }
                if (kcbPaybillSales > 0) {
                    paymentMethodsHtml += `
                        <div class="payment-method-item">
                            <span class="payment-label">KCB Paybill</span>
                            <span class="payment-amount positive">+${kcbPaybillSales.toLocaleString()}</span>
                        </div>
                    `;
                }
            } else {
                paymentMethodsHtml = '<div class="payment-method-item"><span class="payment-label">No sales recorded</span><span class="payment-amount">0</span></div>';
            }
            
            // Add total revenue at the bottom, wrapped in a link
            paymentMethodsHtml += `
                <a href="sales_reports.html?date=${shiftDate}" class="revenue-card" style="display: block; text-decoration: none; margin-top: 8px;">
                    <div class="payment-method-item" style="margin-top:8px; padding-top:8px; border-top:2px solid var(--border);">
                        <span class="payment-label" style="font-weight:800;">📊 TOTAL SALES</span>
                        <span class="payment-amount" style="font-weight:800; color:var(--primary);">+${totalRevenue.toLocaleString()}</span>
                    </div>
                    <div style="font-size:0.6rem; color:var(--primary); font-weight:800; margin-top:4px; text-align:right">CLICK TO VIEW ➔</div>
                </a>
            `;
            
            tableHtml += `
                <tr>
                    <td class="date-cell">
                        <b>${startD.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric'})}</b>
                        <span class="time-pill">IN: ${startD.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span><br>
                        <span class="time-pill">${endD ? 'OUT: '+endD.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : 'ACTIVE'}</span>
                      </td>
                      <td>
                        <div class="account-line"><span class="account-label">Cash</span><span class="account-val">${(sh.open_cash||0).toLocaleString()}</span></div>
                        <div class="account-line"><span class="account-label">Mpesa</span><span class="account-val">${(sh.open_mpesa||0).toLocaleString()}</span></div>
                        <div class="account-line"><span class="account-label">KCB Float</span><span class="account-val">${(sh.open_kcb||0).toLocaleString()}</span></div>
                        <div class="account-line"><span class="account-label">Equity</span><span class="account-val">${(sh.open_equity||0).toLocaleString()}</span></div>
                        <div class="account-line"><span class="account-label">KCB Bank</span><span class="account-val">${(sh.open_kcb_bank||0).toLocaleString()}</span></div>
                        <div class="total-row">Total: ${openTotal.toLocaleString()}</div>
                      </td>
                    <td style="vertical-align: middle;">
                        <div style="background: #f8fafc; padding: 10px; border-radius: 8px;">
                            ${paymentMethodsHtml}
                        </div>
                    </td>
                    <td>
                        <a href="moneyinout.html" class="revenue-card">
                            <div class="account-line"><span class="account-label">In</span><span class="account-val" style="color:var(--success)">+${moneyIn.toLocaleString()}</span></div>
                            <div class="account-line"><span class="account-label">Out</span><span class="account-val" style="color:var(--danger)">-${moneyOut.toLocaleString()}</span></div>
                            <div style="font-size:0.6rem; color:var(--primary); font-weight:800; margin-top:8px; text-align:right">CLICK TO VIEW ➔</div>
                        </a>
                    </td>
                    <td>
                        <div class="account-line"><span class="account-label">Cash</span><span class="account-val">${(sh.close_cash||0).toLocaleString()}</span></div>
                        <div class="account-line"><span class="account-label">Mpesa</span><span class="account-val">${(sh.close_mpesa||0).toLocaleString()}</span></div>
                        <div class="account-line"><span class="account-label">KCB Float</span><span class="account-val">${(sh.close_kcb||0).toLocaleString()}</span></div>
                        <div class="account-line"><span class="account-label">Equity</span><span class="account-val">${(sh.close_equity||0).toLocaleString()}</span></div>
                        <div class="account-line"><span class="account-label">KCB Bank</span><span class="account-val">${(sh.close_kcb_bank||0).toLocaleString()}</span></div>
                        <div class="total-row" style="background:#f0f9ff">Total: ${closeTotal.toLocaleString()}</div>
                    </td>
                    <td>
                        <span class="status-badge ${varianceClass}">
                            ${varianceDisplay}
                        </span>
                        <div style="font-size: 0.65rem; color: var(--text-dim); margin-top: 8px; text-align: center;">
                            Expected: ${expected.toLocaleString()}
                        </div>
                    </td>
                    <td><div style="max-height: 120px; overflow-y: auto; font-size: 0.8rem; color: var(--text-dim); font-style: italic;">${sh.variance_note || 'No notes added.'}</div></td>
                </tr>`;
        });

        tbody.innerHTML = tableHtml || '<tr><td colspan="7" style="text-align:center; padding:50px;">No records found.</td></td>';
    }

    function renderMobile(data = allShifts) {
        const mobileContainer = document.getElementById('mobile-shifts-container');
        if (!mobileContainer) return;
        
        let mobileHtml = '';

        data.forEach(sh => {
            const shiftLogs = allTransactions.filter(t => t.shift_id === sh.id);
            
            // Use pre-calculated totals from the shift table
            const cashSales = sh.total_cash_sales || 0;
            const kcbPaybillSales = sh.total_kcb_paybill_sales || 0;
            const totalRevenue = sh.total_sales_amount || 0;
            
            // Format the date for the URL (YYYY-MM-DD)
            const shiftDate = new Date(sh.start_time).toISOString().split('T')[0];

            const moneyIn = shiftLogs.filter(t => t.type === 'Money In').reduce((s, t) => s + (t.amount || 0), 0);
            const moneyOut = shiftLogs.filter(t => t.type === 'Money Out').reduce((s, t) => s + (t.amount || 0), 0);

            const openTotal = (sh.open_cash||0) + (sh.open_mpesa||0) + (sh.open_kcb||0) + (sh.open_kcb_bank||0) + (sh.open_equity||0);
            const closeTotal = (sh.close_cash||0) + (sh.close_mpesa||0) + (sh.close_kcb||0) + (sh.close_kcb_bank||0) + (sh.close_equity||0);

            const isClosed = sh.status && sh.status.toLowerCase() === 'closed';
            
            const expected = sh.system_expected_total || (openTotal + totalRevenue + moneyIn - moneyOut);
            const varianceVal = isClosed ? (closeTotal - expected) : 0;
            
            const startD = new Date(sh.start_time);
            const endD = sh.end_time ? new Date(sh.end_time) : null;
            
            let statusClass = '';
            let statusText = '';
            
            if (!isClosed) {
                statusClass = 'status-open';
                statusText = 'OPEN';
            } else if (varianceVal > 0) {
                statusClass = 'var-positive';
                statusText = `+${varianceVal.toLocaleString()}`;
            } else if (varianceVal < 0) {
                statusClass = 'var-negative';
                statusText = varianceVal.toLocaleString();
            } else {
                statusClass = 'var-balanced';
                statusText = 'BALANCED';
            }
            
            // Build payment methods HTML for mobile using pre-calculated totals, wrapped in a link
            let paymentMethodsHtml = '';
            
            if (cashSales > 0) {
                paymentMethodsHtml += `
                    <div class="shift-mobile-detail-line">
                        <span class="shift-mobile-detail-label">Cash</span>
                        <span class="shift-mobile-detail-value" style="color:var(--success)">+${cashSales.toLocaleString()}</span>
                    </div>
                `;
            }
            if (kcbPaybillSales > 0) {
                paymentMethodsHtml += `
                    <div class="shift-mobile-detail-line">
                        <span class="shift-mobile-detail-label">KCB Paybill</span>
                        <span class="shift-mobile-detail-value" style="color:var(--success)">+${kcbPaybillSales.toLocaleString()}</span>
                    </div>
                `;
            }
            
            if (paymentMethodsHtml === '') {
                paymentMethodsHtml = '<div class="shift-mobile-detail-line"><span class="shift-mobile-detail-label">No sales recorded</span><span class="shift-mobile-detail-value">0</span></div>';
            }
            
            // Add total, wrapped in a link
            paymentMethodsHtml += `
                <a href="sales_reports.html?date=${shiftDate}" style="text-decoration: none; display: block;">
                    <div class="shift-mobile-total" style="margin-top:8px;">
                        Total Sales: +${totalRevenue.toLocaleString()}
                        <div style="font-size:0.6rem; color:var(--primary); font-weight:800; margin-top:4px;">➔ CLICK TO VIEW</div>
                    </div>
                </a>
            `;
            
            mobileHtml += `
                <div class="shift-mobile-card">
                    <div class="shift-mobile-header">
                        <div class="shift-mobile-date">
                            ${startD.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric'})}
                            <small>
                                ${startD.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}
                                ${endD ? ` - ${endD.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}` : ''}
                            </small>
                        </div>
                        <div class="shift-mobile-status ${statusClass}">
                            ${statusText}
                        </div>
                    </div>
                    
                    <div class="shift-mobile-grid">
                        <div class="shift-mobile-section">
                            <div class="shift-mobile-section-title">
                                <i class="fas fa-wallet"></i> OPENING FLOATS
                            </div>
                            <div class="shift-mobile-details">
                                <div class="shift-mobile-detail-line">
                                    <span class="shift-mobile-detail-label">Cash</span>
                                    <span class="shift-mobile-detail-value">${(sh.open_cash||0).toLocaleString()}</span>
                                </div>
                                <div class="shift-mobile-detail-line">
                                    <span class="shift-mobile-detail-label">Mpesa</span>
                                    <span class="shift-mobile-detail-value">${(sh.open_mpesa||0).toLocaleString()}</span>
                                </div>
                                <div class="shift-mobile-detail-line">
                                    <span class="shift-mobile-detail-label">KCB Float</span>
                                    <span class="shift-mobile-detail-value">${(sh.open_kcb||0).toLocaleString()}</span>
                                </div>
                                <div class="shift-mobile-detail-line">
                                    <span class="shift-mobile-detail-label">Equity</span>
                                    <span class="shift-mobile-detail-value">${(sh.open_equity||0).toLocaleString()}</span>
                                </div>
                                <div class="shift-mobile-detail-line">
                                    <span class="shift-mobile-detail-label">KCB Bank</span>
                                    <span class="shift-mobile-detail-value">${(sh.open_kcb_bank||0).toLocaleString()}</span>
                                </div>
                                <div class="shift-mobile-total">
                                    Total: ${openTotal.toLocaleString()}
                                </div>
                            </div>
                        </div>
                        
                        <div class="shift-mobile-section">
                            <div class="shift-mobile-section-title">
                                <i class="fas fa-cash-register"></i> PAYMENT METHOD
                            </div>
                            <div class="shift-mobile-details">
                                ${paymentMethodsHtml}
                            </div>
                        </div>
                        
                        <div class="shift-mobile-section">
                            <div class="shift-mobile-section-title">
                                <i class="fas fa-exchange-alt"></i> MONEY IN/OUT
                            </div>
                            <div class="shift-mobile-details">
                                <div class="shift-mobile-detail-line">
                                    <span class="shift-mobile-detail-label">Money In</span>
                                    <span class="shift-mobile-detail-value" style="color:var(--success)">+${moneyIn.toLocaleString()}</span>
                                </div>
                                <div class="shift-mobile-detail-line">
                                    <span class="shift-mobile-detail-label">Money Out</span>
                                    <span class="shift-mobile-detail-value" style="color:var(--danger)">-${moneyOut.toLocaleString()}</span>
                                </div>
                            </div>
                        </div>
                        
                        <div class="shift-mobile-section">
                            <div class="shift-mobile-section-title">
                                <i class="fas fa-safe"></i> CLOSING FLOATS
                            </div>
                            <div class="shift-mobile-details">
                                <div class="shift-mobile-detail-line">
                                    <span class="shift-mobile-detail-label">Cash</span>
                                    <span class="shift-mobile-detail-value">${(sh.close_cash||0).toLocaleString()}</span>
                                </div>
                                <div class="shift-mobile-detail-line">
                                    <span class="shift-mobile-detail-label">Mpesa</span>
                                    <span class="shift-mobile-detail-value">${(sh.close_mpesa||0).toLocaleString()}</span>
                                </div>
                                <div class="shift-mobile-detail-line">
                                    <span class="shift-mobile-detail-label">KCB Float</span>
                                    <span class="shift-mobile-detail-value">${(sh.close_kcb||0).toLocaleString()}</span>
                                </div>
                                <div class="shift-mobile-detail-line">
                                    <span class="shift-mobile-detail-label">Equity</span>
                                    <span class="shift-mobile-detail-value">${(sh.close_equity||0).toLocaleString()}</span>
                                </div>
                                <div class="shift-mobile-detail-line">
                                    <span class="shift-mobile-detail-label">KCB Bank</span>
                                    <span class="shift-mobile-detail-value">${(sh.close_kcb_bank||0).toLocaleString()}</span>
                                </div>
                                <div class="shift-mobile-total" style="background:#f0f9ff">
                                    Total: ${closeTotal.toLocaleString()}
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="shift-mobile-expected">
                        Expected: ${expected.toLocaleString()}
                    </div>
                    
                    ${sh.variance_note ? `
                        <div class="shift-mobile-variance-note">
                            <strong>Note:</strong> ${sh.variance_note}
                        </div>
                    ` : ''}
                    
                    <div class="shift-mobile-actions">
                        <a href="sales_reports.html?date=${shiftDate}" class="shift-mobile-action-btn sales-action">
                            <i class="fas fa-chart-line"></i> Sales Report
                        </a>
                        <a href="moneyinout.html" class="shift-mobile-action-btn money-action">
                            <i class="fas fa-money-bill-wave"></i> Money Log
                        </a>
                    </div>
                </div>
            `;
        });

        mobileContainer.innerHTML = mobileHtml || '<div class="no-results"><i class="fas fa-search"></i><p>No shift records found</p></div>';
    }

    function filterData(searchTerm) {
        const filtered = allShifts.filter(sh => {
            const dateStr = new Date(sh.start_time).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric'}).toLowerCase();
            const status = (sh.status || '').toLowerCase();
            const note = (sh.variance_note || '').toLowerCase();
            
            return dateStr.includes(searchTerm) || 
                   status.includes(searchTerm) ||
                   note.includes(searchTerm);
        });
        
        render(filtered);
    }

    document.getElementById('auditSearch').addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase().trim();
        if (term === '') {
            render(allShifts);
        } else {
            filterData(term);
        }
    });

    async function refreshData() {
        const btn = document.getElementById('refreshBtn');
        const originalHtml = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
        btn.disabled = true;
        
        await fetchData();
        
        btn.innerHTML = originalHtml;
        btn.disabled = false;
        
        btn.style.background = '#10b981';
        setTimeout(() => {
            btn.style.background = '';
        }, 1000);
    }

    // Handle window resize
    window.addEventListener('resize', function() {
        const newIsMobile = window.innerWidth <= 768;
        if (newIsMobile !== isMobile) {
            isMobile = newIsMobile;
            render();
        }
    });

    // Initialize on load
    document.addEventListener('DOMContentLoaded', async function() {
        const profile = await loadUserProfile();
        if (profile) {
            await fetchData();
        }
        
        // Check if we're on mobile initially
        isMobile = window.innerWidth <= 768;
    });
</script><!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>ChamaEase | Monthly Records</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #1e2a3e;
        }

        :root {
            --primary: #2c7a4d;
            --primary-light: #eaf5ef;
            --primary-dark: #1f5a3a;
            --danger: #dc4c4c;
            --gray-border: #e2e8f0;
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.04);
            --radius-card: 16px;
            --radius-btn: 32px;
            --sidebar-width: 280px;
        }

        .app-wrapper {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: white;
            border-right: 1px solid var(--gray-border);
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            overflow-y: auto;
            transition: transform 0.3s ease;
            z-index: 1000;
            box-shadow: var(--shadow-sm);
            transform: translateX(0);
        }

        .sidebar-header {
            padding: 1rem;
            border-bottom: 1px solid var(--gray-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-logo {
            font-weight: 800;
            font-size: 1.2rem;
            background: linear-gradient(135deg, var(--primary), #3b9b62);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .sidebar-close {
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            color: #94a3b8;
            display: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            align-items: center;
            justify-content: center;
        }

        .sidebar-close:hover {

<script src="supabase-config.js"></script>
<script>
// ============================================
// MONTHLY RECORDS - SPREADSHEET STYLE
// With auto-save, month/year persistence, copy feature
// ============================================

let allMembers = [];
let allRecords = [];
let currentMonth = 10; // October (default)
let currentYear = 2025; // 2025 (default)
let saveTimeout = null;
let pendingSaves = new Map();

let availableYears = [];
let monthNames = ["JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE", "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"];

// Get time-based footer message
function getFooterMessage() {
    const hour = new Date().getHours();
    if (hour < 12) return "🌅 Good morning! Have a productive day managing your Chama.";
    if (hour < 17) return "☀️ Good afternoon! Keep up the great work with your records.";
    return "🌙 Good evening! Wishing you a peaceful rest after a productive day.";
}

// Update footer with dynamic message
function updateFooter() {
    const footer = document.getElementById("footerMessage");
    if (footer) {
        footer.innerHTML = `✨ ${getFooterMessage()} ✨`;
    }
}

// Save selected period to localStorage
function saveSelectedPeriod() {
    localStorage.setItem("chama_selected_month", currentMonth);
    localStorage.setItem("chama_selected_year", currentYear);
}

// Load saved period from localStorage
function loadSavedPeriod() {
    const savedMonth = localStorage.getItem("chama_selected_month");
    const savedYear = localStorage.getItem("chama_selected_year");
    if (savedMonth && savedMonth >= 1 && savedMonth <= 12) {
        currentMonth = parseInt(savedMonth);
    }
    if (savedYear && savedYear >= 2020 && savedYear <= 2030) {
        currentYear = parseInt(savedYear);
    }
}

// Sidebar functions
function openSidebar() {
    document.getElementById("sidebar").classList.add("open");
    document.getElementById("sidebarOverlay").classList.add("active");
}

function closeSidebar() {
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("sidebarOverlay").classList.remove("active");
}

document.getElementById("menuToggle").addEventListener("click", openSidebar);
document.getElementById("sidebarClose").addEventListener("click", closeSidebar);
document.getElementById("sidebarOverlay").addEventListener("click", closeSidebar);
document.getElementById("logoutBtn").addEventListener("click", async function() {
    await logoutUser();
    window.location.href = "index.html";
});

function showToast(message, isError = false) {
    const toast = document.createElement('div');
    toast.className = `toast-notification ${isError ? 'toast-error' : ''}`;
    toast.textContent = isError ? '⚠️ ' + message : '✓ ' + message;
    document.body.appendChild(toast);
    setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}

function safeValue(value) {
    if (value === null || value === undefined || value === '' || isNaN(value)) {
        return 0;
    }
    return parseFloat(value);
}

function formatNumber(num) {
    if (num === null || num === undefined) return "0";
    return num.toLocaleString('en-KE');
}

function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/[&<>]/g, function(m) {
        if (m === "&") return "&amp;";
        if (m === "<") return "&lt;";
        if (m === ">") return "&gt;";
        return m;
    });
}

async function loadData() {
    updateFooter();
    try {
        const { data: membersData, error: membersError } = await supabaseClient
            .from("members")
            .select("*")
            .order("name");
        
        if (membersError) throw membersError;
        allMembers = membersData || [];
        
        const { data: recordsData, error: recordsError } = await supabaseClient
            .from("monthly_records")
            .select("*");
        
        if (recordsError) throw recordsError;
        allRecords = recordsData || [];
        
        // Extract available years from records
        var yearsSet = new Set();
        for (var i = 0; i < allRecords.length; i++) {
            yearsSet.add(allRecords[i].year);
        }
        // Add surrounding years
        var currentYearNum = new Date().getFullYear();
        yearsSet.add(currentYearNum - 2);
        yearsSet.add(currentYearNum - 1);
        yearsSet.add(currentYearNum);
        yearsSet.add(currentYearNum + 1);
        yearsSet.add(currentYearNum + 2);
        
        availableYears = Array.from(yearsSet).sort((a, b) => b - a);
        
        renderSpreadsheet();
    } catch (error) {
        document.getElementById("app-root").innerHTML = '<div style="padding:2rem;text-align:center"><h3>⚠️ Error</h3><p>' + error.message + '</p><button class="btn" onclick="location.reload()">Retry</button></div>';
    }
}

function getRecordForMember(memberId) {
    for (var i = 0; i < allRecords.length; i++) {
        var record = allRecords[i];
        if (record.member_id === memberId && record.month === currentMonth && record.year === currentYear) {
            return record;
        }
    }
    return null;
}

function getRecordValue(memberId, field) {
    var record = getRecordForMember(memberId);
    if (record && record[field] !== null && record[field] !== undefined) {
        return record[field];
    }
    return 0;
}

async function updateRecordValue(memberId, field, value, isBulkSave = false) {
    var record = getRecordForMember(memberId);
    var numValue = safeValue(value);
    
    try {
        if (record) {
            var updateData = {};
            updateData[field] = numValue;
            updateData.updated_at = new Date().toISOString();
            
            var { error } = await supabaseClient
                .from("monthly_records")
                .update(updateData)
                .eq("id", record.id);
            
            if (error) throw error;
            record[field] = numValue;
        } else {
            var newRecord = {
                member_id: memberId,
                month: currentMonth,
                year: currentYear,
                loan: 0,
                loan_deductions: 0,
                loan_balance: 0,
                monthly_contribution: 0,
                penalties: 0
            };
            newRecord[field] = numValue;
            
            var { data, error } = await supabaseClient
                .from("monthly_records")
                .insert([newRecord])
                .select();
            
            if (error) throw error;
            if (data && data[0]) {
                allRecords.push(data[0]);
            }
        }
        updateTotalsRow();
        if (!isBulkSave) {
            showToast("Saved");
        }
        return true;
    } catch (error) {
        console.error("Update error:", error);
        if (!isBulkSave) {
            showToast(error.message, true);
        }
        return false;
    }
}

function updateTotalsRow() {
    var totalLoan = 0;
    var totalLoanDeductions = 0;
    var totalLoanBalance = 0;
    var totalMonthlyContribution = 0;
    var totalPenalties = 0;
    
    for (var i = 0; i < allMembers.length; i++) {
        var member = allMembers[i];
        totalLoan += safeValue(getRecordValue(member.id, "loan"));
        totalLoanDeductions += safeValue(getRecordValue(member.id, "loan_deductions"));
        totalLoanBalance += safeValue(getRecordValue(member.id, "loan_balance"));
        totalMonthlyContribution += safeValue(getRecordValue(member.id, "monthly_contribution"));
        totalPenalties += safeValue(getRecordValue(member.id, "penalties"));
    }
    
    var totalsRow = document.getElementById("totals-row");
    if (totalsRow) {
        var cells = totalsRow.getElementsByTagName("td");
        if (cells.length >= 6) {
            cells[1].innerHTML = "KES " + formatNumber(totalLoan);
            cells[2].innerHTML = "KES " + formatNumber(totalLoanDeductions);
            cells[3].innerHTML = "KES " + formatNumber(totalLoanBalance);
            cells[4].innerHTML = "KES " + formatNumber(totalMonthlyContribution);
            cells[5].innerHTML = "KES " + formatNumber(totalPenalties);
        }
    }
}

async function saveAllChanges() {
    if (pendingSaves.size === 0) {
        showToast("No pending changes", true);
        return;
    }
    
    var saveBtn = document.getElementById("saveAllBtn");
    if (saveBtn) {
        saveBtn.disabled = true;
        saveBtn.innerHTML = '⏳ Saving...';
    }
    
    var successCount = 0;
    var errorCount = 0;
    
    for (var [key, change] of pendingSaves) {
        try {
            await updateRecordValue(change.memberId, change.field, change.value, true);
            successCount++;
            pendingSaves.delete(key);
        } catch (error) {
            errorCount++;
        }
    }
    
    if (saveBtn) {
        saveBtn.disabled = false;
        saveBtn.innerHTML = '💾 Save All Changes';
    }
    
    var pendingSpan = document.getElementById("pendingCount");
    if (pendingSpan) {
        pendingSpan.style.display = 'none';
        pendingSpan.textContent = '0';
    }
    
    if (successCount > 0) {
        showToast("Saved " + successCount + " change(s)");
    }
    if (errorCount > 0) {
        showToast("Failed to save " + errorCount + " item(s)", true);
    }
}

// Copy table data to clipboard
async function copyToClipboard() {
    var table = document.getElementById("data-table");
    if (!table) {
        showToast("No data to copy", true);
        return;
    }
    
    var rows = table.getElementsByTagName("tr");
    var copyText = "";
    
    for (var i = 0; i < rows.length; i++) {
        var cells = rows[i].getElementsByTagName("td");
        var headers = rows[i].getElementsByTagName("th");
        var rowText = [];
        
        if (headers.length > 0) {
            for (var j = 0; j < headers.length; j++) {
                rowText.push(headers[j].innerText.trim());
            }
        } else {
            for (var j = 0; j < cells.length; j++) {
                var input = cells[j].querySelector("input");
                if (input) {
                    rowText.push(input.value);
                } else {
                    rowText.push(cells[j].innerText.trim());
                }
            }
        }
        copyText += rowText.join("\t") + "\n";
    }
    
    try {
        await navigator.clipboard.writeText(copyText);
        showToast("Table copied to clipboard!");
    } catch (err) {
        showToast("Failed to copy", true);
    }
}

window.handleCellChange = function(memberId, field, event) {
    var newValue = event.target.value;
    var savingSpan = document.getElementById("savingStatus");
    if (savingSpan) {
        savingSpan.innerHTML = "⏳ Pending...";
        savingSpan.className = "saving-status saving";
    }
    
    var changeKey = memberId + '_' + field;
    pendingSaves.set(changeKey, { memberId, field, value: newValue });
    
    var pendingSpan = document.getElementById("pendingCount");
    if (pendingSpan) {
        pendingSpan.textContent = pendingSaves.size;
        pendingSpan.style.display = pendingSaves.size > 0 ? 'inline-block' : 'none';
    }
    
    if (saveTimeout) clearTimeout(saveTimeout);
    saveTimeout = setTimeout(function() {
        if (pendingSaves.size > 0) {
            saveAllChanges();
            if (savingSpan) {
                savingSpan.innerHTML = "✓ Saved";
                setTimeout(function() {
                    if (savingSpan) savingSpan.innerHTML = "";
                }, 2000);
            }
        }
    }, 1500);
};

function exportToExcel() {
    var monthName = monthNames[currentMonth - 1];
    
    var csvRows = [];
    csvRows.push(["CHAMA RECORDS - " + monthName + " " + currentYear]);
    csvRows.push(["Generated:", new Date().toLocaleString()]);
    csvRows.push([]);
    csvRows.push(["MEMBER", "LOAN (KES)", "LOAN DEDUCTIONS (KES)", "LOAN BALANCE (KES)", "MONTHLY CONTRIBUTION (KES)", "PENALTIES (KES)"]);
    
    for (var i = 0; i < allMembers.length; i++) {
        var member = allMembers[i];
        csvRows.push([
            member.name,
            formatNumber(safeValue(getRecordValue(member.id, "loan"))),
            formatNumber(safeValue(getRecordValue(member.id, "loan_deductions"))),
            formatNumber(safeValue(getRecordValue(member.id, "loan_balance"))),
            formatNumber(safeValue(getRecordValue(member.id, "monthly_contribution"))),
            formatNumber(safeValue(getRecordValue(member.id, "penalties")))
        ]);
    }
    
    var totalLoan = 0, totalLoanDeductions = 0, totalLoanBalance = 0, totalMonthlyContribution = 0, totalPenalties = 0;
    for (var i = 0; i < allMembers.length; i++) {
        var member = allMembers[i];
        totalLoan += safeValue(getRecordValue(member.id, "loan"));
        totalLoanDeductions += safeValue(getRecordValue(member.id, "loan_deductions"));
        totalLoanBalance += safeValue(getRecordValue(member.id, "loan_balance"));
        totalMonthlyContribution += safeValue(getRecordValue(member.id, "monthly_contribution"));
        totalPenalties += safeValue(getRecordValue(member.id, "penalties"));
    }
    csvRows.push(["TOTAL", formatNumber(totalLoan), formatNumber(totalLoanDeductions), formatNumber(totalLoanBalance), formatNumber(totalMonthlyContribution), formatNumber(totalPenalties)]);
    
    var csv = "";
    for (var i = 0; i < csvRows.length; i++) {
        csv += csvRows[i].join(",") + "\n";
    }
    
    var blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    var link = document.createElement("a");
    var url = URL.createObjectURL(blob);
    link.href = url;
    link.setAttribute("download", "chama_" + monthName + "_" + currentYear + ".csv");
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
    showToast("Excel file downloaded!");
}

    printWindow.document.write("</body></html>");
    printWindow.document.close();
    printWindow.print();
    showToast("PDF ready for printing");
}

        totalLoan += safeValue(getRecordValue(member.id, "loan"));

    message += "━━━━━━━━━━━━━━━━━━━━━\n";

    message += "└─ ⚠️ Total Penalties: KES " + formatNumber(totalPenalties) + "\n\n";
    message += "📅 Generated by ChamaEase";
    
    var encodedMessage = encodeURIComponent(message);
    var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

function renderSpreadsheet() {
    var container = document.getElementById("app-root");
    
    // Build month options
    var monthOptions = '';
    for (var i = 1; i <= 12; i++) {
        var selected = (currentMonth === i) ? 'selected' : '';
        monthOptions += '<option value="' + i + '" ' + selected + '>' + monthNames[i - 1] + '</option>';
    }
    
    // Build year options
    var yearOptions = '';
    for (var i = 0; i < availableYears.length; i++) {
        var selected = (currentYear === availableYears[i]) ? 'selected' : '';
        yearOptions += '<option value="' + availableYears[i] + '" ' + selected + '>' + availableYears[i] + '</option>';
    }
    
    var tableRows = "";
    
    for (var i = 0; i < allMembers.length; i++) {
        var member = allMembers[i];
        var loan = safeValue(getRecordValue(member.id, "loan"));
        var loanDeductions = safeValue(getRecordValue(member.id, "loan_deductions"));
        var loanBalance = safeValue(getRecordValue(member.id, "loan_balance"));
        var monthlyContribution = safeValue(getRecordValue(member.id, "monthly_contribution"));
        var penalties = safeValue(getRecordValue(member.id, "penalties"));
        
        tableRows += '<tr>';
        tableRows += '<td class="member-name-cell"><strong>' + escapeHtml(member.name) + '</strong></tr>';
        tableRows += '<td><input type="number" value="' + loan + '" step="any" onchange="handleCellChange(\'' + member.id + '\', \'loan\', event)" placeholder="0"></td>';
        tableRows += '<td><input type="number" value="' + loanDeductions + '" step="any" onchange="handleCellChange(\'' + member.id + '\', \'loan_deductions\', event)" placeholder="0"></td>';
        tableRows += '<td><input type="number" value="' + loanBalance + '" step="any" onchange="handleCellChange(\'' + member.id + '\', \'loan_balance\', event)" placeholder="0"></td>';
        tableRows += '<td><input type="number" value="' + monthlyContribution + '" step="any" onchange="handleCellChange(\'' + member.id + '\', \'monthly_contribution\', event)" placeholder="0"></td>';
        tableRows += '<td><input type="number" value="' + penalties + '" step="any" onchange="handleCellChange(\'' + member.id + '\', \'penalties\', event)" placeholder="0"></td>';
        tableRows += '</tr>';
    }
    
    if (allMembers.length === 0) {
        tableRows = '<tr><td colspan="6" style="text-align:center; padding: 2rem;">👥 No members found. Please <a href="members.html">add members</a> first.</td></tr>';
    }
    
    var totalLoan = 0, totalLoanDeductions = 0, totalLoanBalance = 0, totalMonthlyContribution = 0, totalPenalties = 0;
    
    for (var i = 0; i < allMembers.length; i++) {
        var member = allMembers[i];
        totalLoan += safeValue(getRecordValue(member.id, "loan"));
        totalLoanDeductions += safeValue(getRecordValue(member.id, "loan_deductions"));
        totalLoanBalance += safeValue(getRecordValue(member.id, "loan_balance"));
        totalMonthlyContribution += safeValue(getRecordValue(member.id, "monthly_contribution"));
        totalPenalties += safeValue(getRecordValue(member.id, "penalties"));
    }
    
    var html = `
        <div class="records-header-section">
            <div class="filter-row">
                <div class="filter-item">
                    <label class="filter-label">📅 Select Month</label>
                    <select id="monthSelect" class="filter-select">${monthOptions}</select>
                </div>
                <div class="filter-item">
                    <label class="filter-label">📆 Select Year</label>
                    <select id="yearSelect" class="filter-select">${yearOptions}</select>
                </div>
                <div class="filter-item">
                    <div class="active-period-badge">
                        📍 Showing: <strong>${monthNames[currentMonth - 1]} ${currentYear}</strong>
                    </div>
                </div>
            </div>
            
            <div class="action-buttons-row">
                <span id="savingStatus" class="saving-status"></span>
                <button class="action-btn btn-copy" id="copyTableBtn">
                    📋 Copy Table
                </button>
                <button class="action-btn btn-save" id="saveAllBtn">
                    💾 Save All <span id="pendingCount" class="pending-badge" style="display:none;">0</span>
                </button>
                <button class="action-btn btn-excel" id="exportExcelBtn">
                    📊 Export Excel
                </button>
                <button class="action-btn btn-pdf" id="exportPDFBtn">
                    📄 Export PDF
                </button>
                <button class="action-btn btn-share" id="shareWABtn">
                    📱 Share to WhatsApp
                </button>
            </div>
        </div>
        
        <div class="spreadsheet-container">
            <table class="spreadsheet-table" id="data-table">
                <thead>
                    <tr>
                        <th style="min-width:140px;">👤 MEMBER</th>
                        <th style="min-width:120px;">💰 LOAN (KES)</th>
                        <th style="min-width:150px;">📉 LOAN DEDUCTIONS (KES)</th>
                        <th style="min-width:140px;">⚖️ LOAN BALANCE (KES)</th>
                        <th style="min-width:170px;">📋 MONTHLY CONTRIBUTION (KES)</th>
                        <th style="min-width:120px;">⚠️ PENALTIES (KES)</th>
                    </tr>
                </thead>
                <tbody>
                    ${tableRows}
                    <tr id="totals-row" class="totals-row">
                        <td><strong>📊 TOTAL</strong></td>
                        <td><strong>KES ${formatNumber(totalLoan)}</strong></td>
                        <td><strong>KES ${formatNumber(totalLoanDeductions)}</strong></td>
                        <td><strong>KES ${formatNumber(totalLoanBalance)}</strong></td>
                        <td><strong>KES ${formatNumber(totalMonthlyContribution)}</strong></td>
                        <td><strong>KES ${formatNumber(totalPenalties)}</strong></td>
                    </tr>
                </tbody>
            </table>
        </div>
        
        <div style="margin-top: 1rem; padding: 0.8rem; background: var(--primary-light); border-radius: 12px; text-align: center; font-size: 0.75rem; color: var(--primary);">
            💡 <strong>Tip:</strong> Click any cell to edit. Changes auto-save after 1.5 seconds or use "Save All Changes" button.
        </div>
    `;
    
    container.innerHTML = html;
    
    // Auto-update when month or year changes (no apply button needed)
    document.getElementById("monthSelect").addEventListener("change", function() {
        if (pendingSaves.size > 0 && confirm("You have unsaved changes. Change period anyway?")) {
            saveAllChanges();
        }
        currentMonth = parseInt(document.getElementById("monthSelect").value);
        currentYear = parseInt(document.getElementById("yearSelect").value);
        saveSelectedPeriod();
        renderSpreadsheet();
    });
    
    document.getElementById("yearSelect").addEventListener("change", function() {
        if (pendingSaves.size > 0 && confirm("You have unsaved changes. Change period anyway?")) {
            saveAllChanges();
        }
        currentMonth = parseInt(document.getElementById("monthSelect").value);
        currentYear = parseInt(document.getElementById("yearSelect").value);
        saveSelectedPeriod();
        renderSpreadsheet();
    });
    
    document.getElementById("saveAllBtn").addEventListener("click", saveAllChanges);
    document.getElementById("copyTableBtn").addEventListener("click", copyToClipboard);
    document.getElementById("exportExcelBtn").addEventListener("click", exportToExcel);
    document.getElementById("exportPDFBtn").addEventListener("click", exportToPDF);
    document.getElementById("shareWABtn").addEventListener("click", shareToWhatsApp);
}
