<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ChamaEase | Settings</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #1e2a3e;
        }

        :root {
            --primary: #2c7a4d;
            --primary-light: #eaf5ef;
            --primary-dark: #1f5a3a;
            --danger: #dc4c4c;
            --warning: #e6a017;
            --gray-border: #e2e8f0;
            --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.04);
            --radius-card: 20px;
            --radius-btn: 32px;
            --sidebar-width: 260px;
        }

        .app-wrapper {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: white;
            border-right: 1px solid var(--gray-border);
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            overflow-y: auto;
            transition: all 0.3s ease;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }

        .sidebar-header {
            padding: 1.2rem;
            border-bottom: 1px solid var(--gray-border);
            text-align: center;
        }

        .sidebar-logo {
            font-weight: 800;
            font-size: 1.3rem;
            background: linear-gradient(135deg, var(--primary), #3b9b62);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .sidebar-nav {
            padding: 1rem 0;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0.8rem 1.2rem;
            margin: 0.2rem 0.8rem;
            border-radius: 12px;
            text-decoration: none;
            color: #4a5568;
            transition: all 0.2s;
            cursor: pointer;
        }

        .nav-item:hover {
            background: var(--primary-light);
            color: var(--primary);
        }

        .nav-item.active {
            background: var(--primary);
            color: white;
        }

        .nav-item .icon {
            font-size: 1.2rem;
            width: 24px;
            text-align: center;
        }

        .nav-item .label {
            font-weight: 500;
            font-size: 0.9rem;
        }

        .nav-submenu {
            padding-left: 3rem;
        }

        .nav-submenu .nav-item {
            padding: 0.6rem 1rem;
            font-size: 0.85rem;
        }

        .nav-divider {
            height: 1px;
            background: var(--gray-border);
            margin: 0.8rem 1.2rem;
        }

        .main-content {
            flex: 1;
            margin-left: var(--sidebar-width);
            transition: all 0.3s ease;
        }

        .top-bar {
            background: white;
            padding: 0.8rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--gray-border);
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 0;
            z-index: 99;
        }

        .menu-toggle {
            display: none;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--primary);
        }

        .page-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #1e2a3e;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .user-email {
            font-size: 0.85rem;
            color: #5b6e8c;
        }

        .logout-btn {
            background: transparent;
            border: 1px solid #dc2626;
            color: #dc2626;
            padding: 0.4rem 1rem;
            border-radius: 2rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            background: #dc2626;
            color: white;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 1.5rem;
            width: 100%;
            min-height: 70vh;
        }

        .card {
            background: white;
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-sm);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--gray-border);
        }

        .btn {
            border: none;
            background: var(--primary);
            color: white;
            padding: 0.6rem 1.2rem;
            border-radius: var(--radius-btn);
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
        }

        .btn-danger {
            background: var(--danger);
        }

        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-bottom: 1.2rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
            color: #1e2a3e;
        }

        input, select {
            width: 100%;
            padding: 0.7rem 1rem;
            border-radius: 1rem;
            border: 1px solid var(--gray-border);
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(44, 122, 77, 0.1);
        }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
            border-bottom: 1px solid var(--gray-border);
        }

        .setting-item:last-child {
            border-bottom: none;
        }

        .setting-info h4 {
            font-size: 1rem;
            margin-bottom: 0.2rem;
        }

        .setting-info p {
            font-size: 0.8rem;
            color: #6c757d;
        }

        .toggle-switch {
            width: 50px;
            height: 26px;
            background: #cbd5e1;
            border-radius: 30px;
            position: relative;
            cursor: pointer;
            transition: all 0.3s;
        }

        .toggle-switch.active {
            background: var(--primary);
        }

        .toggle-switch::after {
            content: '';
            width: 22px;
            height: 22px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 3px;
            transition: all 0.3s;
        }

        .toggle-switch.active::after {
            left: 25px;
        }

        .success-message {
            background: #dff0e4;
            color: #2c7a4d;
            padding: 0.8rem;
            border-radius: 1rem;
            margin-bottom: 1rem;
            font-size: 0.85rem;
        }

        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 0.8rem;
            border-radius: 1rem;
            margin-bottom: 1rem;
            font-size: 0.85rem;
        }

        footer {
            text-align: center;
            padding: 1rem;
            font-size: 0.8rem;
            color: #6c757d;
            border-top: 1px solid var(--gray-border);
            margin-top: 1rem;
        }

        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid #e2e8f0;
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .main-content {
                margin-left: 0;
            }
            .menu-toggle {
                display: block;
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="app-wrapper">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">🌿 ChamaEase</div>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item">
                <span class="icon">📊</span>
                <span class="label">Dashboard</span>
            </a>
            <a href="members.html" class="nav-item">
                <span class="icon">👥</span>
                <span class="label">Members</span>
            </a>
            <a href="contributions.html" class="nav-item">
                <span class="icon">💰</span>
                <span class="label">Contributions</span>
            </a>
            
            <div class="nav-divider"></div>
            
            <div class="nav-item" style="cursor: default; opacity: 0.7;">
                <span class="icon">📜</span>
                <span class="label">History</span>
            </div>
            <div class="nav-submenu">
                <a href="contribution-history.html" class="nav-item">
                    <span class="icon">📋</span>
                    <span class="label">Contributions History</span>
                </a>
                <a href="member-history.html" class="nav-item">
                    <span class="icon">👤</span>
                    <span class="label">Members History</span>
                </a>
            </div>
            
            <div class="nav-divider"></div>
            
            <div class="nav-item" style="cursor: default; opacity: 0.7;">
                <span class="icon">📈</span>
                <span class="label">Analytics</span>
            </div>
            <div class="nav-submenu">
                <a href="statistics.html" class="nav-item">
                    <span class="icon">📊</span>
                    <span class="label">Monthly Statistics</span>
                </a>
                <a href="reports.html" class="nav-item">
                    <span class="icon">📋</span>
                    <span class="label">Reports</span>
                </a>
            </div>
            
            <div class="nav-divider"></div>
            
            <a href="settings.html" class="nav-item active">
                <span class="icon">⚙️</span>
                <span class="label">Settings</span>
            </a>
        </nav>
    </aside>

    <main class="main-content">
        <div class="top-bar">
            <button class="menu-toggle" id="menuToggle">☰</button>
            <div class="page-title">⚙️ Settings</div>
            <div class="user-info">
                <span class="user-email" id="userEmail"></span>
                <button id="logoutBtn" class="logout-btn">Logout</button>
            </div>
        </div>
        <div id="app-root" class="container">
            <div style="text-align: center; padding: 2rem;">
                <div class="loading-spinner"></div>
                <p>Loading settings...</p>
            </div>
        </div>
        <footer>✨ Smart Chama Management · System settings and preferences</footer>
    </main>
</div>

<script src="supabase-config.js"></script>
<script>
    let currentUser = null;
    let emailNotifications = true;
    let darkMode = false;

    const menuToggle = document.getElementById('menuToggle');
    const sidebar = document.getElementById('sidebar');
    
    if (menuToggle) {
        menuToggle.addEventListener('click', () => {
            sidebar.classList.toggle('open');
        });
    }
    
    document.addEventListener('click', (e) => {
        if (window.innerWidth <= 768) {
            if (!sidebar.contains(e.target) && !menuToggle.contains(e.target)) {
                sidebar.classList.remove('open');
            }
        }
    });

    (async function() {
        const isAuth = await protectPage();
        if (!isAuth) return;
        
        currentUser = await getCurrentUser();
        if (currentUser) {
            document.getElementById('userEmail').textContent = currentUser.email || 'Admin';
        }
        
        renderSettings();
    })();

    document.getElementById('logoutBtn').addEventListener('click', async () => {
        await logoutUser();
        window.location.href = 'index.html';
    });

    function showMessage(message, type) {
        const msgDiv = document.getElementById('messageArea');
        if (msgDiv) {
            msgDiv.innerHTML = `<div class="${type === 'error' ? 'error-message' : 'success-message'}">${message}</div>`;
            setTimeout(() => {
                if (msgDiv.innerHTML) msgDiv.innerHTML = '';
            }, 4000);
        } else {
            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed;
                bottom: 20px;
                right: 20px;
                background: ${type === 'error' ? '#dc2626' : '#2c7a4d'};
                color: white;
                padding: 12px 20px;
                border-radius: 40px;
                font-size: 0.85rem;
                z-index: 1001;
            `;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
    }

    async function updatePassword() {
        const currentPassword = document.getElementById('currentPassword')?.value;
        const newPassword = document.getElementById('newPassword')?.value;
        const confirmPassword = document.getElementById('confirmPassword')?.value;
        
        if (!currentPassword || !newPassword || !confirmPassword) {
            showMessage('Please fill in all password fields', 'error');
            return;
        }
        
        if (newPassword !== confirmPassword) {
            showMessage('New passwords do not match', 'error');
            return;
        }
        
        if (newPassword.length < 6) {
            showMessage('Password must be at least 6 characters', 'error');
            return;
        }
        
        try {
            const { error } = await supabaseClient.auth.updateUser({
                password: newPassword
            });
            
            if (error) throw error;
            
            showMessage('✅ Password updated successfully!', 'success');
            document.getElementById('currentPassword').value = '';
            document.getElementById('newPassword').value = '';
            document.getElementById('confirmPassword').value = '';
            
        } catch (error) {
            console.error("Password update error:", error);
            showMessage(error.message || 'Error updating password', 'error');
        }
    }

    async function updateProfile() {
        const fullName = document.getElementById('fullName')?.value;
        const phone = document.getElementById('phone')?.value;
        
        if (!fullName) {
            showMessage('Please enter your name', 'error');
            return;
        }
        
        try {
            const { error } = await supabaseClient.auth.updateUser({
                data: { full_name: fullName, phone: phone }
            });
            
            if (error) throw error;
            
            showMessage('✅ Profile updated successfully!', 'success');
            
        } catch (error) {
            console.error("Profile update error:", error);
            showMessage(error.message || 'Error updating profile', 'error');
        }
    }

    async function exportAllData() {
        try {
            const [membersRes, contribRes] = await Promise.all([
                supabaseClient.from('members').select('*'),
                supabaseClient.from('contributions').select('*, members:member_id(name)')
            ]);
            
            const exportData = {
                exported_at: new Date().toISOString(),
                members: membersRes.data || [],
                contributions: contribRes.data || []
            };
            
            const dataStr = JSON.stringify(exportData, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `chamaease_backup_${new Date().toISOString().slice(0,10)}.json`;
            link.click();
            URL.revokeObjectURL(link.href);
            
            showMessage('✅ Data exported successfully!', 'success');
            
        } catch (error) {
            console.error("Export error:", error);
            showMessage('Error exporting data: ' + error.message, 'error');
        }
    }

    function toggleNotification() {
        emailNotifications = !emailNotifications;
        const toggle = document.getElementById('notificationToggle');
        if (toggle) {
            if (emailNotifications) {
                toggle.classList.add('active');
            } else {
                toggle.classList.remove('active');
            }
        }
        localStorage.setItem('emailNotifications', emailNotifications);
        showMessage(`Email notifications ${emailNotifications ? 'enabled' : 'disabled'}`, 'success');
    }

    function toggleTheme() {
        darkMode = !darkMode;
        const toggle = document.getElementById('themeToggle');
        if (toggle) {
            if (darkMode) {
                toggle.classList.add('active');
                document.body.style.background = '#1a1a2e';
                document.body.style.color = '#e2e8f0';
            } else {
                toggle.classList.remove('active');
                document.body.style.background = '#f4f7fb';
                document.body.style.color = '#1e2a3e';
            }
        }
        localStorage.setItem('darkMode', darkMode);
    }

    function renderSettings() {
        const container = document.getElementById('app-root');
        
        const html = `
            <div id="messageArea"></div>
            
            <!-- Profile Settings -->
            <div class="card">
                <h3>👤 Profile Settings</h3>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" value="${currentUser?.email || ''}" disabled style="background:#f8fafc;">
                    <small style="color:#6c757d;">Email cannot be changed</small>
                </div>
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="fullName" placeholder="Enter your full name" value="${currentUser?.user_metadata?.full_name || ''}">
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="phone" placeholder="Enter phone number" value="${currentUser?.user_metadata?.phone || ''}">
                </div>
                <button class="btn" onclick="updateProfile()">💾 Update Profile</button>
            </div>
            
            <!-- Security Settings -->
            <div class="card">
                <h3>🔒 Security & Password</h3>
                <div class="form-group">
                    <label>Current Password</label>
                    <input type="password" id="currentPassword" placeholder="Enter current password">
                </div>
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" id="newPassword" placeholder="Enter new password">
                </div>
                <div class="form-group">
                    <label>Confirm New Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm new password">
                </div>
                <button class="btn" onclick="updatePassword()">🔑 Change Password</button>
            </div>
            
            <!-- Preferences -->
            <div class="card">
                <h3>⚙️ Preferences</h3>
                <div class="setting-item">
                    <div class="setting-info">
                        <h4>Email Notifications</h4>
                        <p>Receive email alerts for new contributions and payment reminders</p>
                    </div>
                    <div class="toggle-switch ${emailNotifications ? 'active' : ''}" id="notificationToggle" onclick="toggleNotification()"></div>
                </div>
                <div class="setting-item">
                    <div class="setting-info">
                        <h4>Dark Mode</h4>
                        <p>Switch between light and dark theme</p>
                    </div>
                    <div class="toggle-switch ${darkMode ? 'active' : ''}" id="themeToggle" onclick="toggleTheme()"></div>
                </div>
            </div>
            
            <!-- Data Management -->
            <div class="card">
                <h3>💾 Data Management</h3>
                <div class="setting-item">
                    <div class="setting-info">
                        <h4>Export All Data</h4>
                        <p>Download a complete backup of all members and contributions in JSON format</p>
                    </div>
                    <button class="btn-outline btn-sm" onclick="exportAllData()">📎 Export</button>
                </div>
                <div class="setting-item">
                    <div class="setting-info">
                        <h4>System Information</h4>
                        <p>Version: 2.0.0 | Built with Supabase | Last updated: ${new Date().toLocaleDateString()}</p>
                    </div>
                </div>
            </div>
            
            <!-- Support -->
            <div class="card">
                <h3>🆘 Support & Help</h3>
                <div class="setting-item">
                    <div class="setting-info">
                        <h4>Need Help?</h4>
                        <p>Contact support: support@chamaease.com | +254 700 000 000</p>
                    </div>
                </div>
                <div class="setting-item">
                    <div class="setting-info">
                        <h4>Documentation</h4>
                        <p>View user guide and video tutorials</p>
                    </div>
                    <button class="btn-outline btn-sm" onclick="window.open('#', '_blank')">📖 View Docs</button>
                </div>
            </div>
        `;
        
        container.innerHTML = html;
        
        // Load saved preferences
        const savedNotifications = localStorage.getItem('emailNotifications');
        const savedTheme = localStorage.getItem('darkMode');
        if (savedNotifications !== null) emailNotifications = savedNotifications === 'true';
        if (savedTheme !== null) {
            darkMode = savedTheme === 'true';
            if (darkMode) {
                document.body.style.background = '#1a1a2e';
                document.body.style.color = '#e2e8f0';
            }
        }
    }
</script>
</body>
</html>
