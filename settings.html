<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>ChamaEase | Settings</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #1e2a3e;
        }

        :root {
            --primary: #2c7a4d;
            --primary-light: #eaf5ef;
            --primary-dark: #1f5a3a;
            --danger: #dc4c4c;
            --warning: #f59e0b;
            --gray-border: #e2e8f0;
            --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.04);
            --radius-card: 16px;
            --radius-btn: 32px;
            --sidebar-width: 280px;
        }

        .dark-theme {
            background: #1a1a2e;
            color: #e2e8f0;
        }

        .dark-theme .sidebar,
        .dark-theme .card,
        .dark-theme .top-bar,
        .dark-theme .stat-card {
            background: #16213e;
            border-color: #2d3748;
        }

        .dark-theme input,
        .dark-theme select {
            background: #0f3460;
            border-color: #2d3748;
            color: #e2e8f0;
        }

        .app-wrapper {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: white;
            border-right: 1px solid var(--gray-border);
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            overflow-y: auto;
            transition: transform 0.3s ease;
            z-index: 1000;
            box-shadow: var(--shadow-sm);
            transform: translateX(0);
        }

        .sidebar-header {
            padding: 1rem;
            border-bottom: 1px solid var(--gray-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-logo {
            font-weight: 800;
            font-size: 1.2rem;
            background: linear-gradient(135deg, var(--primary), #3b9b62);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .sidebar-close {
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            color: #94a3b8;
            transition: all 0.2s;
            display: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            align-items: center;
            justify-content: center;
        }

        .sidebar-close:hover {
            background: #fee2e2;
            color: var(--danger);
        }

        .sidebar-nav {
            padding: 0.8rem 0;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0.7rem 1rem;
            margin: 0.2rem 0.8rem;
            border-radius: 12px;
            text-decoration: none;
            color: #4a5568;
            transition: all 0.2s;
            cursor: pointer;
        }

        .nav-item:hover {
            background: var(--primary-light);
            color: var(--primary);
        }

        .nav-item.active {
            background: var(--primary);
            color: white;
        }

        .nav-item .icon {
            font-size: 1.1rem;
            width: 26px;
            text-align: center;
        }

        .nav-item .label {
            font-weight: 500;
            font-size: 0.85rem;
        }

        .main-content {
            flex: 1;
            margin-left: var(--sidebar-width);
            transition: margin-left 0.3s ease;
            width: calc(100% - var(--sidebar-width));
        }

        .top-bar {
            background: white;
            padding: 0.7rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--gray-border);
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 0;
            z-index: 99;
        }

        .menu-toggle {
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            color: var(--primary);
            padding: 6px;
            border-radius: 50%;
            transition: all 0.2s;
        }

        .page-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1e2a3e;
        }

        .dark-theme .page-title {
            color: #e2e8f0;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .user-email {
            font-size: 0.7rem;
            color: #5b6e8c;
            display: none;
        }

        @media (min-width: 480px) {
            .user-email {
                display: inline;
            }
        }

        .logout-btn {
            background: transparent;
            border: 1px solid #dc2626;
            color: #dc2626;
            padding: 0.35rem 0.7rem;
            border-radius: 2rem;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.7rem;
        }

        .logout-btn:hover {
            background: #dc2626;
            color: white;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 1rem;
            width: 100%;
            min-height: 70vh;
        }

        .card {
            background: white;
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-sm);
            padding: 1rem;
            margin-bottom: 1rem;
            border: 1px solid var(--gray-border);
        }

        .btn {
            border: none;
            background: var(--primary);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: var(--radius-btn);
            font-weight: 600;
            cursor: pointer;
            font-size: 0.75rem;
            transition: 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
        }

        .btn-outline:hover {
            background: var(--primary-light);
        }

        .btn-sm {
            padding: 0.25rem 0.6rem;
            font-size: 0.65rem;
        }

        .btn-danger {
            background: var(--danger);
        }

        .btn-danger:hover {
            background: #b91c1c;
        }

        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin-bottom: 1rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.3rem;
            font-weight: 600;
            font-size: 0.75rem;
            color: #1e2a3e;
        }

        .dark-theme .form-group label {
            color: #e2e8f0;
        }

        input, select {
            width: 100%;
            padding: 0.5rem 0.8rem;
            border-radius: 1rem;
            border: 1px solid var(--gray-border);
            font-size: 0.75rem;
            transition: all 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(44, 122, 77, 0.1);
        }

        input:disabled {
            background: #f8fafc;
            cursor: not-allowed;
        }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 0;
            border-bottom: 1px solid var(--gray-border);
        }

        .setting-item:last-child {
            border-bottom: none;
        }

        .setting-info h4 {
            font-size: 0.85rem;
            margin-bottom: 0.2rem;
        }

        .setting-info p {
            font-size: 0.7rem;
            color: #6c757d;
        }

        .toggle-switch {
            width: 45px;
            height: 24px;
            background: #cbd5e1;
            border-radius: 30px;
            position: relative;
            cursor: pointer;
            transition: all 0.3s;
        }

        .toggle-switch.active {
            background: var(--primary);
        }

        .toggle-switch::after {
            content: '';
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 3px;
            transition: all 0.3s;
        }

        .toggle-switch.active::after {
            left: 22px;
        }

        .success-message {
            background: #dff0e4;
            color: #2c7a4d;
            padding: 0.6rem;
            border-radius: 1rem;
            margin-bottom: 0.8rem;
            font-size: 0.7rem;
        }

        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 0.6rem;
            border-radius: 1rem;
            margin-bottom: 0.8rem;
            font-size: 0.7rem;
        }

        footer {
            text-align: center;
            padding: 0.8rem;
            font-size: 0.65rem;
            color: #6c757d;
            border-top: 1px solid var(--gray-border);
            margin-top: 1rem;
        }

        .loading-spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid #e2e8f0;
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
        }

        .sidebar-overlay.active {
            display: block;
        }

        .stat-badge {
            display: inline-block;
            background: var(--primary-light);
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .main-content {
                margin-left: 0;
                width: 100%;
            }
            .sidebar-close {
                display: flex;
            }
            .container {
                padding: 0.8rem;
            }
            .setting-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.5rem;
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
</head>
<body>
<div class="app-wrapper">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">ChamaEase</div>
            <button class="sidebar-close" id="sidebarClose">✕</button>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item">
                <span class="icon">📊</span>
                <span class="label">DASHBOARD</span>
            </a>
            <a href="members.html" class="nav-item">
                <span class="icon">👥</span>
                <span class="label">MEMBERS</span>
            </a>
            <a href="monthly-records.html" class="nav-item">
                <span class="icon">📅</span>
                <span class="label">MONTHLY RECORDS</span>
            </a>
            <a href="reports.html" class="nav-item">
                <span class="icon">📈</span>
                <span class="label">REPORTS</span>
            </a>
            <a href="settings.html" class="nav-item active">
                <span class="icon">⚙️</span>
                <span class="label">SETTINGS</span>
            </a>
        </nav>
    </aside>

    <main class="main-content">
        <div class="top-bar">
            <button class="menu-toggle" id="menuToggle">☰</button>
            <div class="page-title">⚙️ SETTINGS</div>
            <div class="user-info">
                <span class="user-email" id="userEmail"></span>
                <button id="logoutBtn" class="logout-btn">LOGOUT</button>
            </div>
        </div>
        <div id="app-root" class="container">
            <div style="text-align: center; padding: 1.5rem;">
                <div class="loading-spinner"></div>
                <p style="margin-top: 0.5rem; font-size: 0.8rem;">Loading settings...</p>
            </div>
        </div>
        <footer>Smart Chama Management · System settings and preferences</footer>
    </main>
</div>

<script>
// Using supabaseClient from supabase-config.js
let currentUser = null;
let emailNotifications = true;
let darkMode = false;
let systemStats = {};

// Sidebar functionality
const menuToggle = document.getElementById('menuToggle');
const sidebar = document.getElementById('sidebar');
const sidebarClose = document.getElementById('sidebarClose');
const sidebarOverlay = document.getElementById('sidebarOverlay');

function openSidebar() {
    sidebar.classList.add('open');
    sidebarOverlay.classList.add('active');
}

function closeSidebar() {
    sidebar.classList.remove('open');
    sidebarOverlay.classList.remove('active');
}

if (menuToggle) menuToggle.addEventListener('click', openSidebar);
if (sidebarClose) sidebarClose.addEventListener('click', closeSidebar);
if (sidebarOverlay) sidebarOverlay.addEventListener('click', closeSidebar);

window.addEventListener('resize', function() {
    if (window.innerWidth > 768) closeSidebar();
});

function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/[&<>]/g, function(m) {
        if (m === "&") return "&amp;";
        if (m === "<") return "&lt;";
        if (m === ">") return "&gt;";
        return m;
    });
}

function showMessage(message, type) {
    const msgDiv = document.getElementById('messageArea');
    if (msgDiv) {
        msgDiv.innerHTML = `<div class="${type === 'error' ? 'error-message' : 'success-message'}">${message}</div>`;
        setTimeout(function() {
            if (msgDiv.innerHTML) msgDiv.innerHTML = '';
        }, 4000);
    }
}

async function loadSystemStats() {
    try {
        const membersRes = await supabaseClient.from('members').select('*', { count: 'exact' });
        const recordsRes = await supabaseClient.from('monthly_records').select('*', { count: 'exact' });
        
        systemStats = {
            totalMembers: membersRes.data ? membersRes.data.length : 0,
            totalRecords: recordsRes.data ? recordsRes.data.length : 0,
            lastUpdated: new Date().toLocaleString()
        };
        
        // Update stats display
        const statsSpan = document.getElementById('systemStats');
        if (statsSpan) {
            statsSpan.innerHTML = `${systemStats.totalMembers} Members | ${systemStats.totalRecords} Records | Updated: ${systemStats.lastUpdated}`;
        }
    } catch (error) {
        console.error("Error loading stats:", error);
    }
}

async function updatePassword() {
    const currentPassword = document.getElementById('currentPassword')?.value;
    const newPassword = document.getElementById('newPassword')?.value;
    const confirmPassword = document.getElementById('confirmPassword')?.value;
    
    if (!currentPassword || !newPassword || !confirmPassword) {
        showMessage('Please fill in all password fields', 'error');
        return;
    }
    
    if (newPassword !== confirmPassword) {
        showMessage('New passwords do not match', 'error');
        return;
    }
    
    if (newPassword.length < 6) {
        showMessage('Password must be at least 6 characters', 'error');
        return;
    }
    
    try {
        const { error } = await supabaseClient.auth.updateUser({ password: newPassword });
        if (error) throw error;
        
        showMessage('✅ Password updated successfully!', 'success');
        document.getElementById('currentPassword').value = '';
        document.getElementById('newPassword').value = '';
        document.getElementById('confirmPassword').value = '';
        
    } catch (error) {
        console.error("Password update error:", error);
        showMessage(error.message || 'Error updating password', 'error');
    }
}

async function updateProfile() {
    const fullName = document.getElementById('fullName')?.value;
    const phone = document.getElementById('phone')?.value;
    
    try {
        const { error } = await supabaseClient.auth.updateUser({
            data: { full_name: fullName, phone: phone }
        });
        if (error) throw error;
        showMessage('✅ Profile updated successfully!', 'success');
    } catch (error) {
        console.error("Profile update error:", error);
        showMessage(error.message || 'Error updating profile', 'error');
    }
}

async function exportAllData() {
    try {
        const membersRes = await supabaseClient.from('members').select('*');
        const recordsRes = await supabaseClient.from('monthly_records').select('*');
        
        if (membersRes.error) throw membersRes.error;
        if (recordsRes.error) throw recordsRes.error;
        
        const exportData = {
            exported_at: new Date().toISOString(),
            app_version: "2.0.0",
            members: membersRes.data || [],
            monthly_records: recordsRes.data || []
        };
        
        const dataStr = JSON.stringify(exportData, null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `chamaease_backup_${new Date().toISOString().slice(0,10)}.json`;
        link.click();
        URL.revokeObjectURL(link.href);
        showMessage('✅ Data exported successfully!', 'success');
    } catch (error) {
        console.error("Export error:", error);
        showMessage('Error exporting data: ' + error.message, 'error');
    }
}

async function clearAllData() {
    if (!confirm('⚠️ WARNING: This will delete ALL members and records. This action cannot be undone!\n\nAre you absolutely sure?')) {
        return;
    }
    
    if (!confirm('Type "DELETE" to confirm:')) {
        return;
    }
    
    try {
        // Delete all records first (due to foreign key constraints)
        const { error: recordsError } = await supabaseClient
            .from('monthly_records')
            .delete()
            .neq('id', '00000000-0000-0000-0000-000000000000');
        
        if (recordsError) throw recordsError;
        
        // Delete all members
        const { error: membersError } = await supabaseClient
            .from('members')
            .delete()
            .neq('id', '00000000-0000-0000-0000-000000000000');
        
        if (membersError) throw membersError;
        
        showMessage('✅ All data cleared successfully!', 'success');
        loadSystemStats();
    } catch (error) {
        console.error("Clear data error:", error);
        showMessage('Error clearing data: ' + error.message, 'error');
    }
}

function toggleNotification() {
    emailNotifications = !emailNotifications;
    const toggle = document.getElementById('notificationToggle');
    if (toggle) {
        if (emailNotifications) toggle.classList.add('active');
        else toggle.classList.remove('active');
    }
    localStorage.setItem('emailNotifications', emailNotifications);
    showMessage(`Email notifications ${emailNotifications ? 'enabled' : 'disabled'}`, 'success');
}

function toggleTheme() {
    darkMode = !darkMode;
    const toggle = document.getElementById('themeToggle');
    if (toggle) {
        if (darkMode) toggle.classList.add('active');
        else toggle.classList.remove('active');
    }
    localStorage.setItem('darkMode', darkMode);
    
    if (darkMode) {
        document.body.classList.add('dark-theme');
    } else {
        document.body.classList.remove('dark-theme');
    }
}

async function renderSettings() {
    const container = document.getElementById('app-root');
    
    await loadSystemStats();
    
    const html = `
        <div id="messageArea"></div>
        
        <div class="card">
            <h3 style="font-size:1rem;">📊 System Overview</h3>
            <div class="setting-item">
                <div class="setting-info">
                    <h4>Database Statistics</h4>
                    <p id="systemStats">${systemStats.totalMembers} Members | ${systemStats.totalRecords} Records | Updated: ${systemStats.lastUpdated}</p>
                </div>
                <button class="btn-outline btn-sm" onclick="loadSystemStats()">🔄 Refresh</button>
            </div>
        </div>
        
        <div class="card">
            <h3 style="font-size:1rem;">👤 Profile Settings</h3>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" value="${escapeHtml(currentUser?.email || '')}" disabled style="background:#f8fafc;">
                <small style="color:#6c757d; font-size:0.65rem;">Email cannot be changed</small>
            </div>
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="fullName" placeholder="Enter your full name" value="${escapeHtml(currentUser?.user_metadata?.full_name || '')}">
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="phone" placeholder="Enter phone number" value="${escapeHtml(currentUser?.user_metadata?.phone || '')}">
            </div>
            <button class="btn" onclick="updateProfile()">💾 Update Profile</button>
        </div>
        
        <div class="card">
            <h3 style="font-size:1rem;">🔒 Security & Password</h3>
            <div class="form-group">
                <label>Current Password</label>
                <input type="password" id="currentPassword" placeholder="Enter current password">
            </div>
            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="newPassword" placeholder="Enter new password (min 6 characters)">
            </div>
            <div class="form-group">
                <label>Confirm New Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm new password">
            </div>
            <button class="btn" onclick="updatePassword()">🔑 Change Password</button>
        </div>
        
        <div class="card">
            <h3 style="font-size:1rem;">⚙️ Preferences</h3>
            <div class="setting-item">
                <div class="setting-info">
                    <h4>Email Notifications</h4>
                    <p>Receive email alerts for contributions and updates</p>
                </div>
                <div class="toggle-switch ${emailNotifications ? 'active' : ''}" id="notificationToggle" onclick="toggleNotification()"></div>
            </div>
            <div class="setting-item">
                <div class="setting-info">
                    <h4>Dark Mode</h4>
                    <p>Switch between light and dark theme</p>
                </div>
                <div class="toggle-switch ${darkMode ? 'active' : ''}" id="themeToggle" onclick="toggleTheme()"></div>
            </div>
        </div>
        
        <div class="card">
            <h3 style="font-size:1rem;">💾 Data Management</h3>
            <div class="setting-item">
                <div class="setting-info">
                    <h4>Export All Data</h4>
                    <p>Download backup of members and monthly records in JSON format</p>
                </div>
                <button class="btn-outline btn-sm" onclick="exportAllData()">📎 Export</button>
            </div>
            <div class="setting-item">
                <div class="setting-info">
                    <h4>Clear All Data</h4>
                    <p>⚠️ Delete ALL members and records (irreversible)</p>
                </div>
                <button class="btn-danger btn-sm" onclick="clearAllData()">🗑️ Clear All</button>
            </div>
        </div>
        
        <div class="card">
            <h3 style="font-size:1rem;">ℹ️ About & Support</h3>
            <div class="setting-item">
                <div class="setting-info">
                    <h4>System Information</h4>
                    <p>Version: 2.0.0 | Built with Supabase | © 2024 ChamaEase</p>
                </div>
            </div>
            <div class="setting-item">
                <div class="setting-info">
                    <h4>Need Help?</h4>
                    <p>Email: support@chamaease.com | Documentation available online</p>
                </div>
                <button class="btn-outline btn-sm" onclick="window.open('https://github.com', '_blank')">📖 Documentation</button>
            </div>
        </div>
    `;
    
    container.innerHTML = html;
}

// Initialize page
(async function() {
    const isAuth = await protectPage();
    if (!isAuth) return;
    
    currentUser = await getCurrentUser();
    if (currentUser && document.getElementById('userEmail')) {
        document.getElementById('userEmail').textContent = currentUser.email || 'Admin';
    }
    
    // Load saved preferences
    const savedNotifications = localStorage.getItem('emailNotifications');
    const savedTheme = localStorage.getItem('darkMode');
    
    if (savedNotifications !== null) emailNotifications = savedNotifications === 'true';
    if (savedTheme !== null) {
        darkMode = savedTheme === 'true';
        if (darkMode) {
            document.body.classList.add('dark-theme');
        }
    }
    
    await renderSettings();
})();

document.getElementById('logoutBtn').addEventListener('click', async function() {
    await logoutUser();
    window.location.href = 'index.html';
});
</script>
</body>
</html>
