<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>ChamaEase | Settings</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
</head>
<body>
<div class="app-wrapper">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">ChamaEase</div>
            <button class="sidebar-close" id="sidebarClose">✕</button>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item">
                <span class="icon">📊</span>
                <span class="label">DASHBOARD</span>
            </a>
            <a href="members.html" class="nav-item">
                <span class="icon">👥</span>
                <span class="label">MEMBERS</span>
            </a>
            <a href="member-history.html" class="nav-item">
                <span class="icon">📜</span>
                <span class="label">MEMBER HISTORY</span>
            </a>
            <a href="monthly-records.html" class="nav-item">
                <span class="icon">📅</span>
                <span class="label">MONTHLY RECORDS</span>
            </a>
            <a href="reports.html" class="nav-item">
                <span class="icon">📈</span>
                <span class="label">REPORTS</span>
            </a>
            <a href="settings.html" class="nav-item active">
                <span class="icon">⚙️</span>
                <span class="label">SETTINGS</span>
            </a>
        </nav>
    </aside>

    <main class="main-content">
        <div class="top-bar">
            <button class="menu-toggle" id="menuToggle">☰</button>
            <div class="page-title">⚙️ SETTINGS</div>
            <div class="header-right">
                <div class="header-quicklinks">
                    <a href="members.html" class="quicklink-btn" title="Members">👥</a>
                    <a href="monthly-records.html" class="quicklink-btn" title="Monthly Records">📅</a>
                    <a href="reports.html" class="quicklink-btn" title="Reports">📈</a>
                </div>
                <div class="user-info">
                    <span class="user-email" id="userEmail"></span>
                    <button id="logoutBtn" class="logout-btn">LOGOUT</button>
                </div>
            </div>
        </div>
        <div id="app-root" class="container">
            <div style="text-align: center; padding: 1.5rem;">
                <div class="loading-spinner"></div>
                <p style="margin-top: 0.5rem; font-size: 0.8rem;">Loading settings...</p>
            </div>
        </div>
        <footer>Smart Chama Management · System settings and preferences</footer>
    </main>
</div>

<script>
// Using supabaseClient from supabase-config.js
let currentUser = null;
let emailNotifications = true;
let darkMode = false;
let systemStats = {};

// Sidebar functionality
const menuToggle = document.getElementById('menuToggle');
const sidebar = document.getElementById('sidebar');
const sidebarClose = document.getElementById('sidebarClose');
const sidebarOverlay = document.getElementById('sidebarOverlay');

function openSidebar() {
    sidebar.classList.add('open');
    sidebarOverlay.classList.add('active');
}

function closeSidebar() {
    sidebar.classList.remove('open');
    sidebarOverlay.classList.remove('active');
}

if (menuToggle) menuToggle.addEventListener('click', openSidebar);
if (sidebarClose) sidebarClose.addEventListener('click', closeSidebar);
if (sidebarOverlay) sidebarOverlay.addEventListener('click', closeSidebar);

window.addEventListener('resize', function() {
    if (window.innerWidth > 768) closeSidebar();
});

function escapeHtml(str) {
    if (!str) return "";
    return String(str).replace(/[&<>"']/g, function(m) {
        if (m === "&") return "&amp;";
        if (m === "<") return "&lt;";
        if (m === ">") return "&gt;";
        if (m === '"') return "&quot;";
        if (m === "'") return "&#39;";
        return m;
    });
}

function showMessage(message, type) {
    const msgDiv = document.getElementById('messageArea');
    if (msgDiv) {
        msgDiv.innerHTML = `<div class="${type === 'error' ? 'error-message' : 'success-message'}">${message}</div>`;
        setTimeout(function() {
            if (msgDiv.innerHTML) msgDiv.innerHTML = '';
        }, 4000);
    }
}

async function loadSystemStats() {
    try {
        const membersRes = await supabaseClient.from('members').select('*', { count: 'exact', head: true });
        const recordsRes = await supabaseClient.from('monthly_records').select('*', { count: 'exact', head: true });

        systemStats = {
            totalMembers: membersRes.count || 0,
            totalRecords: recordsRes.count || 0,
            lastUpdated: new Date().toLocaleString()
        };
        
        // Update stats display
        const statsSpan = document.getElementById('systemStats');
        if (statsSpan) {
            statsSpan.innerHTML = `${systemStats.totalMembers} Members | ${systemStats.totalRecords} Records | Updated: ${systemStats.lastUpdated}`;
        }
    } catch (error) {
        console.error("Error loading stats:", error);
    }
}

async function updatePassword() {
    const currentPassword = document.getElementById('currentPassword')?.value;
    const newPassword = document.getElementById('newPassword')?.value;
    const confirmPassword = document.getElementById('confirmPassword')?.value;
    
    if (!currentPassword || !newPassword || !confirmPassword) {
        showMessage('Please fill in all password fields', 'error');
        return;
    }
    
    if (newPassword !== confirmPassword) {
        showMessage('New passwords do not match', 'error');
        return;
    }
    
    if (newPassword.length < 6) {
        showMessage('Password must be at least 6 characters', 'error');
        return;
    }
    
    try {
        const { error } = await supabaseClient.auth.updateUser({ password: newPassword });
        if (error) throw error;
        
        showMessage('✅ Password updated successfully!', 'success');
        document.getElementById('currentPassword').value = '';
        document.getElementById('newPassword').value = '';
        document.getElementById('confirmPassword').value = '';
        
    } catch (error) {
        console.error("Password update error:", error);
        showMessage(error.message || 'Error updating password', 'error');
    }
}

async function updateProfile() {
    const fullName = document.getElementById('fullName')?.value;
    const phone = document.getElementById('phone')?.value;
    
    try {
        const { error } = await supabaseClient.auth.updateUser({
            data: { full_name: fullName, phone: phone }
        });
        if (error) throw error;
        showMessage('✅ Profile updated successfully!', 'success');
    } catch (error) {
        console.error("Profile update error:", error);
        showMessage(error.message || 'Error updating profile', 'error');
    }
}

async function exportAllData() {
    try {
        const membersRes = await supabaseClient.from('members').select('*');
        const recordsRes = await supabaseClient.from('monthly_records').select('*');
        
        if (membersRes.error) throw membersRes.error;
        if (recordsRes.error) throw recordsRes.error;
        
        const exportData = {
            exported_at: new Date().toISOString(),
            app_version: "2.0.0",
            members: membersRes.data || [],
            monthly_records: recordsRes.data || []
        };
        
        const dataStr = JSON.stringify(exportData, null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `chamaease_backup_${new Date().toISOString().slice(0,10)}.json`;
        link.click();
        URL.revokeObjectURL(link.href);
        showMessage('✅ Data exported successfully!', 'success');
    } catch (error) {
        console.error("Export error:", error);
        showMessage('Error exporting data: ' + error.message, 'error');
    }
}

function showClearDataModal() {
    const modalHtml = `
        <div class="modal-overlay" id="clearDataModal">
            <div class="modal-box">
                <div class="modal-box-icon">⚠️</div>
                <h3>Delete All Data?</h3>
                <p>This permanently deletes <strong>every member</strong> and <strong>every monthly record</strong> for this chama. This cannot be undone.</p>
                <p class="modal-box-instruction">Type DELETE below to confirm:</p>
                <input type="text" id="clearDataConfirmInput" class="modal-box-input" placeholder="DELETE" autocomplete="off" autocapitalize="off" spellcheck="false">
                <div class="modal-box-actions">
                    <button class="btn-outline btn" id="clearDataCancelBtn" type="button">Cancel</button>
                    <button class="btn-danger btn" id="clearDataConfirmBtn" type="button" disabled>🗑️ Delete Everything</button>
                </div>
            </div>
        </div>
    `;

    document.body.insertAdjacentHTML('beforeend', modalHtml);

    const overlay = document.getElementById('clearDataModal');
    const input = document.getElementById('clearDataConfirmInput');
    const confirmBtn = document.getElementById('clearDataConfirmBtn');
    const cancelBtn = document.getElementById('clearDataCancelBtn');

    function closeClearDataModal() {
        overlay.remove();
    }

    input.addEventListener('input', function() {
        confirmBtn.disabled = input.value.trim() !== 'DELETE';
    });

    cancelBtn.addEventListener('click', closeClearDataModal);
    overlay.addEventListener('click', function(e) {
        if (e.target === overlay) closeClearDataModal();
    });

    confirmBtn.addEventListener('click', async function() {
        if (input.value.trim() !== 'DELETE') return;
        confirmBtn.disabled = true;
        cancelBtn.disabled = true;
        confirmBtn.innerHTML = '<span style="display:inline-block;width:12px;height:12px;border:2px solid white;border-radius:50%;border-top-color:transparent;animation:spin 0.6s linear infinite;margin-right:6px;"></span>Deleting...';
        await clearAllData();
        closeClearDataModal();
    });

    input.focus();
}

async function clearAllData() {
    try {
        // Delete all records first (due to foreign key constraints)
        const { error: recordsError } = await supabaseClient
            .from('monthly_records')
            .delete()
            .neq('id', '00000000-0000-0000-0000-000000000000');

        if (recordsError) throw recordsError;

        // Delete all members
        const { error: membersError } = await supabaseClient
            .from('members')
            .delete()
            .neq('id', '00000000-0000-0000-0000-000000000000');

        if (membersError) throw membersError;

        showMessage('✅ All data cleared successfully!', 'success');
        loadSystemStats();
    } catch (error) {
        console.error("Clear data error:", error);
        showMessage('Error clearing data: ' + error.message, 'error');
    }
}

function toggleNotification() {
    emailNotifications = !emailNotifications;
    const toggle = document.getElementById('notificationToggle');
    if (toggle) {
        if (emailNotifications) toggle.classList.add('active');
        else toggle.classList.remove('active');
    }
    localStorage.setItem('emailNotifications', emailNotifications);
    showMessage(`Email notifications ${emailNotifications ? 'enabled' : 'disabled'}`, 'success');
}

function toggleTheme() {
    darkMode = !darkMode;
    const toggle = document.getElementById('themeToggle');
    if (toggle) {
        if (darkMode) toggle.classList.add('active');
        else toggle.classList.remove('active');
    }
    localStorage.setItem('darkMode', darkMode);
    
    if (darkMode) {
        document.body.classList.add('dark-theme');
    } else {
        document.body.classList.remove('dark-theme');
    }
}

async function renderSettings() {
    const container = document.getElementById('app-root');
    
    await loadSystemStats();
    
    const html = `
        <div id="messageArea"></div>
        
        <div class="card">
            <h3 style="font-size:1rem;">📊 System Overview</h3>
            <div class="setting-item">
                <div class="setting-info">
                    <h4>Database Statistics</h4>
                    <p id="systemStats">${systemStats.totalMembers} Members | ${systemStats.totalRecords} Records | Updated: ${systemStats.lastUpdated}</p>
                </div>
                <button class="btn-outline btn-sm" onclick="loadSystemStats()">🔄 Refresh</button>
            </div>
        </div>
        
        <div class="card">
            <h3 style="font-size:1rem;">👤 Profile Settings</h3>
            <div class="form-group-modern">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-input" value="${escapeHtml(currentUser?.email || '')}" disabled>
                <small style="color:#6c757d; font-size:0.65rem;">Email cannot be changed</small>
            </div>
            <div class="form-group-modern">
                <label class="form-label">Full Name</label>
                <input type="text" id="fullName" class="form-input" placeholder="Enter your full name" value="${escapeHtml(currentUser?.user_metadata?.full_name || '')}">
            </div>
            <div class="form-group-modern">
                <label class="form-label">Phone Number</label>
                <input type="tel" id="phone" class="form-input" placeholder="Enter phone number" value="${escapeHtml(currentUser?.user_metadata?.phone || '')}">
            </div>
            <button class="btn" onclick="updateProfile()">💾 Update Profile</button>
        </div>

        <div class="card">
            <h3 style="font-size:1rem;">🔒 Security & Password</h3>
            <div class="form-group-modern">
                <label class="form-label">Current Password</label>
                <input type="password" id="currentPassword" class="form-input" placeholder="Enter current password">
            </div>
            <div class="form-group-modern">
                <label class="form-label">New Password</label>
                <input type="password" id="newPassword" class="form-input" placeholder="Enter new password (min 6 characters)">
            </div>
            <div class="form-group-modern">
                <label class="form-label">Confirm New Password</label>
                <input type="password" id="confirmPassword" class="form-input" placeholder="Confirm new password">
            </div>
            <button class="btn" onclick="updatePassword()">🔑 Change Password</button>
        </div>
        
        <div class="card">
            <h3 style="font-size:1rem;">⚙️ Preferences</h3>
            <div class="setting-item">
                <div class="setting-info">
                    <h4>Email Notifications</h4>
                    <p>Receive email alerts for contributions and updates</p>
                </div>
                <div class="toggle-switch ${emailNotifications ? 'active' : ''}" id="notificationToggle" onclick="toggleNotification()"></div>
            </div>
            <div class="setting-item">
                <div class="setting-info">
                    <h4>Dark Mode</h4>
                    <p>Switch between light and dark theme</p>
                </div>
                <div class="toggle-switch ${darkMode ? 'active' : ''}" id="themeToggle" onclick="toggleTheme()"></div>
            </div>
        </div>
        
        <div class="card">
            <h3 style="font-size:1rem;">💾 Data Management</h3>
            <div class="setting-item">
                <div class="setting-info">
                    <h4>Export All Data</h4>
                    <p>Download backup of members and monthly records in JSON format</p>
                </div>
                <button class="btn-outline btn-sm" onclick="exportAllData()">📎 Export</button>
            </div>
            <div class="setting-item">
                <div class="setting-info">
                    <h4>Clear All Data</h4>
                    <p>⚠️ Delete ALL members and records (irreversible)</p>
                </div>
                <button class="btn-danger btn-sm" onclick="showClearDataModal()">🗑️ Clear All</button>
            </div>
        </div>
        
        <div class="card">
            <h3 style="font-size:1rem;">ℹ️ About & Support</h3>
            <div class="setting-item">
                <div class="setting-info">
                    <h4>System Information</h4>
                    <p>Version: 2.0.0 | Built with Supabase | © 2024 ChamaEase</p>
                </div>
            </div>
            <div class="setting-item">
                <div class="setting-info">
                    <h4>Need Help?</h4>
                    <p>Email: support@chamaease.com | Documentation available online</p>
                </div>
                <button class="btn-outline btn-sm" onclick="window.open('https://github.com', '_blank')">📖 Documentation</button>
            </div>
        </div>
    `;
    
    container.innerHTML = html;
}

// Initialize page
(async function() {
    const isAuth = await protectPage();
    if (!isAuth) return;
    
    currentUser = await getCurrentUser();
    if (currentUser && document.getElementById('userEmail')) {
        document.getElementById('userEmail').textContent = currentUser.email || 'Admin';
    }
    
    // Load saved preferences
    const savedNotifications = localStorage.getItem('emailNotifications');
    const savedTheme = localStorage.getItem('darkMode');
    
    if (savedNotifications !== null) emailNotifications = savedNotifications === 'true';
    if (savedTheme !== null) {
        darkMode = savedTheme === 'true';
        if (darkMode) {
            document.body.classList.add('dark-theme');
        }
    }
    
    await renderSettings();
})();

document.getElementById('logoutBtn').addEventListener('click', async function() {
    await logoutUser();
    window.location.href = 'index.html';
});
</script>
</body>
</html>
