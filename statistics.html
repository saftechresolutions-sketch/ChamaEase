<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>ChamaEase | Statistics & Analytics</title>
    <!-- Chart.js for beautiful charts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #1e2a3e;
        }

        :root {
            --primary: #2c7a4d;
            --primary-light: #eaf5ef;
            --primary-dark: #1f5a3a;
            --danger: #dc4c4c;
            --warning: #e6a017;
            --gray-border: #e2e8f0;
            --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.04);
            --radius-card: 16px;
            --radius-btn: 32px;
            --sidebar-width: 280px;
        }

        .app-wrapper {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: white;
            border-right: 1px solid var(--gray-border);
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            overflow-y: auto;
            transition: transform 0.3s ease;
            z-index: 1000;
            box-shadow: var(--shadow-sm);
            transform: translateX(0);
        }

        .sidebar-header {
            padding: 1rem;
            border-bottom: 1px solid var(--gray-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-logo {
            font-weight: 800;
            font-size: 1.2rem;
            background: linear-gradient(135deg, var(--primary), #3b9b62);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .sidebar-close {
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            color: #94a3b8;
            transition: all 0.2s;
            display: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            align-items: center;
            justify-content: center;
        }

        .sidebar-close:hover {
            background: #fee2e2;
            color: var(--danger);
        }

        .sidebar-nav {
            padding: 0.8rem 0;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0.7rem 1rem;
            margin: 0.2rem 0.8rem;
            border-radius: 12px;
            text-decoration: none;
            color: #4a5568;
            transition: all 0.2s;
            cursor: pointer;
        }

        .nav-item:hover {
            background: var(--primary-light);
            color: var(--primary);
        }

        .nav-item.active {
            background: var(--primary);
            color: white;
        }

        .nav-item .icon {
            font-size: 1.1rem;
            width: 26px;
            text-align: center;
        }

        .nav-item .label {
            font-weight: 500;
            font-size: 0.85rem;
        }

        .nav-submenu {
            padding-left: 2.8rem;
        }

        .nav-submenu .nav-item {
            padding: 0.5rem 1rem;
            font-size: 0.8rem;
        }

        .nav-divider {
            height: 1px;
            background: var(--gray-border);
            margin: 0.6rem 1rem;
        }

        .main-content {
            flex: 1;
            margin-left: var(--sidebar-width);
            transition: margin-left 0.3s ease;
            width: calc(100% - var(--sidebar-width));
        }

        .top-bar {
            background: white;
            padding: 0.7rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--gray-border);
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 0;
            z-index: 99;
        }

        .menu-toggle {
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            color: var(--primary);
            padding: 6px;
            border-radius: 50%;
            transition: all 0.2s;
        }

        .page-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1e2a3e;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .user-email {
            font-size: 0.7rem;
            color: #5b6e8c;
            display: none;
        }

        @media (min-width: 480px) {
            .user-email {
                display: inline;
            }
        }

        .logout-btn {
            background: transparent;
            border: 1px solid #dc2626;
            color: #dc2626;
            padding: 0.35rem 0.7rem;
            border-radius: 2rem;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.7rem;
        }

        .logout-btn:hover {
            background: #dc2626;
            color: white;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1rem;
            width: 100%;
            min-height: 70vh;
        }

        .card {
            background: white;
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-sm);
            padding: 1rem;
            margin-bottom: 1rem;
            border: 1px solid var(--gray-border);
        }

        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin-bottom: 1rem;
        }

        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
        }

        .filter-select {
            padding: 0.4rem 0.8rem;
            border-radius: 40px;
            border: 1px solid var(--gray-border);
            background: white;
            font-size: 0.75rem;
            min-width: 120px;
        }

        .stats-summary {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.8rem;
            margin-bottom: 1rem;
        }

        @media (min-width: 640px) {
            .stats-summary {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (min-width: 1024px) {
            .stats-summary {
                grid-template-columns: repeat(6, 1fr);
            }
        }

        .stat-box {
            background: #f8fafc;
            border-radius: 12px;
            padding: 0.7rem;
            text-align: center;
        }

        .stat-box h4 {
            font-size: 0.65rem;
            color: #5b6e8c;
            margin-bottom: 0.2rem;
        }

        .stat-box .value {
            font-size: 1rem;
            font-weight: 800;
            color: var(--primary);
        }

        .stat-box small {
            font-size: 0.55rem;
            color: #6c757d;
        }

        .chart-row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        @media (min-width: 768px) {
            .chart-row {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .chart-container {
            background: white;
            border-radius: 1rem;
            padding: 0.8rem;
            border: 1px solid var(--gray-border);
        }

        .chart-container h3 {
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .chart-container canvas {
            max-height: 250px;
            width: 100%;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.7rem;
        }
        
        th, td {
            text-align: left;
            padding: 0.5rem 0.3rem;
            border-bottom: 1px solid var(--gray-border);
        }

        th {
            background: #f8fafc;
            font-weight: 600;
        }

        footer {
            text-align: center;
            padding: 0.8rem;
            font-size: 0.65rem;
            color: #6c757d;
            border-top: 1px solid var(--gray-border);
            margin-top: 1rem;
        }

        .loading-spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid #e2e8f0;
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
        }

        .sidebar-overlay.active {
            display: block;
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .main-content {
                margin-left: 0;
                width: 100%;
            }
            .sidebar-close {
                display: flex;
            }
            .container {
                padding: 0.8rem;
            }
            .flex-between {
                flex-direction: column;
                align-items: stretch;
            }
            .filter-bar {
                justify-content: center;
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="app-wrapper">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">🌿 ChamaEase</div>
            <button class="sidebar-close" id="sidebarClose">✕</button>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item"><span class="icon">📊</span><span class="label">DASHBOARD</span></a>
            <a href="members.html" class="nav-item"><span class="icon">👥</span><span class="label">MEMBERS</span></a>
            <a href="contributions.html" class="nav-item"><span class="icon">💰</span><span class="label">CONTRIBUTIONS</span></a>
            <div class="nav-divider"></div>
            <div class="nav-item" style="cursor: default; opacity: 0.7;"><span class="icon">📜</span><span class="label">HISTORY</span></div>
            <div class="nav-submenu">
                <a href="contribution-history.html" class="nav-item"><span class="icon">📋</span><span class="label">CONTRIBUTIONS HISTORY</span></a>
                <a href="member-history.html" class="nav-item"><span class="icon">👤</span><span class="label">MEMBERS HISTORY</span></a>
            </div>
            <div class="nav-divider"></div>
            <div class="nav-item" style="cursor: default; opacity: 0.7;"><span class="icon">📈</span><span class="label">ANALYTICS</span></div>
            <div class="nav-submenu">
                <a href="statistics.html" class="nav-item active"><span class="icon">📊</span><span class="label">MONTHLY STATISTICS</span></a>
                <a href="reports.html" class="nav-item"><span class="icon">📋</span><span class="label">REPORTS</span></a>
            </div>
            <div class="nav-divider"></div>
            <a href="settings.html" class="nav-item"><span class="icon">⚙️</span><span class="label">SETTINGS</span></a>
        </nav>
    </aside>

    <main class="main-content">
        <div class="top-bar">
            <button class="menu-toggle" id="menuToggle">☰</button>
            <div class="page-title">📊 STATISTICS</div>
            <div class="user-info">
                <span class="user-email" id="userEmail"></span>
                <button id="logoutBtn" class="logout-btn">LOGOUT</button>
            </div>
        </div>
        <div id="app-root" class="container">
            <div style="text-align: center; padding: 1.5rem;">
                <div class="loading-spinner"></div>
                <p style="margin-top: 0.5rem; font-size: 0.8rem;">Loading statistics...</p>
            </div>
        </div>
        <footer>✨ Smart Chama Management · Visual analytics and trends</footer>
    </main>
</div>

<script src="supabase-config.js"></script>
<script>
    let allMembers = [];
    let allContributions = [];
    let currentYear = 'all';
    let monthlyChart = null;
    let paymentMethodChart = null;
    let yearlyChart = null;

    const menuToggle = document.getElementById('menuToggle');
    const sidebar = document.getElementById('sidebar');
    const sidebarClose = document.getElementById('sidebarClose');
    const sidebarOverlay = document.getElementById('sidebarOverlay');
    
    function openSidebar() {
        sidebar.classList.add('open');
        sidebarOverlay.classList.add('active');
    }
    
    function closeSidebar() {
        sidebar.classList.remove('open');
        sidebarOverlay.classList.remove('active');
    }
    
    if (menuToggle) menuToggle.addEventListener('click', openSidebar);
    if (sidebarClose) sidebarClose.addEventListener('click', closeSidebar);
    if (sidebarOverlay) sidebarOverlay.addEventListener('click', closeSidebar);
    
    window.addEventListener('resize', () => {
        if (window.innerWidth > 768) closeSidebar();
    });

    (async function() {
        const isAuth = await protectPage();
        if (!isAuth) return;
        
        const user = await getCurrentUser();
        if (user) {
            document.getElementById('userEmail').textContent = user.email || 'Admin';
        }
        
        await loadData();
    })();

    document.getElementById('logoutBtn').addEventListener('click', async () => {
        await logoutUser();
        window.location.href = 'index.html';
    });

    function formatNumber(num) {
        return (num || 0).toLocaleString('en-KE');
    }

    async function loadData() {
        try {
            const [membersRes, contribRes] = await Promise.all([
                supabaseClient.from('members').select('*'),
                supabaseClient.from('contributions').select('*, members:member_id (name)')
            ]);
            
            if (membersRes.error) throw membersRes.error;
            if (contribRes.error) throw contribRes.error;
            
            allMembers = membersRes.data || [];
            allContributions = contribRes.data || [];
            
            renderStatistics();
            
        } catch (error) {
            console.error("Error loading data:", error);
            document.getElementById('app-root').innerHTML = `
                <div class="card">
                    <h3>⚠️ Error Loading Data</h3>
                    <p style="font-size:0.8rem;">${error.message}</p>
                    <button class="btn" onclick="location.reload()" style="margin-top:0.5rem;">RETRY</button>
                </div>
            `;
        }
    }

    function getFilteredContributions() {
        if (currentYear === 'all') return allContributions;
        return allContributions.filter(c => {
            const year = c.date?.slice(0,4);
            return year === currentYear;
        });
    }

    function getMonthlyData() {
        const months = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
        const monthlyTotals = new Array(12).fill(0);
        
        const filtered = getFilteredContributions();
        filtered.forEach(c => {
            if (c.date) {
                const month = new Date(c.date).getMonth();
                monthlyTotals[month] += c.amount || 0;
            }
        });
        
        return { months, monthlyTotals };
    }

    function getYearlyData() {
        const yearlyMap = new Map();
        
        allContributions.forEach(c => {
            if (c.date) {
                const year = c.date.slice(0,4);
                yearlyMap.set(year, (yearlyMap.get(year) || 0) + (c.amount || 0));
            }
        });
        
        const years = Array.from(yearlyMap.keys()).sort();
        const totals = years.map(y => yearlyMap.get(y));
        
        return { years, totals };
    }

    function getPaymentMethodData() {
        const methodMap = new Map();
        
        allContributions.forEach(c => {
            const method = c.method || 'Other';
            methodMap.set(method, (methodMap.get(method) || 0) + (c.amount || 0));
        });
        
        const methods = Array.from(methodMap.keys());
        const amounts = methods.map(m => methodMap.get(m));
        
        return { methods, amounts };
    }

    function getTopContributors() {
        const contributorMap = new Map();
        
        allContributions.forEach(c => {
            const name = c.members?.name || 'Unknown';
            contributorMap.set(name, (contributorMap.get(name) || 0) + (c.amount || 0));
        });
        
        return Array.from(contributorMap.entries())
            .map(([name, amount]) => ({ name, amount }))
            .sort((a, b) => b.amount - a.amount)
            .slice(0, 5);
    }

    function destroyCharts() {
        if (monthlyChart) { monthlyChart.destroy(); monthlyChart = null; }
        if (paymentMethodChart) { paymentMethodChart.destroy(); paymentMethodChart = null; }
        if (yearlyChart) { yearlyChart.destroy(); yearlyChart = null; }
    }

    function renderStatistics() {
        const container = document.getElementById('app-root');
        const filtered = getFilteredContributions();
        const totalCollected = filtered.reduce((sum, c) => sum + (c.amount || 0), 0);
        const totalExpected = allMembers.reduce((sum, m) => sum + (m.expected_contribution || 0), 0);
        const totalBalance = allMembers.reduce((sum, m) => sum + (m.balance || 0), 0);
        const totalLoan = allMembers.reduce((sum, m) => sum + (m.loan_balance || 0), 0);
        const paidMembers = allMembers.filter(m => (m.balance || 0) === 0).length;
        const uniqueYears = [...new Set(allContributions.map(c => c.date?.slice(0,4)).filter(y => y))].sort().reverse();
        
        const monthlyData = getMonthlyData();
        const yearlyData = getYearlyData();
        const methodData = getPaymentMethodData();
        const topContributors = getTopContributors();
        
        const html = `
            <div class="card">
                <div class="flex-between">
                    <h2 style="font-size:1.2rem;">📊 FINANCIAL STATISTICS</h2>
                    <div class="filter-bar">
                        <select id="yearFilter" class="filter-select">
                            <option value="all" ${currentYear === 'all' ? 'selected' : ''}>ALL YEARS</option>
                            ${uniqueYears.map(y => `<option value="${y}" ${currentYear === y ? 'selected' : ''}>${y}</option>`).join('')}
                        </select>
                    </div>
                </div>
            </div>
            
            <div class="stats-summary">
                <div class="stat-box">
                    <h4>TOTAL MEMBERS</h4>
                    <div class="value">${allMembers.length}</div>
                </div>
                <div class="stat-box">
                    <h4>PAID MEMBERS</h4>
                    <div class="value">${paidMembers}</div>
                    <small>${allMembers.length > 0 ? ((paidMembers/allMembers.length)*100).toFixed(0) : 0}%</small>
                </div>
                <div class="stat-box">
                    <h4>TOTAL EXPECTED</h4>
                    <div class="value">KES ${(totalExpected/1000).toFixed(0)}k</div>
                </div>
                <div class="stat-box">
                    <h4>TOTAL COLLECTED</h4>
                    <div class="value">KES ${(totalCollected/1000).toFixed(0)}k</div>
                    <small>${formatNumber(totalCollected)}</small>
                </div>
                <div class="stat-box">
                    <h4>TOTAL BALANCE</h4>
                    <div class="value">KES ${(totalBalance/1000).toFixed(0)}k</div>
                </div>
                <div class="stat-box">
                    <h4>TOTAL LOAN</h4>
                    <div class="value">KES ${(totalLoan/1000).toFixed(0)}k</div>
                </div>
            </div>
            
            <div class="chart-row">
                <div class="chart-container">
                    <h3>📈 MONTHLY (${currentYear === 'all' ? 'ALL YEARS' : currentYear})</h3>
                    <canvas id="monthlyChart"></canvas>
                </div>
                <div class="chart-container">
                    <h3>🥧 PAYMENT METHODS</h3>
                    <canvas id="paymentMethodChart"></canvas>
                </div>
            </div>
            
            <div class="chart-row">
                <div class="chart-container">
                    <h3>📅 YEARLY TRENDS</h3>
                    <canvas id="yearlyChart"></canvas>
                </div>
                <div class="chart-container">
                    <h3>🏆 TOP 5 CONTRIBUTORS</h3>
                    <div class="table-wrapper">
                        <table style="min-width:200px;">
                            <thead>
                                <tr>
                                    <th>MEMBER</th>
                                    <th>TOTAL AMOUNT</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${topContributors.map(c => `
                                    <tr>
                                        <td><strong>${escapeHtml(c.name)}</strong></td>
                                        <td><span style="color:var(--primary);font-weight:600;">KES ${formatNumber(c.amount)}</span></td>
                                    </tr>
                                `).join('')}
                                ${topContributors.length === 0 ? '<tr><td colspan="2">No contributions yet</span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></td>'}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            
            <div class="card">
                <h3 style="font-size:1rem;">📋 DETAILED STATISTICS</h3>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>METRIC</th>
                                <th>VALUE</th>
                                <th>DETAILS</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>TOTAL CONTRIBUTION RECORDS</span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></td>
                                <td><strong>${filtered.length}</strong></td>
                                <td>Across ${new Set(filtered.map(c => c.member_id)).size} members</span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></td>
                            </tr>
                            <tr>
                                <td>AVERAGE CONTRIBUTION PER MEMBER</span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></td>
                                <td><strong>KES ${formatNumber(totalCollected / (allMembers.length || 1))}</strong></td>
                                <td>EXPECTED: KES ${formatNumber(totalExpected / (allMembers.length || 1))}</span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></td>
                            </tr>
                            <tr>
                                <td>PAYMENT METHODS USED</span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></td>
                                <td><strong>${methodData.methods.length}</strong></td>
                                <td>${methodData.methods.join(', ')}</span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></td>
                            </tr>
                            <tr>
                                <td>ACTIVE MONTHS WITH CONTRIBUTIONS</span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></td>
                                <td><strong>${new Set(filtered.map(c => c.month)).size}</strong></td>
                                <td>MONTHLY TRACKING ACTIVE</span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        `;
        
        container.innerHTML = html;
        
        setTimeout(() => {
            destroyCharts();
            createCharts();
        }, 100);
        
        const yearFilter = document.getElementById('yearFilter');
        if (yearFilter) {
            yearFilter.addEventListener('change', (e) => {
                currentYear = e.target.value;
                renderStatistics();
            });
        }
    }
    
    function createCharts() {
        const monthlyData = getMonthlyData();
        const yearlyData = getYearlyData();
        const methodData = getPaymentMethodData();
        
        const monthlyCtx = document.getElementById('monthlyChart')?.getContext('2d');
        if (monthlyCtx) {
            monthlyChart = new Chart(monthlyCtx, {
                type: 'bar',
                data: {
                    labels: monthlyData.months,
                    datasets: [{
                        label: 'CONTRIBUTIONS (KES)',
                        data: monthlyData.monthlyTotals,
                        backgroundColor: '#2c7a4d',
                        borderRadius: 6,
                        borderSkipped: false
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: { position: 'top', labels: { font: { size: 10 } } },
                        tooltip: { callbacks: { label: (ctx) => `KES ${formatNumber(ctx.raw)}` } }
                    },
                    scales: {
                        y: { beginAtZero: true, ticks: { font: { size: 9 } } },
                        x: { ticks: { font: { size: 9 } } }
                    }
                }
            });
        }
        
        const methodCtx = document.getElementById('paymentMethodChart')?.getContext('2d');
        if (methodCtx && methodData.methods.length > 0) {
            paymentMethodChart = new Chart(methodCtx, {
                type: 'pie',
                data: {
                    labels: methodData.methods,
                    datasets: [{
                        data: methodData.amounts,
                        backgroundColor: ['#2c7a4d', '#3b9b62', '#5cb85c', '#8bc34a', '#a5d6a7'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: { position: 'right', labels: { font: { size: 9 } } },
                        tooltip: { callbacks: { label: (ctx) => `${ctx.label}: KES ${formatNumber(ctx.raw)}` } }
                    }
                }
            });
        }
        
        const yearlyCtx = document.getElementById('yearlyChart')?.getContext('2d');
        if (yearlyCtx && yearlyData.years.length > 0) {
            yearlyChart = new Chart(yearlyCtx, {
                type: 'line',
                data: {
                    labels: yearlyData.years,
                    datasets: [{
                        label: 'YEARLY CONTRIBUTIONS (KES)',
                        data: yearlyData.totals,
                        borderColor: '#2c7a4d',
                        backgroundColor: 'rgba(44, 122, 77, 0.1)',
                        fill: true,
                        tension: 0.3,
                        pointBackgroundColor: '#2c7a4d',
                        pointRadius: 4,
                        pointHoverRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        tooltip: { callbacks: { label: (ctx) => `KES ${formatNumber(ctx.raw)}` } },
                        legend: { labels: { font: { size: 10 } } }
                    },
                    scales: {
                        y: { beginAtZero: true, ticks: { font: { size: 9 } } },
                        x: { ticks: { font: { size: 9 } } }
                    }
                }
            });
        }
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
</script>
