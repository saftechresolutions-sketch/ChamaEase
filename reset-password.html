<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ChamaEase | Reset Password</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #eaf5ef 0%, #d4e8dc 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .reset-container {
            max-width: 450px;
            width: 100%;
        }

        .reset-card {
            background: white;
            border-radius: 2rem;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            border: 1px solid #e2e8f0;
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #2c7a4d, #3b9b62);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .logo p {
            color: #5b6e8c;
            margin-top: 0.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #1e2a3e;
        }

        input {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 1rem;
            border: 1px solid #cbd5e1;
            font-size: 1rem;
            transition: all 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #2c7a4d;
            box-shadow: 0 0 0 3px rgba(44, 122, 77, 0.1);
        }

        .btn {
            width: 100%;
            background: #2c7a4d;
            color: white;
            padding: 0.8rem;
            border: none;
            border-radius: 2rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover {
            background: #1f5a3a;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 0.8rem;
            border-radius: 1rem;
            margin-bottom: 1rem;
            font-size: 0.85rem;
            text-align: center;
        }

        .success-message {
            background: #dff0e4;
            color: #2c7a4d;
            padding: 0.8rem;
            border-radius: 1rem;
            margin-bottom: 1rem;
            font-size: 0.85rem;
            text-align: center;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid white;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 640px) {
            .reset-card {
                padding: 1.5rem;
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="reset-container">
        <div class="reset-card">
            <div class="logo">
                <h1>🌿 ChamaEase</h1>
                <p>Set New Password</p>
            </div>

            <div id="messageArea"></div>

            <form id="resetPasswordForm">
                <div class="form-group">
                    <label>🔒 New Password</label>
                    <input type="password" id="newPassword" placeholder="Enter new password (min 6 characters)" required>
                </div>

                <div class="form-group">
                    <label>🔒 Confirm New Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm new password" required>
                </div>

                <button type="submit" id="updateBtn" class="btn">Update Password</button>
            </form>

            <div style="text-align: center; margin-top: 1rem;">
                <a href="index.html" style="color: #2c7a4d; text-decoration: none;">← Back to Login</a>
            </div>
        </div>
    </div>

    <script src="supabase-config.js"></script>
    <script>
        const updateBtn = document.getElementById('updateBtn');
        const newPassword = document.getElementById('newPassword');
        const confirmPassword = document.getElementById('confirmPassword');
        const messageArea = document.getElementById('messageArea');

        function showMessage(message, type = 'error') {
            messageArea.innerHTML = `<div class="${type === 'error' ? 'error-message' : 'success-message'}">${message}</div>`;
            setTimeout(() => {
                if (messageArea.innerHTML) messageArea.innerHTML = '';
            }, 5000);
        }

        function setLoading(loading) {
            if (loading) {
                updateBtn.disabled = true;
                updateBtn.innerHTML = '<span class="loading"></span> Updating...';
            } else {
                updateBtn.disabled = false;
                updateBtn.innerHTML = 'Update Password';
            }
        }

        // Function to extract access token from URL hash
        function getAccessTokenFromHash() {
            const hash = window.location.hash;
            if (hash && hash.includes('access_token')) {
                const params = new URLSearchParams(hash.substring(1));
                return params.get('access_token');
            }
            return null;
        }

        async function updatePassword() {
            const newPass = newPassword.value.trim();
            const confirmPass = confirmPassword.value.trim();

            if (!newPass || !confirmPass) {
                showMessage('Please fill in all fields');
                return;
            }

            if (newPass !== confirmPass) {
                showMessage('Passwords do not match');
                return;
            }

            if (newPass.length < 6) {
                showMessage('Password must be at least 6 characters');
                return;
            }

            setLoading(true);

            // Try to update using the session from the hash
            const accessToken = getAccessTokenFromHash();
            
            if (accessToken) {
                // Set the session with the recovery token
                const { error: sessionError } = await supabaseClient.auth.setSession({
                    access_token: accessToken,
                    refresh_token: accessToken
                });
                
                if (sessionError) {
                    console.error("Session error:", sessionError);
                    showMessage('Invalid or expired reset link. Please request a new password reset.', 'error');
                    setLoading(false);
                    return;
                }
            }

            // Update the password
            const { data, error } = await supabaseClient.auth.updateUser({
                password: newPass
            });

            if (error) {
                console.error("Update error:", error);
                if (error.message.includes('Invalid refresh token')) {
                    showMessage('Your reset link may have expired. Please request a new password reset.', 'error');
                } else {
                    showMessage(error.message);
                }
                setLoading(false);
                return;
            }

            showMessage('✅ Password updated successfully! Redirecting to login...', 'success');
            
            // Sign out to force re-login with new password
            await supabaseClient.auth.signOut();
            
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 2000);
        }

        document.getElementById('resetPasswordForm').addEventListener('submit', (e) => {
            e.preventDefault();
            updatePassword();
        });

        // Check if the page was accessed with a valid reset token
        async function checkAuth() {
            const hash = window.location.hash;
            const accessToken = getAccessTokenFromHash();
            
            if (!hash || !accessToken) {
                showMessage('Invalid password reset link. Please request a new password reset.', 'error');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 3000);
                return;
            }
            
            // Try to set the session
            const { error } = await supabaseClient.auth.setSession({
                access_token: accessToken,
                refresh_token: accessToken
            });
            
            if (error) {
                console.error("Auth error:", error);
                showMessage('Invalid or expired reset link. Please request a new password reset.', 'error');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 3000);
            }
        }
        
        checkAuth();
    </script>
</body>
</html>
