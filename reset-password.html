<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ChamaEase | Reset Password</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="auth-container">
    <div class="auth-card-wrapper">
        <div class="auth-card">
            <div class="auth-logo">
                <h1>🌿 ChamaEase</h1>
                <p>Set New Password</p>
            </div>

            <div id="messageArea"></div>

            <form id="resetPasswordForm">
                <div class="auth-form-group">
                    <label>🔒 New Password</label>
                    <input type="password" id="newPassword" placeholder="Enter new password (min 6 characters)" required>
                </div>

                <div class="auth-form-group">
                    <label>🔒 Confirm New Password</label>
                    <input type="password" id="confirmPassword" placeholder="Confirm new password" required>
                </div>

                <button type="submit" id="updateBtn" class="auth-btn">Update Password</button>
            </form>

            <div class="auth-back-link">
                <a href="index.html">← Back to Login</a>
            </div>
        </div>
    </div>
    </div>

    <script src="supabase-config.js"></script>
    <script>
        const updateBtn = document.getElementById('updateBtn');
        const newPassword = document.getElementById('newPassword');
        const confirmPassword = document.getElementById('confirmPassword');
        const messageArea = document.getElementById('messageArea');

        function showMessage(message, type = 'error') {
            messageArea.innerHTML = `<div class="${type === 'error' ? 'error-message' : 'success-message'}">${message}</div>`;
            setTimeout(() => {
                if (messageArea.innerHTML) messageArea.innerHTML = '';
            }, 5000);
        }

        function setLoading(loading) {
            if (loading) {
                updateBtn.disabled = true;
                updateBtn.innerHTML = '<span class="auth-loading"></span> Updating...';
            } else {
                updateBtn.disabled = false;
                updateBtn.innerHTML = 'Update Password';
            }
        }

        // Function to extract the recovery tokens from the URL hash
        function getTokensFromHash() {
            const hash = window.location.hash;
            if (!hash || !hash.includes('access_token')) return null;
            const params = new URLSearchParams(hash.substring(1));
            const accessToken = params.get('access_token');
            const refreshToken = params.get('refresh_token');
            if (!accessToken || !refreshToken) return null;
            return { access_token: accessToken, refresh_token: refreshToken };
        }

        let sessionReady = false;

        async function updatePassword() {
            const newPass = newPassword.value.trim();
            const confirmPass = confirmPassword.value.trim();

            if (!newPass || !confirmPass) {
                showMessage('Please fill in all fields');
                return;
            }

            if (newPass !== confirmPass) {
                showMessage('Passwords do not match');
                return;
            }

            if (newPass.length < 6) {
                showMessage('Password must be at least 6 characters');
                return;
            }

            if (!sessionReady) {
                showMessage('Invalid or expired reset link. Please request a new password reset.', 'error');
                return;
            }

            setLoading(true);

            // Session was already established from the recovery link in checkAuth()
            const { data, error } = await supabaseClient.auth.updateUser({
                password: newPass
            });

            if (error) {
                console.error("Update error:", error);
                if (error.message.includes('Invalid refresh token')) {
                    showMessage('Your reset link may have expired. Please request a new password reset.', 'error');
                } else {
                    showMessage(error.message);
                }
                setLoading(false);
                return;
            }

            showMessage('✅ Password updated successfully! Redirecting to login...', 'success');
            
            // Sign out to force re-login with new password
            await supabaseClient.auth.signOut();
            
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 2000);
        }

        document.getElementById('resetPasswordForm').addEventListener('submit', (e) => {
            e.preventDefault();
            updatePassword();
        });

        // Check if the page was accessed with a valid reset token
        async function checkAuth() {
            const tokens = getTokensFromHash();

            if (!tokens) {
                showMessage('Invalid password reset link. Please request a new password reset.', 'error');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 3000);
                return;
            }

            // Establish the session using the recovery link's actual access + refresh tokens
            const { error } = await supabaseClient.auth.setSession(tokens);

            if (error) {
                console.error("Auth error:", error);
                showMessage('Invalid or expired reset link. Please request a new password reset.', 'error');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 3000);
                return;
            }

            sessionReady = true;
        }

        checkAuth();
    </script>
</body>
</html>
