<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ChamaEase | Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #eaf5ef 0%, #d4e8dc 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .login-container {
            max-width: 450px;
            width: 100%;
        }

        .login-card {
            background: white;
            border-radius: 2rem;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            border: 1px solid #e2e8f0;
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #2c7a4d, #3b9b62);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .logo p {
            color: #5b6e8c;
            margin-top: 0.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #1e2a3e;
        }

        input {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 1rem;
            border: 1px solid #cbd5e1;
            font-size: 1rem;
            transition: all 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #2c7a4d;
            box-shadow: 0 0 0 3px rgba(44, 122, 77, 0.1);
        }

        .btn {
            width: 100%;
            background: #2c7a4d;
            color: white;
            padding: 0.8rem;
            border: none;
            border-radius: 2rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover {
            background: #1f5a3a;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 0.8rem;
            border-radius: 1rem;
            margin-bottom: 1rem;
            font-size: 0.85rem;
            text-align: center;
        }

        .success-message {
            background: #dff0e4;
            color: #2c7a4d;
            padding: 0.8rem;
            border-radius: 1rem;
            margin-bottom: 1rem;
            font-size: 0.85rem;
            text-align: center;
        }

        .register-link {
            text-align: center;
            margin-top: 1.5rem;
            color: #5b6e8c;
        }

        .register-link a {
            color: #2c7a4d;
            text-decoration: none;
            font-weight: 600;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid white;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 640px) {
            .login-card {
                padding: 1.5rem;
            }
        }
    </style>
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo">
                <h1>🌿 ChamaEase</h1>
                <p>Community Contribution Hub</p>
            </div>

            <div id="messageArea"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label>📧 Email Address</label>
                    <input type="email" id="email" placeholder="admin@chama.com" required>
                </div>

                <div class="form-group">
                    <label>🔒 Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" id="loginBtn" class="btn">Login to Dashboard</button>
            </form>

            <div class="register-link">
                Don't have an account? <a href="#" id="showRegisterLink">Register now</a>
            </div>
        </div>
    </div>

    <!-- Shared Supabase Config -->
    <script src="supabase-config.js"></script>

    <script>
        // DOM Elements
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const messageArea = document.getElementById('messageArea');
        const showRegisterLink = document.getElementById('showRegisterLink');

        let isRegisterMode = false;

        function showMessage(message, type = 'error') {
            messageArea.innerHTML = `<div class="${type === 'error' ? 'error-message' : 'success-message'}">${message}</div>`;
            setTimeout(() => {
                if (messageArea.innerHTML) messageArea.innerHTML = '';
            }, 4000);
        }

        function setLoading(loading) {
            if (loading) {
                loginBtn.disabled = true;
                loginBtn.innerHTML = '<span class="loading"></span> Please wait...';
            } else {
                loginBtn.disabled = false;
                loginBtn.innerHTML = isRegisterMode ? 'Create Account' : 'Login to Dashboard';
            }
        }

        async function handleLogin(email, password) {
            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                console.error("Login error:", error);
                if (error.message === 'Invalid login credentials') {
                    showMessage('Invalid email or password. Please try again.');
                } else {
                    showMessage(error.message);
                }
                return false;
            }

            if (data.session) {
                showMessage('Login successful! Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1500);
                return true;
            }
            return false;
        }

        async function handleRegister(email, password) {
            const { data, error } = await supabaseClient.auth.signUp({
                email: email,
                password: password,
                options: {
                    data: {
                        role: 'admin'
                    }
                }
            });

            if (error) {
                console.error("Registration error:", error);
                showMessage(error.message);
                return false;
            }

            if (data.user) {
                showMessage('Account created successfully! You can now login.', 'success');
                // Switch back to login mode
                isRegisterMode = false;
                loginBtn.textContent = 'Login to Dashboard';
                showRegisterLink.textContent = 'Register now';
                emailInput.value = '';
                passwordInput.value = '';
            }
            return true;
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                showMessage('Please fill in all fields');
                return;
            }

            setLoading(true);

            if (isRegisterMode) {
                await handleRegister(email, password);
            } else {
                await handleLogin(email, password);
            }

            setLoading(false);
        });

        showRegisterLink.addEventListener('click', (e) => {
            e.preventDefault();
            isRegisterMode = !isRegisterMode;
            
            if (isRegisterMode) {
                loginBtn.textContent = 'Create Account';
                showRegisterLink.textContent = 'Back to Login';
                showMessage('Create a new admin account', 'success');
            } else {
                loginBtn.textContent = 'Login to Dashboard';
                showRegisterLink.textContent = 'Register now';
            }
        });

        // Check if already logged in
        async function checkExistingSession() {
            const isAuth = await isUserAuthenticated();
            if (isAuth) {
                window.location.href = 'dashboard.html';
            }
        }
        checkExistingSession();
    </script>
</body>
</html>
