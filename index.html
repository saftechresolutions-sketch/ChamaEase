<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ChamaEase | Login</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="auth-container">
    <div class="auth-card-wrapper">
        <div class="auth-card">
            <div class="auth-logo">
                <h1>🌿 ChamaEase</h1>
                <p>Community Contribution Hub</p>
            </div>

            <div id="messageArea"></div>

            <form id="loginForm">
                <div class="auth-form-group">
                    <label>📧 Email Address</label>
                    <input type="email" id="email" placeholder="admin@chama.com" required autocomplete="email">
                </div>

                <div class="auth-form-group">
                    <label>🔒 Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
                </div>

                <button type="submit" id="loginBtn" class="auth-btn">Login to Dashboard</button>
            </form>

            <div class="auth-reset-link">
                <a href="#" id="showResetLink">Forgot Password?</a>
            </div>
        </div>
    </div>
    </div>

    <div id="resetModal" class="auth-modal">
        <div class="auth-modal-content">
            <div class="auth-modal-header">
                <h2>Reset Password</h2>
                <button class="auth-modal-close" id="closeModalBtn">&times;</button>
            </div>
            <div id="resetModalMessage"></div>
            <div class="auth-form-group">
                <label>📧 Email Address</label>
                <input type="email" id="resetEmail" placeholder="Enter your registered email" required autocomplete="email">
            </div>
            <p style="font-size: 0.75rem; color: #5b6e8c; margin-bottom: 1rem;">
                We'll send you a password reset link to your email.
            </p>
            <button id="sendResetBtn" class="auth-btn">Send Reset Link</button>
        </div>
    </div>

    <script src="supabase-config.js"></script>
    <script>
        // Cache DOM elements
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const messageArea = document.getElementById('messageArea');
        const showResetLink = document.getElementById('showResetLink');
        const resetModal = document.getElementById('resetModal');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const sendResetBtn = document.getElementById('sendResetBtn');
        const resetEmail = document.getElementById('resetEmail');
        const resetModalMessage = document.getElementById('resetModalMessage');

        function showMessage(message, type = 'error') {
            messageArea.innerHTML = `<div class="${type === 'error' ? 'error-message' : (type === 'info' ? 'info-message' : 'success-message')}">${message}</div>`;
            setTimeout(() => {
                if (messageArea.innerHTML) messageArea.innerHTML = '';
            }, 5000);
        }

        function showModalMessage(message, type = 'error') {
            resetModalMessage.innerHTML = `<div class="${type === 'error' ? 'error-message' : 'success-message'}">${message}</div>`;
            setTimeout(() => {
                if (resetModalMessage.innerHTML) resetModalMessage.innerHTML = '';
            }, 5000);
        }

        function setLoading(loading) {
            if (loading) {
                loginBtn.disabled = true;
                loginBtn.innerHTML = '<span class="auth-loading"></span> Please wait...';
            } else {
                loginBtn.disabled = false;
                loginBtn.innerHTML = 'Login to Dashboard';
            }
        }

        function setResetLoading(loading) {
            if (loading) {
                sendResetBtn.disabled = true;
                sendResetBtn.innerHTML = '<span class="auth-loading"></span> Sending...';
            } else {
                sendResetBtn.disabled = false;
                sendResetBtn.innerHTML = 'Send Reset Link';
            }
        }

        function openResetModal() {
            resetModal.classList.add('active');
            resetEmail.value = '';
            resetModalMessage.innerHTML = '';
        }

        function closeResetModal() {
            resetModal.classList.remove('active');
        }

        async function handlePasswordReset(email) {
            try {
                const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                    redirectTo: `${window.location.origin}/reset-password.html`
                });

                if (error) {
                    if (error.message === 'User not found') {
                        showModalMessage('No account found with this email address.', 'error');
                    } else {
                        showModalMessage(error.message, 'error');
                    }
                    return false;
                }

                showModalMessage('✅ Password reset link sent! Please check your email inbox.', 'success');
                setTimeout(() => closeResetModal(), 2000);
                return true;
            } catch (error) {
                console.error("Reset error:", error);
                showModalMessage('An error occurred. Please try again.', 'error');
                return false;
            }
        }

        async function handleLogin(email, password) {
            try {
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    if (error.message === 'Invalid login credentials') {
                        showMessage('Invalid email or password. Please try again.', 'error');
                    } else if (error.message.includes('Email not confirmed')) {
                        showMessage('Please confirm your email address before logging in. Check your inbox.', 'info');
                    } else {
                        showMessage(error.message, 'error');
                    }
                    return false;
                }

                if (data.session && data.user?.email_confirmed_at) {
                    showMessage('Login successful! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                    return true;
                } else {
                    showMessage('Please confirm your email address before logging in.', 'info');
                    await supabaseClient.auth.signOut();
                    return false;
                }
            } catch (error) {
                console.error("Login error:", error);
                showMessage('Network error. Please check your connection.', 'error');
                return false;
            }
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                showMessage('Please fill in all fields');
                return;
            }

            if (password.length < 6) {
                showMessage('Password must be at least 6 characters');
                return;
            }

            setLoading(true);
            await handleLogin(email, password);
            setLoading(false);
        });

        showResetLink.addEventListener('click', (e) => {
            e.preventDefault();
            openResetModal();
        });

        sendResetBtn.addEventListener('click', async () => {
            const email = resetEmail.value.trim();

            if (!email) {
                showModalMessage('Please enter your email address', 'error');
                return;
            }

            setResetLoading(true);
            await handlePasswordReset(email);
            setResetLoading(false);
        });

        closeModalBtn.addEventListener('click', closeResetModal);
        resetModal.addEventListener('click', (e) => {
            if (e.target === resetModal) closeResetModal();
        });

        resetEmail.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendResetBtn.click();
        });

        async function checkExistingSession() {
            try {
                const isAuth = await isUserAuthenticated();
                if (isAuth) {
                    const user = await getCurrentUser();
                    if (user?.email_confirmed_at) {
                        window.location.href = 'dashboard.html';
                    } else if (user) {
                        await logoutUser();
                        showMessage('Please confirm your email address before logging in.', 'info');
                    }
                }
            } catch (error) {
                console.error("Session check error:", error);
            }
        }
        checkExistingSession();

        function checkForPasswordReset() {
            const hash = window.location.hash;
            if (hash && hash.includes('access_token') && hash.includes('type=recovery')) {
                const params = new URLSearchParams(hash.substring(1));
                const accessToken = params.get('access_token');
                const refreshToken = params.get('refresh_token');
                
                if (accessToken) {
                    supabaseClient.auth.setSession({
                        access_token: accessToken,
                        refresh_token: refreshToken
                    }).then(({ error }) => {
                        if (!error) {
                            window.location.href = 'reset-password.html';
                        }
                    }).catch(console.error);
                }
            }
        }
        checkForPasswordReset();

        // Preload dashboard data in background after login (optimization)
        window.addEventListener('load', () => {
            if (document.hidden !== undefined) {
                document.addEventListener('visibilitychange', () => {
                    if (!document.hidden) checkExistingSession();
                });
            }
        });
    </script>
</body>
</html>
