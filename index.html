<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ChamaEase | Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #eaf5ef 0%, #d4e8dc 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .login-container {
            max-width: 450px;
            width: 100%;
        }

        .login-card {
            background: white;
            border-radius: 2rem;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            border: 1px solid #e2e8f0;
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #2c7a4d, #3b9b62);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .logo p {
            color: #5b6e8c;
            margin-top: 0.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #1e2a3e;
        }

        input {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 1rem;
            border: 1px solid #cbd5e1;
            font-size: 1rem;
            transition: all 0.2s;
        }

        input:focus {
            outline: none;
            border-color: #2c7a4d;
            box-shadow: 0 0 0 3px rgba(44, 122, 77, 0.1);
        }

        .btn {
            width: 100%;
            background: #2c7a4d;
            color: white;
            padding: 0.8rem;
            border: none;
            border-radius: 2rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:hover {
            background: #1f5a3a;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: transparent;
            color: #2c7a4d;
            border: 1px solid #2c7a4d;
            margin-top: 0.5rem;
        }

        .btn-secondary:hover {
            background: #eaf5ef;
        }

        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 0.8rem;
            border-radius: 1rem;
            margin-bottom: 1rem;
            font-size: 0.85rem;
            text-align: center;
        }

        .success-message {
            background: #dff0e4;
            color: #2c7a4d;
            padding: 0.8rem;
            border-radius: 1rem;
            margin-bottom: 1rem;
            font-size: 0.85rem;
            text-align: center;
        }

        .info-message {
            background: #e0f2fe;
            color: #0284c7;
            padding: 0.8rem;
            border-radius: 1rem;
            margin-bottom: 1rem;
            font-size: 0.85rem;
            text-align: center;
        }

        .register-link, .reset-link {
            text-align: center;
            margin-top: 1rem;
            color: #5b6e8c;
        }

        .register-link a, .reset-link a {
            color: #2c7a4d;
            text-decoration: none;
            font-weight: 600;
        }

        .register-link a:hover, .reset-link a:hover {
            text-decoration: underline;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid white;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .mode-toggle {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #e2e8f0;
        }

        .mode-btn {
            flex: 1;
            text-align: center;
            padding: 0.8rem;
            cursor: pointer;
            color: #5b6e8c;
            font-weight: 600;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }

        .mode-btn.active {
            color: #2c7a4d;
            border-bottom-color: #2c7a4d;
        }

        .mode-btn:hover:not(.active) {
            color: #2c7a4d;
        }

        .hide {
            display: none;
        }

        @media (max-width: 640px) {
            .login-card {
                padding: 1.5rem;
            }
        }
    </style>
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo">
                <h1>🌿 ChamaEase</h1>
                <p>Community Contribution Hub</p>
            </div>

            <div id="messageArea"></div>

            <!-- Mode Selection Tabs -->
            <div class="mode-toggle">
                <div class="mode-btn active" data-mode="login">Login</div>
                <div class="mode-btn" data-mode="reset">Reset Password</div>
            </div>

            <!-- Login Form -->
            <form id="loginForm">
                <div class="form-group">
                    <label>📧 Email Address</label>
                    <input type="email" id="loginEmail" placeholder="admin@chama.com" required>
                </div>

                <div class="form-group">
                    <label>🔒 Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password" required>
                </div>

                <button type="submit" id="loginBtn" class="btn">Login to Dashboard</button>
            </form>

            <!-- Reset Password Form (Hidden by default) -->
            <form id="resetForm" class="hide">
                <div class="form-group">
                    <label>📧 Email Address</label>
                    <input type="email" id="resetEmail" placeholder="Enter your registered email" required>
                </div>
                <p style="font-size: 0.75rem; color: #5b6e8c; margin-bottom: 1rem;">
                    We'll send you a password reset link to your email.
                </p>
                <button type="submit" id="resetBtn" class="btn">Send Reset Link</button>
            </form>

            <div class="register-link" id="registerLink">
                Don't have an account? <a href="#" id="showRegisterLink">Register now</a>
            </div>
        </div>
    </div>

    <!-- Shared Supabase Config -->
    <script src="supabase-config.js"></script>

    <script>
        // DOM Elements
        const loginForm = document.getElementById('loginForm');
        const resetForm = document.getElementById('resetForm');
        const loginBtn = document.getElementById('loginBtn');
        const resetBtn = document.getElementById('resetBtn');
        const loginEmail = document.getElementById('loginEmail');
        const loginPassword = document.getElementById('loginPassword');
        const resetEmail = document.getElementById('resetEmail');
        const messageArea = document.getElementById('messageArea');
        const showRegisterLink = document.getElementById('showRegisterLink');
        const modeBtns = document.querySelectorAll('.mode-btn');

        let isRegisterMode = false;
        let currentMode = 'login'; // 'login' or 'reset'

        function showMessage(message, type = 'error') {
            const messageClass = type === 'error' ? 'error-message' : (type === 'info' ? 'info-message' : 'success-message');
            messageArea.innerHTML = `<div class="${messageClass}">${message}</div>`;
            setTimeout(() => {
                if (messageArea.innerHTML) messageArea.innerHTML = '';
            }, 5000);
        }

        function setLoginLoading(loading) {
            if (loading) {
                loginBtn.disabled = true;
                loginBtn.innerHTML = '<span class="loading"></span> Please wait...';
            } else {
                loginBtn.disabled = false;
                loginBtn.innerHTML = isRegisterMode ? 'Create Account' : 'Login to Dashboard';
            }
        }

        function setResetLoading(loading) {
            if (loading) {
                resetBtn.disabled = true;
                resetBtn.innerHTML = '<span class="loading"></span> Sending...';
            } else {
                resetBtn.disabled = false;
                resetBtn.innerHTML = 'Send Reset Link';
            }
        }

        // Switch between Login and Reset modes
        function switchMode(mode) {
            currentMode = mode;
            
            if (mode === 'login') {
                loginForm.classList.remove('hide');
                resetForm.classList.add('hide');
                document.querySelector('.mode-btn[data-mode="login"]').classList.add('active');
                document.querySelector('.mode-btn[data-mode="reset"]').classList.remove('active');
                document.getElementById('registerLink').style.display = 'block';
            } else {
                loginForm.classList.add('hide');
                resetForm.classList.remove('hide');
                document.querySelector('.mode-btn[data-mode="reset"]').classList.add('active');
                document.querySelector('.mode-btn[data-mode="login"]').classList.remove('active');
                document.getElementById('registerLink').style.display = 'none';
            }
            messageArea.innerHTML = '';
        }

        // Handle Password Reset Request
        async function handlePasswordReset(email) {
            const { data, error } = await supabaseClient.auth.resetPasswordForEmail(email, {
                redirectTo: `${window.location.origin}/reset-password.html`
            });

            if (error) {
                console.error("Reset error:", error);
                if (error.message === 'User not found') {
                    showMessage('No account found with this email address.', 'error');
                } else {
                    showMessage(error.message, 'error');
                }
                return false;
            }

            showMessage('✅ Password reset link sent! Please check your email inbox.', 'success');
            // Switch back to login mode after 3 seconds
            setTimeout(() => {
                switchMode('login');
            }, 3000);
            return true;
        }

        // Handle Login
        async function handleLogin(email, password) {
            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (error) {
                console.error("Login error:", error);
                if (error.message === 'Invalid login credentials') {
                    showMessage('Invalid email or password. Please try again.');
                } else if (error.message.includes('Email not confirmed')) {
                    showMessage('Please confirm your email address before logging in. Check your inbox for the confirmation link.', 'info');
                } else {
                    showMessage(error.message);
                }
                return false;
            }

            if (data.session) {
                // Check if email is confirmed
                if (data.user?.email_confirmed_at) {
                    showMessage('Login successful! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1500);
                } else {
                    showMessage('Please confirm your email address before logging in.', 'info');
                    await supabaseClient.auth.signOut();
                }
                return true;
            }
            return false;
        }

        // Handle Registration
        async function handleRegister(email, password) {
            const { data, error } = await supabaseClient.auth.signUp({
                email: email,
                password: password,
                options: {
                    data: {
                        role: 'admin',
                        full_name: 'Administrator'
                    },
                    emailRedirectTo: `${window.location.origin}/dashboard.html`
                }
            });

            if (error) {
                console.error("Registration error:", error);
                showMessage(error.message);
                return false;
            }

            if (data.user) {
                if (data.user.identities && data.user.identities.length === 0) {
                    showMessage('This email is already registered. Please login instead.', 'info');
                } else {
                    showMessage('✅ Registration successful! Please check your email to confirm your account before logging in.', 'success');
                }
                // Switch back to login mode
                isRegisterMode = false;
                loginBtn.textContent = 'Login to Dashboard';
                showRegisterLink.textContent = 'Register now';
                loginEmail.value = '';
                loginPassword.value = '';
                loginEmail.value = email;
            }
            return true;
        }

        // Event Listeners
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (currentMode !== 'login') return;
            
            const email = loginEmail.value.trim();
            const password = loginPassword.value;

            if (!email || !password) {
                showMessage('Please fill in all fields');
                return;
            }

            setLoginLoading(true);

            if (isRegisterMode) {
                await handleRegister(email, password);
            } else {
                await handleLogin(email, password);
            }

            setLoginLoading(false);
        });

        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = resetEmail.value.trim();

            if (!email) {
                showMessage('Please enter your email address');
                return;
            }

            setResetLoading(true);
            await handlePasswordReset(email);
            setResetLoading(false);
        });

        // Mode toggle buttons
        modeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const mode = btn.getAttribute('data-mode');
                switchMode(mode);
            });
        });

        // Registration toggle (only visible in login mode)
        showRegisterLink.addEventListener('click', (e) => {
            e.preventDefault();
            if (currentMode !== 'login') return;
            
            isRegisterMode = !isRegisterMode;
            
            if (isRegisterMode) {
                loginBtn.textContent = 'Create Account';
                showRegisterLink.textContent = 'Back to Login';
                showMessage('Create a new admin account. You will receive a confirmation email.', 'info');
            } else {
                loginBtn.textContent = 'Login to Dashboard';
                showRegisterLink.textContent = 'Register now';
            }
        });

        // Check if already logged in
        async function checkExistingSession() {
            const isAuth = await isUserAuthenticated();
            if (isAuth) {
                // Verify email is confirmed
                const user = await getCurrentUser();
                if (user?.email_confirmed_at) {
                    window.location.href = 'dashboard.html';
                } else {
                    await logoutUser();
                    showMessage('Please confirm your email address before logging in.', 'info');
                }
            }
        }
        checkExistingSession();

        // Check URL for password reset hash (for when user clicks reset link from email)
        async function checkForPasswordReset() {
            const hash = window.location.hash;
            if (hash && hash.includes('access_token') && hash.includes('type=recovery')) {
                // User is coming from password reset email
                showMessage('Please enter your new password below.', 'info');
                
                // Extract tokens from hash
                const params = new URLSearchParams(hash.substring(1));
                const accessToken = params.get('access_token');
                const refreshToken = params.get('refresh_token');
                
                if (accessToken) {
                    // Set session with the recovery tokens
                    const { error } = await supabaseClient.auth.setSession({
                        access_token: accessToken,
                        refresh_token: refreshToken
                    });
                    
                    if (!error) {
                        // Redirect to password reset page
                        window.location.href = 'reset-password.html';
                    }
                }
            }
        }
        checkForPasswordReset();
    </script>
</body>
</html>
