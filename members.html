<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>ChamaEase | Members</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <style>
        /* Additional members-specific styles */
        .stats-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        
        .stat-box {
            background: white;
            border-radius: 12px;
            padding: 0.8rem;
            text-align: center;
            border: 1px solid var(--gray-border);
            box-shadow: var(--shadow-sm);
        }
        
        .stat-box h4 {
            font-size: 0.7rem;
            color: #6c757d;
            margin-bottom: 0.3rem;
        }
        
        .stat-box .number {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary);
        }
        
        .action-buttons-cell {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        
        .btn-icon {
            padding: 5px 10px;
            font-size: 0.7rem;
        }
        
        .member-avatar {
            width: 32px;
            height: 32px;
            background: var(--primary-light);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-right: 8px;
            font-weight: bold;
            color: var(--primary);
        }
        
        .member-info {
            display: flex;
            align-items: center;
        }
        
        .export-buttons {
            display: flex;
            gap: 8px;
        }
        
        @media (max-width: 768px) {
            .stats-summary {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .action-buttons-cell {
                flex-direction: column;
            }
            
            .btn-icon {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
<div class="app-wrapper">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">ChamaEase</div>
            <button class="sidebar-close" id="sidebarClose">✕</button>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item"><span class="icon">📊</span><span class="label">DASHBOARD</span></a>
            <a href="members.html" class="nav-item active"><span class="icon">👥</span><span class="label">MEMBERS</span></a>
            <a href="monthly-records.html" class="nav-item"><span class="icon">📅</span><span class="label">MONTHLY RECORDS</span></a>
            <a href="reports.html" class="nav-item"><span class="icon">📈</span><span class="label">REPORTS</span></a>
            <a href="settings.html" class="nav-item"><span class="icon">⚙️</span><span class="label">SETTINGS</span></a>
        </nav>
    </aside>

    <main class="main-content">
        <div class="top-bar">
            <button class="menu-toggle" id="menuToggle">☰</button>
            <div class="page-title">👥 MEMBERS</div>
            <div class="user-info">
                <span class="user-email" id="userEmail"></span>
                <button id="logoutBtn" class="logout-btn">LOGOUT</button>
            </div>
        </div>
        <div id="app-root" class="container">
            <div style="text-align: center; padding: 2rem;">
                <div class="loading-spinner"></div>
                <p>Loading members...</p>
            </div>
        </div>
        <footer>Smart Chama Management · Manage your members</footer>
    </main>
</div>

<script>
// Using supabaseClient from supabase-config.js
let allMembers = [];
let searchTerm = "";
let memberStats = {};
let currentUser = null;

// Sidebar functions
function openSidebar() {
    document.getElementById("sidebar").classList.add("open");
    document.getElementById("sidebarOverlay").classList.add("active");
}

function closeSidebar() {
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("sidebarOverlay").classList.remove("active");
}

document.getElementById("menuToggle").addEventListener("click", openSidebar);
document.getElementById("sidebarClose").addEventListener("click", closeSidebar);
document.getElementById("sidebarOverlay").addEventListener("click", closeSidebar);
document.getElementById("logoutBtn").addEventListener("click", async function() {
    await logoutUser();
    window.location.href = "index.html";
});

// Toast notification
function showToast(message, type = 'success') {
    const toast = document.createElement('div');
    toast.className = `toast-notification ${type}`;
    toast.innerHTML = (type === 'success' ? '✓ ' : '⚠️ ') + message;
    document.body.appendChild(toast);
    
    setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}

function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/[&<>]/g, function(m) {
        if (m === "&") return "&amp;";
        if (m === "<") return "&lt;";
        if (m === ">") return "&gt;";
        return m;
    });
}

function formatNumber(num) {
    if (num === null || num === undefined) return "0";
    return num.toLocaleString('en-KE');
}

async function loadMemberStats() {
    try {
        const { data: records, error } = await supabaseClient
            .from("monthly_records")
            .select("member_id, monthly_contribution, loan, penalties, loan_balance");
        
        if (error) throw error;
        
        memberStats = {};
        for (var i = 0; i < records.length; i++) {
            var record = records[i];
            if (!memberStats[record.member_id]) {
                memberStats[record.member_id] = {
                    total_contributions: 0,
                    total_loans: 0,
                    total_penalties: 0,
                    current_balance: 0,
                    months_active: new Set()
                };
            }
            memberStats[record.member_id].total_contributions += (record.monthly_contribution || 0);
            memberStats[record.member_id].total_loans += (record.loan || 0);
            memberStats[record.member_id].total_penalties += (record.penalties || 0);
            memberStats[record.member_id].current_balance += (record.loan_balance || 0);
            memberStats[record.member_id].months_active.add(record.year + '-' + record.month);
        }
        
        // Convert months_active Set to count
        for (var id in memberStats) {
            memberStats[id].months_active = memberStats[id].months_active.size;
        }
    } catch (error) {
        console.error("Error loading stats:", error);
    }
}

async function loadMembers() {
    const container = document.getElementById("app-root");
    try {
        const response = await supabaseClient.from("members").select("*").order("name");
        if (response.error) throw response.error;
        allMembers = response.data || [];
        
        await loadMemberStats();
        renderMembersList();
    } catch (error) {
        container.innerHTML = "<div class='card'><h3>⚠️ Error</h3><p>" + error.message + "</p><button class='btn' onclick='location.reload()'>Retry</button></div>";
    }
}

function renderMembersList() {
    const container = document.getElementById("app-root");
    let filtered = allMembers;
    if (searchTerm !== "") {
        filtered = allMembers.filter(function(m) {
            return m.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
                   (m.phone && m.phone.includes(searchTerm)) ||
                   (m.email && m.email.toLowerCase().includes(searchTerm.toLowerCase()));
        });
    }
    
    // Calculate summary stats
    let totalContributions = 0;
    let totalLoans = 0;
    let totalBalance = 0;
    let activeMembers = 0;
    
    for (var i = 0; i < filtered.length; i++) {
        var stats = memberStats[filtered[i].id] || { total_contributions: 0, total_loans: 0, current_balance: 0, months_active: 0 };
        totalContributions += stats.total_contributions;
        totalLoans += stats.total_loans;
        totalBalance += stats.current_balance;
        if (stats.months_active > 0) activeMembers++;
    }
    
    let tableRows = "";
    for (var i = 0; i < filtered.length; i++) {
        var m = filtered[i];
        var stats = memberStats[m.id] || { total_contributions: 0, total_loans: 0, total_penalties: 0, months_active: 0 };
        var avatarLetter = m.name.charAt(0).toUpperCase();
        
        tableRows += "<tr>";
        tableRows += "<td>";
        tableRows += "<div class='member-info'>";
        tableRows += "<div class='member-avatar'>" + avatarLetter + "</div>";
        tableRows += "<div><strong>" + escapeHtml(m.name) + "</strong>";
        if (m.email) tableRows += "<br><small style='color:#6c757d'>" + escapeHtml(m.email) + "</small>";
        tableRows += "</div></div>";
        tableRows += "</td>";
        tableRows += "<td>" + (m.phone ? escapeHtml(m.phone) : "—") + "</td>";
        tableRows += "<td style='color:var(--primary); font-weight:600;'>KES " + formatNumber(stats.total_contributions) + "</td>";
        tableRows += "<td>KES " + formatNumber(stats.total_loans) + "</td>";
        tableRows += "<td>" + stats.months_active + " month(s)</td>";
        tableRows += "<td class='action-buttons-cell'>";
        tableRows += "<button class='btn-sm btn-outline edit-member' data-id='" + m.id + "' data-name='" + escapeHtml(m.name) + "' data-phone='" + escapeHtml(m.phone || "") + "' data-email='" + escapeHtml(m.email || "") + "'>✏️ Edit</button>";
        tableRows += "<button class='btn-sm btn-danger-outline delete-member' data-id='" + m.id + "' data-name='" + escapeHtml(m.name) + "'>🗑️ Del</button>";
        tableRows += "<button class='btn-sm btn-warning view-history' data-id='" + m.id + "' data-name='" + escapeHtml(m.name) + "'>📜 History</button>";
        tableRows += "</td>";
        tableRows += "</tr>";
    }
    
    if (filtered.length === 0) {
        tableRows = "<tr><td colspan='6' style='text-align:center; padding: 2rem;'>👥 No members found. Click 'ADD MEMBER' to get started.</td></tr>";
    }
    
    var html = `
        <div class="stats-summary">
            <div class="stat-box">
                <h4>Total Members</h4>
                <div class="number">${allMembers.length}</div>
            </div>
            <div class="stat-box">
                <h4>Active Members</h4>
                <div class="number">${activeMembers}</div>
            </div>
            <div class="stat-box">
                <h4>Total Contributions</h4>
                <div class="number">KES ${(totalContributions/1000).toFixed(0)}k</div>
                <small>KES ${formatNumber(totalContributions)}</small>
            </div>
            <div class="stat-box">
                <h4>Total Loans</h4>
                <div class="number">KES ${(totalLoans/1000).toFixed(0)}k</div>
                <small>KES ${formatNumber(totalLoans)}</small>
            </div>
        </div>
        
        <div class="flex-between">
            <div>
                <h2>👥 MEMBERS DIRECTORY</h2>
            </div>
            <div class="export-buttons">
                <button class="btn" id="addMemberBtn">+ ADD MEMBER</button>
                <button class="btn-outline" id="exportMembersBtn">📎 Export</button>
            </div>
        </div>
        
        <div class="flex-between">
            <input type="text" id="searchMemberInput" class="search-bar" placeholder="🔍 Search by name, email or phone..." value="${escapeHtml(searchTerm)}">
            <div style="font-size:0.75rem; color:#6c757d">💰 Total Balance: KES ${formatNumber(totalBalance)}</div>
        </div>
        
        <div class="card">
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>MEMBER</th>
                            <th>PHONE</th>
                            <th>TOTAL CONTRIBUTIONS</th>
                            <th>TOTAL LOANS</th>
                            <th>ACTIVE MONTHS</th>
                            <th>ACTIONS</th>
                        </tr>
                    </thead>
                    <tbody>${tableRows}</tbody>
                </table>
            </div>
        </div>
    `;
    
    container.innerHTML = html;
    
    document.getElementById("searchMemberInput").addEventListener("input", function(e) {
        searchTerm = e.target.value;
        renderMembersList();
    });
    
    document.getElementById("addMemberBtn").addEventListener("click", showAddMemberModal);
    document.getElementById("exportMembersBtn").addEventListener("click", exportMembersToCSV);
    
    var editBtns = document.querySelectorAll(".edit-member");
    for (var i = 0; i < editBtns.length; i++) {
        editBtns[i].addEventListener("click", function() {
            showEditMemberModal(this.dataset.id, this.dataset.name, this.dataset.phone, this.dataset.email);
        });
    }
    
    var deleteBtns = document.querySelectorAll(".delete-member");
    for (var i = 0; i < deleteBtns.length; i++) {
        deleteBtns[i].addEventListener("click", function() {
            confirmDeleteMember(this.dataset.id, this.dataset.name);
        });
    }
    
    var historyBtns = document.querySelectorAll(".view-history");
    for (var i = 0; i < historyBtns.length; i++) {
        historyBtns[i].addEventListener("click", function() {
            window.location.href = "member-history.html?id=" + this.dataset.id + "&name=" + encodeURIComponent(this.dataset.name);
        });
    }
}

function exportMembersToCSV() {
    var csvRows = [];
    csvRows.push(["CHAMA MEMBERS LIST"]);
    csvRows.push(["Generated:", new Date().toLocaleString()]);
    csvRows.push([]);
    csvRows.push(["NAME", "EMAIL", "PHONE", "TOTAL CONTRIBUTIONS", "TOTAL LOANS", "TOTAL PENALTIES", "ACTIVE MONTHS"]);
    
    for (var i = 0; i < allMembers.length; i++) {
        var m = allMembers[i];
        var stats = memberStats[m.id] || { total_contributions: 0, total_loans: 0, total_penalties: 0, months_active: 0 };
        csvRows.push([
            m.name,
            m.email || "",
            m.phone || "",
            "KES " + formatNumber(stats.total_contributions),
            "KES " + formatNumber(stats.total_loans),
            "KES " + formatNumber(stats.total_penalties),
            stats.months_active
        ]);
    }
    
    var csv = "";
    for (var i = 0; i < csvRows.length; i++) {
        csv += csvRows[i].join(",") + "\n";
    }
    
    var blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    var link = document.createElement("a");
    var url = URL.createObjectURL(blob);
    link.href = url;
    link.setAttribute("download", "chama_members_" + new Date().toISOString().slice(0,10) + ".csv");
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
    showToast("Members list exported!");
}

function showAddMemberModal() {
    var modal = document.createElement("div");
    modal.className = "modal";
    modal.innerHTML = `
        <div class="modal-content">
            <h3>➕ ADD NEW MEMBER</h3>
            <div class="form-group">
                <label>MEMBER NAME *</label>
                <input type="text" id="memberName" placeholder="Enter full name" autocomplete="off">
            </div>
            <div class="form-group">
                <label>EMAIL ADDRESS</label>
                <input type="email" id="memberEmail" placeholder="member@example.com">
            </div>
            <div class="form-group">
                <label>PHONE NUMBER</label>
                <input type="tel" id="memberPhone" placeholder="0712345678">
            </div>
            <div style="display:flex; gap:10px; margin-top:1rem;">
                <button id="confirmAddBtn" class="btn">✅ ADD MEMBER</button>
                <button id="cancelModalBtn" class="btn-outline btn">❌ CANCEL</button>
            </div>
        </div>
    `;
    document.body.appendChild(modal);
    
    document.getElementById("confirmAddBtn").onclick = async function() {
        var name = document.getElementById("memberName").value.trim();
        var email = document.getElementById("memberEmail").value.trim();
        var phone = document.getElementById("memberPhone").value.trim();
        
        if (!name) { 
            showToast("Please enter member name", "error");
            return; 
        }
        
        var newMember = { name: name };
        if (email) newMember.email = email;
        if (phone) newMember.phone = phone;
        
        var response = await supabaseClient.from("members").insert([newMember]);
        if (response.error) { 
            showToast(response.error.message, "error");
            return; 
        }
        modal.remove();
        await loadMembers();
        showToast("✅ Member added successfully!");
    };
    document.getElementById("cancelModalBtn").onclick = function() { modal.remove(); };
}

function showEditMemberModal(id, name, phone, email) {
    var modal = document.createElement("div");
    modal.className = "modal";
    modal.innerHTML = `
        <div class="modal-content">
            <h3>✏️ EDIT MEMBER</h3>
            <div class="form-group">
                <label>MEMBER NAME *</label>
                <input type="text" id="memberName" value="${escapeHtml(name)}">
            </div>
            <div class="form-group">
                <label>EMAIL ADDRESS</label>
                <input type="email" id="memberEmail" value="${escapeHtml(email || "")}">
            </div>
            <div class="form-group">
                <label>PHONE NUMBER</label>
                <input type="tel" id="memberPhone" value="${escapeHtml(phone || "")}">
            </div>
            <div style="display:flex; gap:10px; margin-top:1rem;">
                <button id="confirmEditBtn" class="btn">💾 SAVE CHANGES</button>
                <button id="cancelModalBtn" class="btn-outline btn">❌ CANCEL</button>
            </div>
        </div>
    `;
    document.body.appendChild(modal);
    
    document.getElementById("confirmEditBtn").onclick = async function() {
        var newName = document.getElementById("memberName").value.trim();
        var newEmail = document.getElementById("memberEmail").value.trim();
        var newPhone = document.getElementById("memberPhone").value.trim();
        
        if (!newName) { 
            showToast("Please enter member name", "error");
            return; 
        }
        
        var updateData = { name: newName };
        updateData.email = newEmail || null;
        updateData.phone = newPhone || null;
        
        var response = await supabaseClient.from("members").update(updateData).eq("id", id);
        if (response.error) { 
            showToast(response.error.message, "error");
            return; 
        }
        modal.remove();
        await loadMembers();
        showToast("✅ Member updated successfully!");
    };
    document.getElementById("cancelModalBtn").onclick = function() { modal.remove(); };
}

function confirmDeleteMember(id, name) {
    if (!confirm("⚠️ Delete " + name + "?\n\nThis will also delete ALL records (contributions, loans, penalties) for this member. This action cannot be undone!")) return;
    
    (async function() {
        var response = await supabaseClient.from("members").delete().eq("id", id);
        if (response.error) { 
            showToast(response.error.message, "error");
            return; 
        }
        await loadMembers();
        showToast("✅ Member deleted successfully!");
    })();
}

// Initialize
(async function() {
    const isAuth = await protectPage();
    if (isAuth) {
        const user = await getCurrentUser();
        if (user && document.getElementById("userEmail")) {
            document.getElementById("userEmail").textContent = user.email || "Admin";
        }
        await loadMembers();
    }
})();
</script>
</body>
</html>
