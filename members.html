<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>ChamaEase | Members</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #1e2a3e;
        }

        :root {
            --primary: #2c7a4d;
            --primary-light: #eaf5ef;
            --primary-dark: #1f5a3a;
            --danger: #dc4c4c;
            --gray-border: #e2e8f0;
            --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.04);
            --radius-card: 16px;
            --radius-btn: 32px;
            --sidebar-width: 280px;
        }

        .app-wrapper {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: white;
            border-right: 1px solid var(--gray-border);
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            overflow-y: auto;
            transition: transform 0.3s ease;
            z-index: 1000;
            box-shadow: var(--shadow-sm);
            transform: translateX(0);
        }

        .sidebar-header {
            padding: 1rem;
            border-bottom: 1px solid var(--gray-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-logo {
            font-weight: 800;
            font-size: 1.2rem;
            background: linear-gradient(135deg, var(--primary), #3b9b62);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .sidebar-close {
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            color: #94a3b8;
            display: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            align-items: center;
            justify-content: center;
        }

        .sidebar-close:hover {
            background: #fee2e2;
            color: var(--danger);
        }

        .sidebar-nav {
            padding: 0.8rem 0;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0.7rem 1rem;
            margin: 0.2rem 0.8rem;
            border-radius: 12px;
            text-decoration: none;
            color: #4a5568;
            transition: all 0.2s;
            cursor: pointer;
        }

        .nav-item:hover {
            background: var(--primary-light);
            color: var(--primary);
        }

        .nav-item.active {
            background: var(--primary);
            color: white;
        }

        .nav-item .icon {
            font-size: 1.1rem;
            width: 26px;
            text-align: center;
        }

        .nav-item .label {
            font-weight: 500;
            font-size: 0.85rem;
        }

        .nav-submenu {
            padding-left: 2.8rem;
        }

        .nav-submenu .nav-item {
            padding: 0.5rem 1rem;
            font-size: 0.8rem;
        }

        .nav-divider {
            height: 1px;
            background: var(--gray-border);
            margin: 0.6rem 1rem;
        }

        .main-content {
            flex: 1;
            margin-left: var(--sidebar-width);
            transition: margin-left 0.3s ease;
            width: calc(100% - var(--sidebar-width));
        }

        .top-bar {
            background: white;
            padding: 0.7rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--gray-border);
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 0;
            z-index: 99;
        }

        .menu-toggle {
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            color: var(--primary);
            padding: 6px;
            border-radius: 50%;
        }

        .page-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1e2a3e;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .user-email {
            font-size: 0.7rem;
            color: #5b6e8c;
            display: none;
        }

        @media (min-width: 480px) {
            .user-email {
                display: inline;
            }
        }

        .logout-btn {
            background: transparent;
            border: 1px solid #dc2626;
            color: #dc2626;
            padding: 0.35rem 0.7rem;
            border-radius: 2rem;
            cursor: pointer;
            font-size: 0.7rem;
        }

        .logout-btn:hover {
            background: #dc2626;
            color: white;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1rem;
            width: 100%;
            min-height: 70vh;
        }

        .card {
            background: white;
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-sm);
            padding: 1rem;
            margin-bottom: 1rem;
            border: 1px solid var(--gray-border);
        }

        .btn {
            border: none;
            background: var(--primary);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: var(--radius-btn);
            font-weight: 600;
            cursor: pointer;
            font-size: 0.75rem;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
        }

        .btn-sm {
            padding: 0.25rem 0.6rem;
            font-size: 0.65rem;
        }

        .btn-danger {
            background: var(--danger);
        }

        .btn-danger-outline {
            background: transparent;
            border: 1px solid var(--danger);
            color: var(--danger);
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.7rem;
        }

        th, td {
            text-align: left;
            padding: 0.6rem 0.4rem;
            border-bottom: 1px solid var(--gray-border);
        }

        th {
            background: #f8fafc;
            font-weight: 600;
        }

        .badge-paid {
            background: #dff0e4;
            color: #1f5a3a;
            padding: 0.15rem 0.5rem;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.65rem;
            display: inline-block;
        }

        .badge-unpaid {
            background: #ffe6e5;
            color: #b91c1c;
            padding: 0.15rem 0.5rem;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.65rem;
            display: inline-block;
        }

        .badge-loan {
            background: #fef3c7;
            color: #d97706;
            padding: 0.15rem 0.5rem;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.65rem;
            display: inline-block;
        }

        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin-bottom: 1rem;
        }

        .search-bar {
            padding: 0.5rem 1rem;
            border-radius: 40px;
            border: 1px solid var(--gray-border);
            background: white;
            width: 100%;
            max-width: 260px;
            font-size: 0.8rem;
        }

        input, select {
            padding: 0.5rem;
            border-radius: 1rem;
            border: 1px solid #cbd5e1;
            width: 100%;
            font-size: 0.8rem;
        }

        footer {
            text-align: center;
            padding: 0.8rem;
            font-size: 0.65rem;
            color: #6c757d;
            border-top: 1px solid var(--gray-border);
            margin-top: 1rem;
        }

        .action-group {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .loading-spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid #e2e8f0;
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1001;
        }

        .modal-content {
            background: white;
            border-radius: 1rem;
            padding: 1.2rem;
            max-width: 90%;
            width: 400px;
        }

        .form-group {
            margin-bottom: 0.8rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.2rem;
            font-weight: 600;
            font-size: 0.75rem;
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
        }

        .sidebar-overlay.active {
            display: block;
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .main-content {
                margin-left: 0;
                width: 100%;
            }
            .sidebar-close {
                display: flex;
            }
            .container {
                padding: 0.8rem;
            }
            .flex-between {
                flex-direction: column;
                align-items: stretch;
            }
            .search-bar {
                max-width: 100%;
            }
            table, thead, tbody, th, td, tr {
                display: block;
            }
            thead {
                display: none;
            }
            tr {
                margin-bottom: 1rem;
                border: 1px solid var(--gray-border);
                border-radius: 12px;
                background: white;
                padding: 0.5rem;
            }
            td {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 0.6rem 0.4rem;
                border-bottom: 1px solid var(--gray-border);
                font-size: 0.75rem;
            }
            td:last-child {
                border-bottom: none;
            }
            td::before {
                content: attr(data-label);
                font-weight: 600;
                width: 40%;
                color: #5b6e8c;
            }
            .action-group {
                justify-content: flex-end;
                gap: 8px;
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="app-wrapper">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">🌿 ChamaEase</div>
            <button class="sidebar-close" id="sidebarClose">✕</button>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item"><span class="icon">📊</span><span class="label">DASHBOARD</span></a>
            <a href="members.html" class="nav-item active"><span class="icon">👥</span><span class="label">MEMBERS</span></a>
            <a href="contributions.html" class="nav-item"><span class="icon">💰</span><span class="label">CONTRIBUTIONS</span></a>
            <div class="nav-divider"></div>
            <a href="reports.html" class="nav-item"><span class="icon">📋</span><span class="label">REPORTS</span></a>
            <a href="settings.html" class="nav-item"><span class="icon">⚙️</span><span class="label">SETTINGS</span></a>
        </nav>
    </aside>

    <main class="main-content">
        <div class="top-bar">
            <button class="menu-toggle" id="menuToggle">☰</button>
            <div class="page-title">MEMBERS</div>
            <div class="user-info">
                <span class="user-email" id="userEmail"></span>
                <button id="logoutBtn" class="logout-btn">LOGOUT</button>
            </div>
        </div>
        <div id="app-root" class="container">
            <div style="text-align: center; padding: 2rem;">
                <div class="loading-spinner"></div>
                <p style="margin-top: 0.5rem; font-size: 0.8rem;">Loading members...</p>
            </div>
        </div>
        <footer>✨ Smart Chama Management · Tap ☰ for menu</footer>
    </main>
</div>

<script src="supabase-config.js"></script>
<script>
    let allMembers = [];
    let searchTerm = '';

    const menuToggle = document.getElementById('menuToggle');
    const sidebar = document.getElementById('sidebar');
    const sidebarClose = document.getElementById('sidebarClose');
    const sidebarOverlay = document.getElementById('sidebarOverlay');
    
    function openSidebar() {
        sidebar.classList.add('open');
        sidebarOverlay.classList.add('active');
    }
    
    function closeSidebar() {
        sidebar.classList.remove('open');
        sidebarOverlay.classList.remove('active');
    }
    
    if (menuToggle) menuToggle.addEventListener('click', openSidebar);
    if (sidebarClose) sidebarClose.addEventListener('click', closeSidebar);
    if (sidebarOverlay) sidebarOverlay.addEventListener('click', closeSidebar);
    
    window.addEventListener('resize', () => {
        if (window.innerWidth > 768) closeSidebar();
    });

    (async function() {
        const isAuth = await protectPage();
        if (!isAuth) return;
        const user = await getCurrentUser();
        if (user) document.getElementById('userEmail').textContent = user.email || 'Admin';
        await loadMembers();
    })();

    document.getElementById('logoutBtn').addEventListener('click', async () => {
        await logoutUser();
        window.location.href = 'index.html';
    });

    function formatNumber(num) {
        return (num || 0).toLocaleString('en-KE');
    }

    async function loadMembers() {
        const container = document.getElementById('app-root');
        try {
            const { data: members, error } = await supabaseClient.from('members').select('*').order('name');
            if (error) throw error;
            allMembers = members || [];
            renderMembersList();
        } catch (error) {
            container.innerHTML = `<div class="card"><h3>⚠️ ERROR LOADING MEMBERS</h3><p>${error.message}</p><button class="btn" onclick="location.reload()">RETRY</button></div>`;
        }
    }

    function renderMembersList() {
        const container = document.getElementById('app-root');
        let filtered = searchTerm ? allMembers.filter(m => m.name.toLowerCase().includes(searchTerm.toLowerCase()) || (m.phone && m.phone.includes(searchTerm))) : allMembers;
        
        const html = `
            <div class="flex-between">
                <h2>👥 MEMBERS</h2>
                <button class="btn" id="addMemberBtn">+ ADD MEMBER</button>
            </div>
            <div class="flex-between">
                <input type="text" id="searchMemberInput" class="search-bar" placeholder="🔍 SEARCH BY NAME OR PHONE..." value="${escapeHtml(searchTerm)}">
            </div>
            <div class="card">
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>MEMBER</th>
                                <th>PHONE</th>
                                <th>EXPECTED</th>
                                <th>PAID</th>
                                <th>MONTHLY BALANCE</th>
                                <th>LOAN BALANCE</th>
                                <th>STATUS</th>
                                <th>ACTIONS</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${filtered.map(m => `
                                <tr>
                                    <td data-label="MEMBER"><strong>${escapeHtml(m.name)}</strong></td>
                                    <td data-label="PHONE">${escapeHtml(m.phone) || '-'}</td>
                                    <td data-label="EXPECTED">KES ${formatNumber(m.expected_contribution)}</span></td>
                                    <td data-label="PAID">KES ${formatNumber(m.total_contributed)}</span></td>
                                    <td data-label="MONTHLY BALANCE"><span style="color:${(m.balance || 0) > 0 ? '#dc2626' : '#2c7a4d'}; font-weight:600;">KES ${formatNumber(m.balance)}</span></td>
                                    <td data-label="LOAN BALANCE"><span class="badge-loan">KES ${formatNumber(m.loan_balance || 0)}</span></td>
                                    <td data-label="STATUS"><span class="${(m.balance || 0) === 0 ? 'badge-paid' : 'badge-unpaid'}">${(m.balance || 0) === 0 ? 'PAID' : 'UNPAID'}</span></td>
                                    <td data-label="ACTIONS" class="action-group">
                                        <button class="btn-sm btn-outline view-detail" data-id="${m.id}">VIEW</button>
                                        <button class="btn-sm btn-outline edit-member" data-id="${m.id}" data-name="${escapeHtml(m.name)}" data-phone="${escapeHtml(m.phone)}" data-expected="${m.expected_contribution || 0}" data-loan="${m.loan_balance || 0}">EDIT</button>
                                        ${(m.balance || 0) > 0 ? `<button class="btn-sm btn-outline settle-balance" data-id="${m.id}" data-balance="${m.balance}">SETTLE</button>` : ''}
                                        <button class="btn-sm btn-danger-outline delete-member" data-id="${m.id}" data-name="${escapeHtml(m.name)}">DEL</button>
                                    </td>
                                </tr>
                            `).join('')}
                            ${filtered.length === 0 ? '<tr><td colspan="8">No members found</span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></span></td>'}
                        </tbody>
                    </table>
                </div>
            </div>
        `;
        container.innerHTML = html;
        
        document.getElementById('searchMemberInput')?.addEventListener('input', (e) => { searchTerm = e.target.value; renderMembersList(); });
        document.getElementById('addMemberBtn')?.addEventListener('click', showAddMemberModal);
        document.querySelectorAll('.view-detail').forEach(btn => btn.addEventListener('click', () => showMemberDetails(btn.dataset.id)));
        document.querySelectorAll('.edit-member').forEach(btn => btn.addEventListener('click', () => showEditMemberModal(btn.dataset.id, btn.dataset.name, btn.dataset.phone, btn.dataset.expected, btn.dataset.loan)));
        document.querySelectorAll('.settle-balance').forEach(btn => btn.addEventListener('click', () => showSettleModal(btn.dataset.id, parseFloat(btn.dataset.balance))));
        document.querySelectorAll('.delete-member').forEach(btn => btn.addEventListener('click', () => confirmDeleteMember(btn.dataset.id, btn.dataset.name)));
    }

    function showAddMemberModal() {
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `
            <div class="modal-content">
                <h3>➕ ADD NEW MEMBER</h3>
                <div id="modalMessage"></div>
                <div class="form-group"><label>MEMBER NAME *</label><input type="text" id="memberName" placeholder="Enter full name"></div>
                <div class="form-group"><label>PHONE NUMBER *</label><input type="tel" id="memberPhone" placeholder="0712345678"></div>
                <div class="form-group"><label>EXPECTED CONTRIBUTION (KES)</label><input type="number" id="memberExpected" value="0"></div>
                <div class="form-group"><label>LOAN BALANCE (KES)</label><input type="number" id="memberLoan" value="0"></div>
                <div style="display:flex; gap:10px; margin-top:1rem;"><button id="confirmAddBtn" class="btn">ADD MEMBER</button><button id="cancelModalBtn" class="btn-outline btn">CANCEL</button></div>
            </div>
        `;
        document.body.appendChild(modal);
        
        document.getElementById('confirmAddBtn').onclick = async () => {
            const name = document.getElementById('memberName').value.trim();
            const phone = document.getElementById('memberPhone').value.trim();
            const expected = parseFloat(document.getElementById('memberExpected').value) || 0;
            const loanBalance = parseFloat(document.getElementById('memberLoan').value) || 0;
            if (!name || !phone) { alert('Please fill in name and phone number'); return; }
            const { error } = await supabaseClient.from('members').insert([{ name, phone, expected_contribution: expected, total_contributed: 0, balance: expected, loan_balance: loanBalance, status: expected > 0 ? 'unpaid' : 'paid' }]);
            if (error) { alert(error.message); return; }
            modal.remove();
            await loadMembers();
            alert('✅ Member added successfully!');
        };
        document.getElementById('cancelModalBtn').onclick = () => modal.remove();
    }

    function showEditMemberModal(id, name, phone, expected, loan) {
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `
            <div class="modal-content">
                <h3>✏️ EDIT MEMBER</h3>
                <div id="modalMessage"></div>
                <div class="form-group"><label>MEMBER NAME *</label><input type="text" id="memberName" value="${escapeHtml(name)}"></div>
                <div class="form-group"><label>PHONE NUMBER *</label><input type="tel" id="memberPhone" value="${escapeHtml(phone)}"></div>
                <div class="form-group"><label>EXPECTED CONTRIBUTION (KES)</label><input type="number" id="memberExpected" value="${expected}"></div>
                <div class="form-group"><label>LOAN BALANCE (KES)</label><input type="number" id="memberLoan" value="${loan || 0}"></div>
                <div style="display:flex; gap:10px; margin-top:1rem;"><button id="confirmEditBtn" class="btn">SAVE CHANGES</button><button id="cancelModalBtn" class="btn-outline btn">CANCEL</button></div>
            </div>
        `;
        document.body.appendChild(modal);
        
        document.getElementById('confirmEditBtn').onclick = async () => {
            const newName = document.getElementById('memberName').value.trim();
            const newPhone = document.getElementById('memberPhone').value.trim();
            const newExpected = parseFloat(document.getElementById('memberExpected').value) || 0;
            const newLoan = parseFloat(document.getElementById('memberLoan').value) || 0;
            if (!newName || !newPhone) { alert('Please fill in name and phone number'); return; }
            const { error } = await supabaseClient.from('members').update({ name: newName, phone: newPhone, expected_contribution: newExpected, loan_balance: newLoan }).eq('id', id);
            if (error) { alert(error.message); return; }
            modal.remove();
            await loadMembers();
            alert('✅ Member updated successfully!');
        };
        document.getElementById('cancelModalBtn').onclick = () => modal.remove();
    }

    function showSettleModal(memberId, currentBalance) {
        if (currentBalance <= 0) { alert('Balance is already zero'); return; }
        const member = allMembers.find(m => m.id === memberId);
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `
            <div class="modal-content">
                <h3>💰 SETTLE PAYMENT</h3>
                <p><strong>${escapeHtml(member?.name || 'Unknown')}</strong></p>
                <p>MONTHLY BALANCE: KES ${formatNumber(currentBalance)}</p>
                <div class="form-group"><label>AMOUNT TO PAY (KES):</label><input type="number" id="settleAmount" value="${currentBalance}" min="1" max="${currentBalance}"></div>
                <div class="form-group"><label>PAYMENT METHOD:</label><select id="settleMethodSelect"><option value="M-Pesa">M-PESA</option><option value="Cash">CASH</option><option value="Bank Transfer">BANK TRANSFER</option></select></div>
                <div class="form-group"><label>DATE:</label><input type="date" id="settleDate" value="${new Date().toISOString().slice(0,10)}"></div>
                <div style="display:flex; gap:10px; margin-top:1rem;"><button id="confirmSettleBtn" class="btn">CONFIRM</button><button id="cancelSettleBtn" class="btn-outline btn">CANCEL</button></div>
            </div>
        `;
        document.body.appendChild(modal);
        
        document.getElementById('confirmSettleBtn').onclick = async () => {
            let amount = parseFloat(document.getElementById('settleAmount').value);
            const method = document.getElementById('settleMethodSelect').value;
            const date = document.getElementById('settleDate').value;
            if (isNaN(amount) || amount <= 0) { alert('Please enter a valid amount'); return; }
            if (amount > currentBalance) amount = currentBalance;
            const user = await getCurrentUser();
            const { error } = await supabaseClient.from('contributions').insert([{ member_id: memberId, amount: amount, month: date.slice(0,7), date, method, type: 'Payment', recorded_by: user?.id }]);
            if (error) { alert('Error: ' + error.message); modal.remove(); return; }
            modal.remove();
            alert(`✅ Paid KES ${formatNumber(amount)}`);
            await loadMembers();
        };
        document.getElementById('cancelSettleBtn').onclick = () => modal.remove();
    }

    function confirmDeleteMember(id, name) {
        if (!confirm(`Delete ${name}? This will also delete all contribution records.`)) return;
        (async () => {
            const { error } = await supabaseClient.from('members').delete().eq('id', id);
            if (error) { alert('Error: ' + error.message); return; }
            await loadMembers();
            alert('✅ Member deleted successfully!');
        })();
    }

    async function showMemberDetails(memberId) {
        const member = allMembers.find(m => m.id === memberId);
        if (!member) return;
        const { data: contributions } = await supabaseClient.from('contributions').select('*').eq('member_id', memberId).order('date', { ascending: false });
        const totalPaid = contributions?.reduce((sum, c) => sum + c.amount, 0) || 0;
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.innerHTML = `
            <div class="modal-content" style="max-width:500px; max-height:80vh; overflow-y:auto;">
                <div class="flex-between"><h3>👤 ${escapeHtml(member.name)}</h3><button id="closeModalBtn" style="background:none; border:none; font-size:1.5rem; cursor:pointer;">&times;</button></div>
                <p><strong>📞 PHONE:</strong> ${escapeHtml(member.phone) || '-'}</p>
                <p><strong>💰 EXPECTED:</strong> KES ${formatNumber(member.expected_contribution)}</p>
                <p><strong>💵 TOTAL PAID:</strong> KES ${formatNumber(totalPaid)}</p>
                <p><strong>⚖️ MONTHLY BALANCE:</strong> KES ${formatNumber(member.balance)}</p>
                <p><strong>🏦 LOAN BALANCE:</strong> <span class="badge-loan">KES ${formatNumber(member.loan_balance || 0)}</span></p>
                <p><strong>📊 STATUS:</strong> <span class="${(member.balance || 0) === 0 ? 'badge-paid' : 'badge-unpaid'}">${(member.balance || 0) === 0 ? 'PAID' : 'UNPAID'}</span></p>
                <h4>📅 CONTRIBUTION HISTORY</h4>
                <div class="table-wrapper"><table><thead><tr><th>DATE</th><th>AMOUNT</th><th>METHOD</th><th>MONTH</th></tr></thead><tbody>${contributions?.map(c => `<tr><td>${c.date || '-'}</td><td>KES ${formatNumber(c.amount)}</td><td>${c.method || '-'}</td><td>${c.month || '-'}</td></tr>`).join('') || '<tr><td colspan="4">No contributions yet</td></tr>'}</tbody></table></div>
            </div>
        `;
        document.body.appendChild(modal);
        modal.querySelector('#closeModalBtn').onclick = () => modal.remove();
        modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m] || m));
    }
</script>
</body>
</html>
