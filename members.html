<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>ChamaEase | Members</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <style>
        /* Modern Members Page Styles */
        .hero-section {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border-radius: 24px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            color: white;
            position: relative;
            overflow: hidden;
        }
        
        .hero-section::before {
            content: "👥";
            position: absolute;
            right: -20px;
            bottom: -20px;
            font-size: 100px;
            opacity: 0.1;
            pointer-events: none;
        }
        
        .hero-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }
        
        .hero-subtitle {
            font-size: 0.8rem;
            opacity: 0.9;
        }
        
        /* Search and Action Bar */
        .action-bar {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            margin-bottom: 1.5rem;
        }
        
        @media (min-width: 768px) {
            .action-bar {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }
        
        .search-wrapper {
            flex: 1;
            position: relative;
            max-width: 100%;
        }
        
        @media (min-width: 768px) {
            .search-wrapper {
                max-width: 320px;
            }
        }
        
        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
            pointer-events: none;
        }
        
        .search-input {
            width: 100%;
            padding: 12px 16px 12px 42px;
            border: 1px solid var(--gray-border);
            border-radius: 40px;
            font-size: 0.85rem;
            background: white;
            transition: all 0.2s;
        }
        
        .search-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(182, 85, 42, 0.1);
        }
        
        .btn-group {
            display: flex;
            gap: 0.6rem;
        }
        
        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        
        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
        }
        
        .btn-secondary {
            background: white;
            border: 1px solid var(--gray-border);
            padding: 10px 18px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.85rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        
        .btn-secondary:hover {
            background: var(--primary-light);
            border-color: var(--primary);
        }
        
        /* Member Cards - Mobile First */
        .members-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        
        .member-card {
            background: white;
            border-radius: 20px;
            border: 1px solid var(--gray-border);
            overflow: hidden;
            transition: all 0.2s;
            cursor: pointer;
        }
        
        .member-card:hover {
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            transform: translateY(-2px);
        }
        
        .member-card-header {
            padding: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            border-bottom: 1px solid var(--gray-border);
            background: #fafbfc;
        }
        
        .member-avatar-large {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: 700;
            color: white;
            flex-shrink: 0;
        }
        
        .member-info-large {
            flex: 1;
        }
        
        .member-name-large {
            font-size: 1rem;
            font-weight: 700;
            color: #1e2a3e;
            margin-bottom: 0.25rem;
        }
        
        .member-contact {
            font-size: 0.7rem;
            color: #6c757d;
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        
        .member-contact span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        
        .member-card-stats {
            padding: 1rem;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.8rem;
            background: white;
        }
        
        .member-stat-item {
            text-align: center;
        }
        
        .member-stat-value {
            font-size: 1rem;
            font-weight: 700;
            color: var(--primary);
        }
        
        .member-stat-label {
            font-size: 0.6rem;
            color: #6c757d;
            text-transform: uppercase;
        }
        
        .member-card-actions {
            padding: 0.8rem 1rem;
            display: flex;
            gap: 0.5rem;
            border-top: 1px solid var(--gray-border);
            background: #fafbfc;
        }
        
        .action-btn {
            flex: 1;
            padding: 8px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 500;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        
        .action-edit {
            background: var(--primary-light);
            color: var(--primary);
        }
        
        .action-edit:hover {
            background: var(--primary);
            color: white;
        }
        
        .action-history {
            background: #e0f2fe;
            color: #0284c7;
        }
        
        .action-history:hover {
            background: #0284c7;
            color: white;
        }
        
        .action-delete {
            background: #fee2e2;
            color: var(--danger);
        }
        
        .action-delete:hover {
            background: var(--danger);
            color: white;
        }
        
        /* Tablet and Desktop Adjustments */
        @media (min-width: 768px) {
            .hero-title {
                font-size: 1.8rem;
            }
            
            .member-card {
                display: flex;
                align-items: center;
                justify-content: space-between;
                flex-wrap: wrap;
            }
            
            .member-card-header {
                flex: 2;
                border-bottom: none;
                background: transparent;
            }
            
            .member-card-stats {
                flex: 2;
                border-left: 1px solid var(--gray-border);
                padding: 0.8rem 1rem;
            }
            
            .member-card-actions {
                flex: 1;
                border-top: none;
                border-left: 1px solid var(--gray-border);
                background: transparent;
                justify-content: flex-end;
            }
            
            .action-btn {
                flex: none;
                min-width: 80px;
            }
        }
        
        @media (min-width: 1024px) {
            .member-card-header {
                flex: 3;
            }
            
            .member-card-stats {
                flex: 3;
            }
        }
        
        /* Loading States */
        .skeleton-card {
            background: white;
            border-radius: 20px;
            padding: 1rem;
            border: 1px solid var(--gray-border);
        }
        
        .skeleton-line {
            height: 12px;
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 8px;
            margin-bottom: 8px;
        }
        
        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body>
<div class="app-wrapper">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">ChamaEase</div>
            <button class="sidebar-close" id="sidebarClose">✕</button>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item"><span class="icon">📊</span><span class="label">DASHBOARD</span></a>
            <a href="members.html" class="nav-item active"><span class="icon">👥</span><span class="label">MEMBERS</span></a>
            <a href="member-history.html" class="nav-item"><span class="icon">📜</span><span class="label">MEMBER HISTORY</span></a>
            <a href="monthly-records.html" class="nav-item"><span class="icon">📅</span><span class="label">MONTHLY RECORDS</span></a>
            <a href="reports.html" class="nav-item"><span class="icon">📈</span><span class="label">REPORTS</span></a>
            <a href="settings.html" class="nav-item"><span class="icon">⚙️</span><span class="label">SETTINGS</span></a>
        </nav>
    </aside>

    <main class="main-content">
        <div class="top-bar">
            <button class="menu-toggle" id="menuToggle">☰</button>
            <div class="page-title">MEMBERS</div>
            <div class="header-right">
                <div class="header-quicklinks">
                    <a href="members.html" class="quicklink-btn active" title="Members">👥</a>
                    <a href="monthly-records.html" class="quicklink-btn" title="Monthly Records">📅</a>
                    <a href="reports.html" class="quicklink-btn" title="Reports">📈</a>
                </div>
                <div class="user-info">
                    <span class="user-email" id="userEmail"></span>
                    <button id="logoutBtn" class="logout-btn">LOGOUT</button>
                </div>
            </div>
        </div>
        <div id="app-root" class="container">
            <div style="text-align: center; padding: 2rem;">
                <div class="loading-spinner"></div>
                <p style="margin-top: 1rem;">Loading members...</p>
            </div>
        </div>
        <footer>Smart Chama Management · Manage your members</footer>
    </main>
</div>

<script>
// Using supabaseClient from supabase-config.js
let allMembers = [];
let searchTerm = "";
let memberStats = {};

// Sidebar functions
function openSidebar() {
    document.getElementById("sidebar").classList.add("open");
    document.getElementById("sidebarOverlay").classList.add("active");
}

function closeSidebar() {
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("sidebarOverlay").classList.remove("active");
}

document.getElementById("menuToggle").addEventListener("click", openSidebar);
document.getElementById("sidebarClose").addEventListener("click", closeSidebar);
document.getElementById("sidebarOverlay").addEventListener("click", closeSidebar);
document.getElementById("logoutBtn").addEventListener("click", async function() {
    await logoutUser();
    window.location.href = "index.html";
});

function showToast(message, isError = false) {
    const toast = document.createElement('div');
    toast.className = `toast-notification ${isError ? 'error' : ''}`;
    toast.textContent = isError ? '⚠️ ' + message : '✓ ' + message;
    document.body.appendChild(toast);
    setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}

function escapeHtml(str) {
    if (!str) return "";
    return String(str).replace(/[&<>"']/g, function(m) {
        if (m === "&") return "&amp;";
        if (m === "<") return "&lt;";
        if (m === ">") return "&gt;";
        if (m === '"') return "&quot;";
        if (m === "'") return "&#39;";
        return m;
    });
}

function formatNumber(num) {
    if (num === null || num === undefined) return "0";
    return num.toLocaleString('en-KE');
}

async function loadMemberStats() {
    try {
        const { data: records, error } = await supabaseClient
            .from("monthly_records")
            .select("member_id, monthly_contribution, loan, penalties, loan_balance");
        
        if (error) throw error;
        
        memberStats = {};
        for (var i = 0; i < records.length; i++) {
            var record = records[i];
            if (!memberStats[record.member_id]) {
                memberStats[record.member_id] = {
                    total_contributions: 0,
                    total_loans: 0,
                    total_penalties: 0,
                    current_balance: 0,
                    months_active: new Set()
                };
            }
            memberStats[record.member_id].total_contributions += (record.monthly_contribution || 0);
            memberStats[record.member_id].total_loans += (record.loan || 0);
            memberStats[record.member_id].total_penalties += (record.penalties || 0);
            memberStats[record.member_id].current_balance += (record.loan_balance || 0);
            memberStats[record.member_id].months_active.add(record.year + '-' + record.month);
        }
        
        for (var id in memberStats) {
            memberStats[id].months_active = memberStats[id].months_active.size;
        }
    } catch (error) {
        console.error("Error loading stats:", error);
    }
}

async function loadMembers() {
    try {
        const response = await supabaseClient.from("members").select("*").order("name");
        if (response.error) throw response.error;
        allMembers = response.data || [];
        
        await loadMemberStats();
        renderMembersList();
    } catch (error) {
        document.getElementById("app-root").innerHTML = `
            <div class="empty-state">
                <div class="empty-icon">⚠️</div>
                <div class="empty-title">Error Loading Members</div>
                <div class="empty-text">${error.message}</div>
                <button class="btn-primary" onclick="location.reload()">Retry</button>
            </div>
        `;
    }
}

function renderMembersList() {
    let filtered = allMembers;
    if (searchTerm !== "") {
        filtered = allMembers.filter(function(m) {
            return m.name.toLowerCase().includes(searchTerm.toLowerCase()) || 
                   (m.phone && m.phone.includes(searchTerm)) ||
                   (m.email && m.email.toLowerCase().includes(searchTerm.toLowerCase()));
        });
    }
    
    // Calculate summary stats
    let totalContributions = 0;
    let totalLoans = 0;
    let totalBalance = 0;
    let activeMembers = 0;
    
    for (var i = 0; i < filtered.length; i++) {
        var stats = memberStats[filtered[i].id] || { total_contributions: 0, total_loans: 0, current_balance: 0, months_active: 0 };
        totalContributions += stats.total_contributions;
        totalLoans += stats.total_loans;
        totalBalance += stats.current_balance;
        if (stats.months_active > 0) activeMembers++;
    }
    
    // Build member cards
    let membersHtml = "";
    if (filtered.length === 0) {
        membersHtml = `
            <div class="empty-state">
                <div class="empty-icon">🔍</div>
                <div class="empty-title">No members found</div>
                <div class="empty-text">Try a different search term or add a new member</div>
                <button class="btn-primary" id="emptyAddBtn">+ ADD MEMBER</button>
            </div>
        `;
    } else {
        for (var i = 0; i < filtered.length; i++) {
            var m = filtered[i];
            var stats = memberStats[m.id] || { total_contributions: 0, total_loans: 0, total_penalties: 0, months_active: 0, current_balance: 0 };
            var avatarLetter = m.name.charAt(0).toUpperCase();
            var hasEmail = m.email ? true : false;
            var hasPhone = m.phone ? true : false;
            
            membersHtml += `
                <div class="member-card" data-member-id="${m.id}">
                    <div class="member-card-header">
                        <div class="member-avatar-large">${avatarLetter}</div>
                        <div class="member-info-large">
                            <div class="member-name-large">${escapeHtml(m.name)}</div>
                            <div class="member-contact">
                                ${hasEmail ? `<span>📧 ${escapeHtml(m.email)}</span>` : ''}
                                ${hasPhone ? `<span>📞 ${escapeHtml(m.phone)}</span>` : ''}
                                ${!hasEmail && !hasPhone ? '<span>📭 No contact info</span>' : ''}
                            </div>
                        </div>
                    </div>
                    <div class="member-card-stats">
                        <div class="member-stat-item">
                            <div class="member-stat-value">KES ${formatNumber(stats.total_contributions)}</div>
                            <div class="member-stat-label">Contributions</div>
                        </div>
                        <div class="member-stat-item">
                            <div class="member-stat-value">KES ${formatNumber(stats.total_loans)}</div>
                            <div class="member-stat-label">Loans</div>
                        </div>
                        <div class="member-stat-item">
                            <div class="member-stat-value">${stats.months_active}</div>
                            <div class="member-stat-label">Active Months</div>
                        </div>
                    </div>
                    <div class="member-card-actions">
                        <button class="action-btn action-edit" data-action="edit" data-member-id="${escapeHtml(m.id)}">✏️ Edit</button>
                        <button class="action-btn action-history" data-action="history" data-member-id="${escapeHtml(m.id)}">📜 History</button>
                        <button class="action-btn action-delete" data-action="delete" data-member-id="${escapeHtml(m.id)}">🗑️ Delete</button>
                    </div>
                </div>
            `;
        }
    }
    
    var html = `
        <div class="hero-section">
            <div class="hero-title">Member Directory</div>
            <div class="hero-subtitle">Manage your chama members and track their contributions</div>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">👥</div>
                <div class="stat-value">${allMembers.length}</div>
                <div class="stat-label">Total Members</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">⭐</div>
                <div class="stat-value">${activeMembers}</div>
                <div class="stat-label">Active Members</div>
                <div class="stat-small">have records</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">💰</div>
                <div class="stat-value">KES ${formatNumber(totalContributions)}</div>
                <div class="stat-label">Total Contributions</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📊</div>
                <div class="stat-value">KES ${formatNumber(totalBalance)}</div>
                <div class="stat-label">Outstanding Balance</div>
                <div class="stat-small">loan balance</div>
            </div>
        </div>
        
        <div class="action-bar">
            <div class="search-wrapper">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchMemberInput" class="search-input" placeholder="Search by name, email or phone..." value="${escapeHtml(searchTerm)}">
            </div>
            <div class="btn-group">
                <button class="btn-primary" id="addMemberBtn">➕ ADD MEMBER</button>
                <button class="btn-secondary" id="exportMembersBtn">📎 Export</button>
            </div>
        </div>
        
        <div class="members-grid" id="membersGrid">
            ${membersHtml}
        </div>
    `;
    
    document.getElementById("app-root").innerHTML = html;
    
    // Bind events
    document.getElementById("searchMemberInput").addEventListener("input", function(e) {
        searchTerm = e.target.value;
        renderMembersList();
    });
    
    if (document.getElementById("addMemberBtn")) {
        document.getElementById("addMemberBtn").addEventListener("click", showAddMemberModal);
    }
    if (document.getElementById("emptyAddBtn")) {
        document.getElementById("emptyAddBtn").addEventListener("click", showAddMemberModal);
    }
    if (document.getElementById("exportMembersBtn")) {
        document.getElementById("exportMembersBtn").addEventListener("click", exportMembersToCSV);
    }

    var membersGrid = document.getElementById("membersGrid");
    if (membersGrid) {
        membersGrid.addEventListener("click", function(e) {
            var btn = e.target.closest("[data-action]");
            if (!btn) return;
            var member = allMembers.find(function(mm) { return mm.id === btn.getAttribute("data-member-id"); });
            if (!member) return;
            var action = btn.getAttribute("data-action");
            if (action === "edit") editMember(member);
            else if (action === "history") viewHistory(member);
            else if (action === "delete") deleteMember(member);
        });
    }
}

function showAddMemberModal() {
    const modalHtml = `
        <div class="modal-modern" id="memberModal">
            <div class="modal-content-modern">
                <div class="modal-header-modern">
                    <div class="modal-title">➕ Add New Member</div>
                    <button class="modal-close-btn" onclick="closeModal()">✕</button>
                </div>
                <div class="modal-body">
                    <div class="form-group-modern">
                        <label class="form-label">Full Name *</label>
                        <input type="text" id="memberName" class="form-input" placeholder="Enter full name" autocomplete="off">
                    </div>
                    <div class="form-group-modern">
                        <label class="form-label">Email Address</label>
                        <input type="email" id="memberEmail" class="form-input" placeholder="member@example.com">
                    </div>
                    <div class="form-group-modern">
                        <label class="form-label">Phone Number</label>
                        <input type="tel" id="memberPhone" class="form-input" placeholder="0712345678">
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn-secondary" onclick="closeModal()">Cancel</button>
                    <button class="btn-primary" id="confirmAddBtn">Add Member</button>
                </div>
            </div>
        </div>
    `;
    
    document.body.insertAdjacentHTML('beforeend', modalHtml);
    
    document.getElementById("confirmAddBtn").onclick = async function() {
        const name = document.getElementById("memberName").value.trim();
        const email = document.getElementById("memberEmail").value.trim();
        const phone = document.getElementById("memberPhone").value.trim();
        
        if (!name) {
            showToast("Please enter member name", true);
            return;
        }
        
        const newMember = { name: name };
        if (email) newMember.email = email;
        if (phone) newMember.phone = phone;
        
        const response = await supabaseClient.from("members").insert([newMember]);
        if (response.error) {
            showToast(response.error.message, true);
            return;
        }
        
        closeModal();
        await loadMembers();
        showToast("Member added successfully!");
    };
}

window.editMember = function(member) {
    const modalHtml = `
        <div class="modal-modern" id="memberModal">
            <div class="modal-content-modern">
                <div class="modal-header-modern">
                    <div class="modal-title">✏️ Edit Member</div>
                    <button class="modal-close-btn" onclick="closeModal()">✕</button>
                </div>
                <div class="modal-body">
                    <div class="form-group-modern">
                        <label class="form-label">Full Name *</label>
                        <input type="text" id="memberName" class="form-input" value="${escapeHtml(member.name)}">
                    </div>
                    <div class="form-group-modern">
                        <label class="form-label">Email Address</label>
                        <input type="email" id="memberEmail" class="form-input" value="${escapeHtml(member.email || '')}">
                    </div>
                    <div class="form-group-modern">
                        <label class="form-label">Phone Number</label>
                        <input type="tel" id="memberPhone" class="form-input" value="${escapeHtml(member.phone || '')}">
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn-secondary" onclick="closeModal()">Cancel</button>
                    <button class="btn-primary" id="confirmEditBtn">Save Changes</button>
                </div>
            </div>
        </div>
    `;

    document.body.insertAdjacentHTML('beforeend', modalHtml);

    document.getElementById("confirmEditBtn").onclick = async function() {
        const newName = document.getElementById("memberName").value.trim();
        const newEmail = document.getElementById("memberEmail").value.trim();
        const newPhone = document.getElementById("memberPhone").value.trim();

        if (!newName) {
            showToast("Please enter member name", true);
            return;
        }

        const updateData = { name: newName };
        updateData.email = newEmail || null;
        updateData.phone = newPhone || null;

        const response = await supabaseClient.from("members").update(updateData).eq("id", member.id);
        if (response.error) {
            showToast(response.error.message, true);
            return;
        }

        closeModal();
        await loadMembers();
        showToast("Member updated successfully!");
    };
};

window.deleteMember = function(member) {
    if (!confirm(`⚠️ Delete "${member.name}"?\n\nThis will also delete ALL records (contributions, loans, penalties) for this member. This action cannot be undone!`)) return;

    (async function() {
        const response = await supabaseClient.from("members").delete().eq("id", member.id);
        if (response.error) {
            showToast(response.error.message, true);
            return;
        }
        await loadMembers();
        showToast("Member deleted successfully!");
    })();
};

window.viewHistory = function(member) {
    window.location.href = `member-history.html?id=${encodeURIComponent(member.id)}&name=${encodeURIComponent(member.name)}`;
};

window.closeModal = function() {
    const modal = document.getElementById("memberModal");
    if (modal) modal.remove();
};

function exportMembersToCSV() {
    var csvRows = [];
    csvRows.push(["CHAMA MEMBERS LIST"]);
    csvRows.push(["Generated:", new Date().toLocaleString()]);
    csvRows.push([]);
    csvRows.push(["NAME", "EMAIL", "PHONE", "TOTAL CONTRIBUTIONS", "TOTAL LOANS", "TOTAL PENALTIES", "ACTIVE MONTHS"]);
    
    for (var i = 0; i < allMembers.length; i++) {
        var m = allMembers[i];
        var stats = memberStats[m.id] || { total_contributions: 0, total_loans: 0, total_penalties: 0, months_active: 0 };
        csvRows.push([
            m.name,
            m.email || "",
            m.phone || "",
            "KES " + formatNumber(stats.total_contributions),
            "KES " + formatNumber(stats.total_loans),
            "KES " + formatNumber(stats.total_penalties),
            stats.months_active
        ]);
    }
    
    var csv = "";
    for (var i = 0; i < csvRows.length; i++) {
        csv += csvRows[i].join(",") + "\n";
    }
    
    var blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    var link = document.createElement("a");
    var url = URL.createObjectURL(blob);
    link.href = url;
    link.setAttribute("download", "chama_members_" + new Date().toISOString().slice(0,10) + ".csv");
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
    showToast("Members list exported!");
}

// Initialize
(async function() {
    const isAuth = await protectPage();
    if (isAuth) {
        const user = await getCurrentUser();
        if (user && document.getElementById("userEmail")) {
            document.getElementById("userEmail").textContent = user.email || "Admin";
        }
        await loadMembers();
    }
})();
</script>
