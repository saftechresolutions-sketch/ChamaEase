<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>ChamaEase | Member History</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <style>
        .member-header {
            background: linear-gradient(135deg, var(--primary), #3b9b62);
            color: white;
            padding: 1.5rem;
            border-radius: var(--radius-card);
            margin-bottom: 1rem;
        }
        
        .member-header h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }
        
        .member-header p {
            opacity: 0.9;
            font-size: 0.85rem;
        }
        
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        
        .summary-card {
            background: white;
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
            border: 1px solid var(--gray-border);
            box-shadow: var(--shadow-sm);
        }
        
        .summary-card h4 {
            font-size: 0.7rem;
            color: #6c757d;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }
        
        .summary-card .value {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary);
        }
        
        .summary-card .sub {
            font-size: 0.7rem;
            color: #6c757d;
            margin-top: 0.25rem;
        }
        
        .history-table-container {
            overflow-x: auto;
        }
        
        .history-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
        }
        
        .history-table th,
        .history-table td {
            border: 1px solid var(--gray-border);
            padding: 10px 8px;
            text-align: left;
        }
        
        .history-table th {
            background: #f8fafc;
            font-weight: 600;
        }
        
        .history-table tr:hover {
            background: var(--primary-light);
        }
        
        .month-badge {
            display: inline-block;
            padding: 3px 10px;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        
        .no-data {
            text-align: center;
            padding: 3rem;
            color: #6c757d;
        }
        
        .back-btn {
            margin-bottom: 1rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .contribution-positive {
            color: var(--primary);
            font-weight: 600;
        }
        
        .penalty-negative {
            color: var(--danger);
            font-weight: 600;
        }
        
        @media (max-width: 768px) {
            .summary-cards {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .history-table th,
            .history-table td {
                padding: 6px 4px;
                font-size: 0.7rem;
            }
            
            .member-header h1 {
                font-size: 1.2rem;
            }
        }
        
        @media print {
            .sidebar, .top-bar, .back-btn, .action-buttons, footer {
                display: none !important;
            }
            
            .main-content {
                margin-left: 0 !important;
            }
            
            .member-header {
                background: var(--primary);
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }
    </style>
</head>
<body>
<div class="app-wrapper">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">ChamaEase</div>
            <button class="sidebar-close" id="sidebarClose">✕</button>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item"><span class="icon">📊</span><span class="label">DASHBOARD</span></a>
            <a href="members.html" class="nav-item"><span class="icon">👥</span><span class="label">MEMBERS</span></a>
            <a href="monthly-records.html" class="nav-item"><span class="icon">📅</span><span class="label">MONTHLY RECORDS</span></a>
            <a href="reports.html" class="nav-item"><span class="icon">📈</span><span class="label">REPORTS</span></a>
            <a href="settings.html" class="nav-item"><span class="icon">⚙️</span><span class="label">SETTINGS</span></a>
        </nav>
    </aside>

    <main class="main-content">
        <div class="top-bar">
            <button class="menu-toggle" id="menuToggle">☰</button>
            <div class="page-title">📜 MEMBER HISTORY</div>
            <div class="user-info">
                <span class="user-email" id="userEmail"></span>
                <button id="logoutBtn" class="logout-btn">LOGOUT</button>
            </div>
        </div>
        <div id="app-root" class="container">
            <div style="text-align: center; padding: 2rem;">
                <div class="loading-spinner"></div>
                <p>Loading member history...</p>
            </div>
        </div>
        <footer>Smart Chama Management · Complete member transaction history</footer>
    </main>
</div>

<script>
// Using supabaseClient from supabase-config.js
let memberId = null;
let memberName = null;
let memberRecords = [];
let memberInfo = null;

// Sidebar functions
function openSidebar() {
    document.getElementById("sidebar").classList.add("open");
    document.getElementById("sidebarOverlay").classList.add("active");
}

function closeSidebar() {
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("sidebarOverlay").classList.remove("active");
}

document.getElementById("menuToggle").addEventListener("click", openSidebar);
document.getElementById("sidebarClose").addEventListener("click", closeSidebar);
document.getElementById("sidebarOverlay").addEventListener("click", closeSidebar);
document.getElementById("logoutBtn").addEventListener("click", async function() {
    await logoutUser();
    window.location.href = "index.html";
});

function showToast(message, type = 'success') {
    const toast = document.createElement('div');
    toast.className = `toast-notification ${type}`;
    toast.innerHTML = (type === 'success' ? '✓ ' : '⚠️ ') + message;
    document.body.appendChild(toast);
    
    setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}

function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/[&<>]/g, function(m) {
        if (m === "&") return "&amp;";
        if (m === "<") return "&lt;";
        if (m === ">") return "&gt;";
        return m;
    });
}

function formatNumber(num) {
    if (num === null || num === undefined) return "0";
    return num.toLocaleString('en-KE');
}

async function loadMemberData() {
    const container = document.getElementById("app-root");
    
    try {
        // Get member ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        memberId = urlParams.get('id');
        memberName = urlParams.get('name');
        
        if (!memberId) {
            container.innerHTML = `
                <div class="card" style="text-align:center; padding: 3rem;">
                    <h3>⚠️ No member selected</h3>
                    <p>Please go back to the members page and select a member.</p>
                    <a href="members.html" class="btn">← Back to Members</a>
                </div>
            `;
            return;
        }
        
        // Get member info
        const { data: memberData, error: memberError } = await supabaseClient
            .from("members")
            .select("*")
            .eq("id", memberId)
            .single();
        
        if (memberError) throw memberError;
        memberInfo = memberData;
        if (!memberName) memberName = memberInfo.name;
        
        // Get member records
        const { data: records, error: recordsError } = await supabaseClient
            .from("monthly_records")
            .select("*")
            .eq("member_id", memberId)
            .order("year", { ascending: false })
            .order("month", { ascending: false });
        
        if (recordsError) throw recordsError;
        memberRecords = records || [];
        
        renderHistory();
    } catch (error) {
        console.error("Error loading member data:", error);
        container.innerHTML = `
            <div class="card" style="text-align:center; padding: 3rem;">
                <h3>⚠️ Error loading data</h3>
                <p>${error.message}</p>
                <button class="btn" onclick="location.reload()">Retry</button>
                <a href="members.html" class="btn-outline btn" style="margin-left: 0.5rem;">← Back</a>
            </div>
        `;
    }
}

function renderHistory() {
    const container = document.getElementById("app-root");
    
    // Calculate summary statistics
    let totalLoan = 0;
    let totalLoanDeductions = 0;
    let totalLoanBalance = 0;
    let totalContributions = 0;
    let totalPenalties = 0;
    let monthsWithData = 0;
    
    for (var i = 0; i < memberRecords.length; i++) {
        var r = memberRecords[i];
        totalLoan += (r.loan || 0);
        totalLoanDeductions += (r.loan_deductions || 0);
        totalLoanBalance += (r.loan_balance || 0);
        totalContributions += (r.monthly_contribution || 0);
        totalPenalties += (r.penalties || 0);
        monthsWithData++;
    }
    
    var monthNames = ["JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE", "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"];
    
    var tableRows = "";
    if (memberRecords.length === 0) {
        tableRows = `<tr><td colspan="7" class="no-data">📭 No monthly records found for this member. Add records from the Monthly Records page.</td></tr>`;
    } else {
        for (var i = 0; i < memberRecords.length; i++) {
            var r = memberRecords[i];
            var monthName = monthNames[r.month - 1];
            var hasContribution = r.monthly_contribution > 0;
            var hasPenalty = r.penalties > 0;
            
            tableRows += `<tr>`;
            tableRows += `<td><span class="month-badge">${monthName} ${r.year}</span></td>`;
            tableRows += `<td class="${r.loan > 0 ? 'contribution-positive' : ''}">KES ${formatNumber(r.loan)}</td>`;
            tableRows += `<td>KES ${formatNumber(r.loan_deductions)}</td>`;
            tableRows += `<td class="${r.loan_balance > 0 ? 'contribution-positive' : ''}">KES ${formatNumber(r.loan_balance)}</td>`;
            tableRows += `<td class="${hasContribution ? 'contribution-positive' : ''}">KES ${formatNumber(r.monthly_contribution)}</td>`;
            tableRows += `<td class="${hasPenalty ? 'penalty-negative' : ''}">KES ${formatNumber(r.penalties)}</td>`;
            tableRows += `<td>`;
            if (r.created_at) {
                var date = new Date(r.created_at);
                tableRows += `<small>${date.toLocaleDateString()}</small>`;
            } else {
                tableRows += `—`;
            }
            tableRows += `</td>`;
            tableRows += `</tr>`;
        }
    }
    
    var html = `
        <a href="members.html" class="btn-outline btn back-btn">← Back to Members</a>
        
        <div class="member-header">
            <h1>👤 ${escapeHtml(memberName)}</h1>
            <p>📧 ${memberInfo?.email || 'No email provided'} &nbsp;|&nbsp; 📞 ${memberInfo?.phone || 'No phone provided'}</p>
            <p>🆔 Member since: ${memberInfo?.created_at ? new Date(memberInfo.created_at).toLocaleDateString() : 'N/A'}</p>
        </div>
        
        <div class="summary-cards">
            <div class="summary-card">
                <h4>Total Contributions</h4>
                <div class="value">KES ${formatNumber(totalContributions)}</div>
                <div class="sub">over ${monthsWithData} month(s)</div>
            </div>
            <div class="summary-card">
                <h4>Total Loans</h4>
                <div class="value">KES ${formatNumber(totalLoan)}</div>
                <div class="sub">loans taken</div>
            </div>
            <div class="summary-card">
                <h4>Loan Balance</h4>
                <div class="value">KES ${formatNumber(totalLoanBalance)}</div>
                <div class="sub">remaining to pay</div>
            </div>
            <div class="summary-card">
                <h4>Total Penalties</h4>
                <div class="value">KES ${formatNumber(totalPenalties)}</div>
                <div class="sub">late fees</div>
            </div>
            <div class="summary-card">
                <h4>Loan Repayments</h4>
                <div class="value">KES ${formatNumber(totalLoanDeductions)}</div>
                <div class="sub">paid towards loans</div>
            </div>
            <div class="summary-card">
                <h4>Net Position</h4>
                <div class="value">KES ${formatNumber(totalContributions - totalLoanBalance)}</div>
                <div class="sub">contributions minus debt</div>
            </div>
        </div>
        
        <div class="card">
            <div class="flex-between" style="margin-bottom: 1rem;">
                <h3>📋 Monthly Transaction History</h3>
                <div class="action-buttons">
                    <button id="exportHistoryBtn" class="btn-outline btn-sm">📎 Export CSV</button>
                    <button id="printHistoryBtn" class="btn-outline btn-sm">🖨️ Print</button>
                </div>
            </div>
            <div class="history-table-container">
                <table class="history-table" id="history-table">
                    <thead>
                        <tr>
                            <th>Period</th>
                            <th>Loan</th>
                            <th>Deductions</th>
                            <th>Balance</th>
                            <th>Contribution</th>
                            <th>Penalties</th>
                            <th>Date Added</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${tableRows}
                    </tbody>
                </table>
            </div>
        </div>
        
        <div class="card">
            <h3>💡 Summary Insights</h3>
            <ul style="margin-top: 0.8rem; margin-left: 1.2rem; font-size: 0.8rem; line-height: 1.6;">
                <li>💰 <strong>Average monthly contribution:</strong> KES ${monthsWithData > 0 ? formatNumber(Math.round(totalContributions / monthsWithData)) : 0}</li>
                <li>📊 <strong>Total value to chama:</strong> KES ${formatNumber(totalContributions + totalLoanDeductions)}</li>
                <li>⚖️ <strong>Financial health score:</strong> ${totalLoanBalance === 0 ? '✅ Debt Free' : (totalLoanBalance < totalContributions ? '⚠️ Some debt' : '🔴 High debt')}</li>
            </ul>
        </div>
    `;
    
    container.innerHTML = html;
    
    document.getElementById("exportHistoryBtn").addEventListener("click", exportHistory);
    document.getElementById("printHistoryBtn").addEventListener("click", function() { window.print(); });
}

function exportHistory() {
    var monthNames = ["JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE", "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"];
    
    var csvRows = [];
    csvRows.push(["MEMBER HISTORY - " + memberName]);
    csvRows.push(["Generated:", new Date().toLocaleString()]);
    csvRows.push([]);
    csvRows.push(["PERIOD", "LOAN", "LOAN DEDUCTIONS", "LOAN BALANCE", "MONTHLY CONTRIBUTION", "PENALTIES", "DATE ADDED"]);
    
    for (var i = 0; i < memberRecords.length; i++) {
        var r = memberRecords[i];
        csvRows.push([
            monthNames[r.month - 1] + " " + r.year,
            "KES " + formatNumber(r.loan),
            "KES " + formatNumber(r.loan_deductions),
            "KES " + formatNumber(r.loan_balance),
            "KES " + formatNumber(r.monthly_contribution),
            "KES " + formatNumber(r.penalties),
            r.created_at ? new Date(r.created_at).toLocaleDateString() : ""
        ]);
    }
    
    var csv = "";
    for (var i = 0; i < csvRows.length; i++) {
        csv += csvRows[i].join(",") + "\n";
    }
    
    var blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    var link = document.createElement("a");
    var url = URL.createObjectURL(blob);
    link.href = url;
    link.setAttribute("download", "member_" + memberName + "_history.csv");
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
    showToast("History exported!");
}

// Initialize
(async function() {
    const isAuth = await protectPage();
    if (isAuth) {
        const user = await getCurrentUser();
        if (user && document.getElementById("userEmail")) {
            document.getElementById("userEmail").textContent = user.email || "Admin";
        }
        await loadMemberData();
    }
})();
</script>
</body>
</html>
