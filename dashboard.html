<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>ChamaEase | Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .welcome-card {
            background: linear-gradient(135deg, var(--primary), var(--primary-accent));
            color: white;
            margin-bottom: 1rem;
        }

        .welcome-card h1 {
            font-size: 1.3rem;
            margin-bottom: 0.3rem;
        }

        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .recent-activity {
            max-height: 300px;
            overflow-y: auto;
        }

        .activity-item {
            padding: 0.5rem;
            border-bottom: 1px solid var(--gray-border);
            font-size: 0.75rem;
        }

        .activity-item:last-child {
            border-bottom: none;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
</head>
<body>
<div class="app-wrapper">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">ChamaEase</div>
            <button class="sidebar-close" id="sidebarClose">X</button>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item active"><span class="icon">📊</span><span class="label">DASHBOARD</span></a>
            <a href="members.html" class="nav-item"><span class="icon">👥</span><span class="label">MEMBERS</span></a>
            <a href="member-history.html" class="nav-item"><span class="icon">📜</span><span class="label">MEMBER HISTORY</span></a>
            <a href="monthly-records.html" class="nav-item"><span class="icon">📅</span><span class="label">MONTHLY RECORDS</span></a>
            <a href="reports.html" class="nav-item"><span class="icon">📈</span><span class="label">REPORTS</span></a>
            <a href="settings.html" class="nav-item"><span class="icon">⚙️</span><span class="label">SETTINGS</span></a>
        </nav>
    </aside>

    <main class="main-content">
        <div class="top-bar">
            <button class="menu-toggle" id="menuToggle">☰</button>
            <div class="page-title">DASHBOARD</div>
            <div class="header-right">
                <div class="header-quicklinks">
                    <a href="members.html" class="quicklink-btn" title="Members">👥</a>
                    <a href="monthly-records.html" class="quicklink-btn" title="Monthly Records">📅</a>
                    <a href="reports.html" class="quicklink-btn" title="Reports">📈</a>
                </div>
                <div class="user-info">
                    <span class="user-email" id="userEmail"></span>
                    <button id="logoutBtn" class="logout-btn">LOGOUT</button>
                </div>
            </div>
        </div>
        <div id="app-root" class="container">
            <div style="text-align: center; padding: 1.5rem;">
                <div class="loading-spinner"></div>
                <p>Loading dashboard...</p>
            </div>
        </div>
        <footer>Smart Chama Management</footer>
    </main>
</div>

<script>
// Using supabaseClient from supabase-config.js

const menuToggle = document.getElementById("menuToggle");
const sidebar = document.getElementById("sidebar");
const sidebarClose = document.getElementById("sidebarClose");
const sidebarOverlay = document.getElementById("sidebarOverlay");

function openSidebar() { 
    sidebar.classList.add("open"); 
    sidebarOverlay.classList.add("active"); 
}

function closeSidebar() { 
    sidebar.classList.remove("open"); 
    sidebarOverlay.classList.remove("active"); 
}

if (menuToggle) menuToggle.addEventListener("click", openSidebar);
if (sidebarClose) sidebarClose.addEventListener("click", closeSidebar);
if (sidebarOverlay) sidebarOverlay.addEventListener("click", closeSidebar);

window.addEventListener("resize", function() { 
    if (window.innerWidth > 768) closeSidebar(); 
});

// Helper functions
function formatNumber(num) {
    return (num || 0).toLocaleString("en-KE");
}

function safeValue(value) {
    if (value === null || value === undefined || isNaN(value)) {
        return 0;
    }
    return parseFloat(value);
}

async function loadDashboardData() {
    const container = document.getElementById("app-root");
    try {
        // Get members
        const membersRes = await supabaseClient.from("members").select("*");
        if (membersRes.error) throw membersRes.error;
        const members = membersRes.data || [];
        const totalMembers = members.length;
        
        // Get all records
        const recordsRes = await supabaseClient.from("monthly_records").select("*");
        if (recordsRes.error) throw recordsRes.error;
        const records = recordsRes.data || [];
        
        // Calculate totals
        let totalLoan = 0;
        let totalLoanBalance = 0;
        let totalMonthlyContribution = 0;
        let totalPenalties = 0;
        let totalLoanDeductions = 0;
        
        for (var i = 0; i < records.length; i++) {
            totalLoan += safeValue(records[i].loan);
            totalLoanBalance += safeValue(records[i].loan_balance);
            totalMonthlyContribution += safeValue(records[i].monthly_contribution);
            totalPenalties += safeValue(records[i].penalties);
            totalLoanDeductions += safeValue(records[i].loan_deductions);
        }
        
        // Calculate total collected (contributions + loan repayments)
        const totalCollected = totalMonthlyContribution + (totalLoan - totalLoanBalance);
        
        // Get recent activity (last 5 records)
        const recentRecords = [...records].sort(function(a, b) {
            return new Date(b.created_at) - new Date(a.created_at);
        }).slice(0, 5);
        
        // Get member names for recent activity
        const memberMap = {};
        for (var i = 0; i < members.length; i++) {
            memberMap[members[i].id] = members[i].name;
        }
        
        // Build recent activity HTML
        let recentHtml = "";
        if (recentRecords.length === 0) {
            recentHtml = "<div class='activity-item'>No recent activity</div>";
        } else {
            for (var i = 0; i < recentRecords.length; i++) {
                var record = recentRecords[i];
                var memberName = memberMap[record.member_id] || "Unknown";
                var monthNames = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
                var monthName = monthNames[record.month - 1];
                var date = monthName + " " + record.year;
                
                recentHtml += "<div class='activity-item'>";
                recentHtml += "<strong>" + escapeHtml(memberName) + "</strong> - ";
                recentHtml += "Contribution: KES " + formatNumber(record.monthly_contribution) + " | ";
                recentHtml += "Loan: KES " + formatNumber(record.loan) + " | ";
                recentHtml += "<small>" + date + "</small>";
                recentHtml += "</div>";
            }
        }
        
        // Calculate growth metrics
        const currentYear = new Date().getFullYear();
        const currentMonth = new Date().getMonth() + 1;
        
        let thisYearContributions = 0;
        let lastYearContributions = 0;
        
        for (var i = 0; i < records.length; i++) {
            if (records[i].year === currentYear) {
                thisYearContributions += safeValue(records[i].monthly_contribution);
            } else if (records[i].year === currentYear - 1) {
                lastYearContributions += safeValue(records[i].monthly_contribution);
            }
        }
        
        const growth = lastYearContributions > 0 
            ? ((thisYearContributions - lastYearContributions) / lastYearContributions * 100).toFixed(1)
            : 0;
        
        var html = "";
        html += "<div class='welcome-card card'>";
        html += "<h1>🏦 CHAMA DASHBOARD</h1>";
        html += "<p>Overview of your chama financial records</p>";
        html += "</div>";
        
        html += "<div class='stats-grid'>";
        html += "<div class='stat-card'><div class='stat-icon'>👥</div><div class='stat-value'>" + totalMembers + "</div><div class='stat-label'>Total Members</div></div>";
        html += "<div class='stat-card'><div class='stat-icon'>💰</div><div class='stat-value'>KES " + formatNumber(totalLoan) + "</div><div class='stat-label'>Total Loans</div></div>";
        html += "<div class='stat-card'><div class='stat-icon'>📉</div><div class='stat-value'>KES " + formatNumber(totalLoanBalance) + "</div><div class='stat-label'>Loan Balance</div></div>";
        html += "<div class='stat-card'><div class='stat-icon'>💵</div><div class='stat-value'>KES " + formatNumber(totalMonthlyContribution) + "</div><div class='stat-label'>Total Contributions</div></div>";
        html += "<div class='stat-card'><div class='stat-icon'>⚠️</div><div class='stat-value'>KES " + formatNumber(totalPenalties) + "</div><div class='stat-label'>Total Penalties</div></div>";
        html += "<div class='stat-card'><div class='stat-icon'>🏦</div><div class='stat-value'>KES " + formatNumber(totalCollected) + "</div><div class='stat-label'>Total Collected</div></div>";
        html += "<div class='stat-card'><div class='stat-icon'>📈</div><div class='stat-value'>" + (growth >= 0 ? "+" : "") + growth + "%</div><div class='stat-label'>Yearly Growth</div><div class='stat-small'>vs last year</div></div>";
        html += "<div class='stat-card'><div class='stat-icon'>🗂️</div><div class='stat-value'>" + records.length + "</div><div class='stat-label'>Active Records</div><div class='stat-small'>total entries</div></div>";
        html += "</div>";
        
        html += "<div class='flex-between'>";
        html += "<a href='members.html' class='btn'>👥 MANAGE MEMBERS</a>";
        html += "<a href='monthly-records.html' class='btn-outline btn'>📅 VIEW RECORDS</a>";
        html += "<a href='reports.html' class='btn-outline btn'>📊 EXPORT REPORTS</a>";
        html += "</div>";
        
        html += "<div class='card'>";
        html += "<h3>📋 Recent Activity</h3>";
        html += "<div class='recent-activity'>";
        html += recentHtml;
        html += "</div>";
        html += "</div>";
        
        container.innerHTML = html;
        
    } catch (error) {
        console.error("Dashboard error:", error);
        container.innerHTML = "<div class='card'><h3>⚠️ ERROR</h3><p>" + error.message + "</p><button class='btn' onclick='location.reload()'>RETRY</button></div>";
    }
}

function escapeHtml(str) {
    if (!str) return "";
    return String(str).replace(/[&<>"']/g, function(m) {
        if (m === "&") return "&amp;";
        if (m === "<") return "&lt;";
        if (m === ">") return "&gt;";
        if (m === '"') return "&quot;";
        if (m === "'") return "&#39;";
        return m;
    });
}

// Initialize page
(async function() {
    const isAuth = await protectPage();
    if (!isAuth) return;
    const user = await getCurrentUser();
    if (user && document.getElementById("userEmail")) {
        document.getElementById("userEmail").textContent = user.email || "Admin";
    }
    await loadDashboardData();
})();

document.getElementById("logoutBtn").addEventListener("click", async function() {
    await logoutUser();
    window.location.href = "index.html";
});
</script>
</body>
</html>
