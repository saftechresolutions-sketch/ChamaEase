<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>ChamaEase | Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #1e2a3e;
        }

        :root {
            --primary: #2c7a4d;
            --primary-light: #eaf5ef;
            --primary-dark: #1f5a3a;
            --danger: #dc4c4c;
            --gray-border: #e2e8f0;
            --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.04);
            --radius-card: 16px;
            --radius-btn: 32px;
            --sidebar-width: 280px;
        }

        .app-wrapper {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: white;
            border-right: 1px solid var(--gray-border);
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            overflow-y: auto;
            transition: transform 0.3s ease;
            z-index: 1000;
            box-shadow: var(--shadow-sm);
            transform: translateX(0);
        }

        .sidebar-header {
            padding: 1rem;
            border-bottom: 1px solid var(--gray-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-logo {
            font-weight: 800;
            font-size: 1.2rem;
            background: linear-gradient(135deg, var(--primary), #3b9b62);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .sidebar-close {
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            color: #94a3b8;
            display: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            align-items: center;
            justify-content: center;
        }

        .sidebar-close:hover {
            background: #fee2e2;
            color: var(--danger);
        }

        .sidebar-nav {
            padding: 0.8rem 0;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0.7rem 1rem;
            margin: 0.2rem 0.8rem;
            border-radius: 12px;
            text-decoration: none;
            color: #4a5568;
            transition: all 0.2s;
            cursor: pointer;
        }

        .nav-item:hover {
            background: var(--primary-light);
            color: var(--primary);
        }

        .nav-item.active {
            background: var(--primary);
            color: white;
        }

        .nav-item .icon {
            font-size: 1.1rem;
            width: 26px;
            text-align: center;
        }

        .nav-item .label {
            font-weight: 500;
            font-size: 0.85rem;
        }

        .nav-submenu {
            padding-left: 2.8rem;
        }

        .nav-submenu .nav-item {
            padding: 0.5rem 1rem;
            font-size: 0.8rem;
        }

        .nav-divider {
            height: 1px;
            background: var(--gray-border);
            margin: 0.6rem 1rem;
        }

        .main-content {
            flex: 1;
            margin-left: var(--sidebar-width);
            transition: margin-left 0.3s ease;
            width: calc(100% - var(--sidebar-width));
        }

        .top-bar {
            background: white;
            padding: 0.7rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--gray-border);
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 0;
            z-index: 99;
        }

        .menu-toggle {
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            color: var(--primary);
            padding: 6px;
            border-radius: 50%;
        }

        .page-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1e2a3e;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .user-email {
            font-size: 0.7rem;
            color: #5b6e8c;
            display: none;
        }

        @media (min-width: 480px) {
            .user-email {
                display: inline;
            }
        }

        .logout-btn {
            background: transparent;
            border: 1px solid #dc2626;
            color: #dc2626;
            padding: 0.35rem 0.7rem;
            border-radius: 2rem;
            cursor: pointer;
            font-size: 0.7rem;
        }

        .logout-btn:hover {
            background: #dc2626;
            color: white;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem;
            width: 100%;
            min-height: 70vh;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.8rem;
            margin-bottom: 1.5rem;
        }

        @media (min-width: 640px) {
            .stats-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .stat-card {
            background: white;
            border-radius: 1rem;
            padding: 0.8rem;
            text-align: center;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--gray-border);
        }

        .stat-card h4 {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #5b6e8c;
            margin-bottom: 0.3rem;
        }

        .stat-number {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--primary);
        }

        .stat-full {
            font-size: 0.7rem;
            color: #6c757d;
            margin-top: 0.2rem;
        }

        .card {
            background: white;
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-sm);
            padding: 1rem;
            margin-bottom: 1rem;
            border: 1px solid var(--gray-border);
        }

        .btn {
            border: none;
            background: var(--primary);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: var(--radius-btn);
            font-weight: 600;
            cursor: pointer;
            font-size: 0.8rem;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
        }

        .btn-sm {
            padding: 0.25rem 0.6rem;
            font-size: 0.7rem;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.75rem;
            min-width: 400px;
        }

        th, td {
            text-align: left;
            padding: 0.6rem 0.4rem;
            border-bottom: 1px solid var(--gray-border);
        }

        th {
            background: #f8fafc;
            font-weight: 600;
        }

        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        footer {
            text-align: center;
            padding: 0.8rem;
            font-size: 0.7rem;
            color: #6c757d;
            border-top: 1px solid var(--gray-border);
            margin-top: 1rem;
        }

        .welcome-card {
            background: linear-gradient(135deg, var(--primary), #3b9b62);
            color: white;
            margin-bottom: 1rem;
        }
        
        .welcome-card h1 {
            font-size: 1.3rem;
            margin-bottom: 0.3rem;
        }

        .loading-spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid #e2e8f0;
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
        }

        .sidebar-overlay.active {
            display: block;
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .main-content {
                margin-left: 0;
                width: 100%;
            }
            .sidebar-close {
                display: flex;
            }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="app-wrapper">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">🌿 ChamaEase</div>
            <button class="sidebar-close" id="sidebarClose">✕</button>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item active"><span class="icon">📊</span><span class="label">DASHBOARD</span></a>
            <a href="members.html" class="nav-item"><span class="icon">👥</span><span class="label">MEMBERS</span></a>
            <a href="contributions.html" class="nav-item"><span class="icon">💰</span><span class="label">CONTRIBUTIONS</span></a>
            <div class="nav-divider"></div>
            <a href="reports.html" class="nav-item"><span class="icon">📋</span><span class="label">REPORTS</span></a>
            <a href="settings.html" class="nav-item"><span class="icon">⚙️</span><span class="label">SETTINGS</span></a>
        </nav>
    </aside>

    <main class="main-content">
        <div class="top-bar">
            <button class="menu-toggle" id="menuToggle">☰</button>
            <div class="page-title">DASHBOARD</div>
            <div class="user-info">
                <span class="user-email" id="userEmail"></span>
                <button id="logoutBtn" class="logout-btn">LOGOUT</button>
            </div>
        </div>
        <div id="app-root" class="container">
            <div style="text-align: center; padding: 1.5rem;">
                <div class="loading-spinner"></div>
                <p>Loading dashboard...</p>
            </div>
        </div>
        <footer>✨ Smart Chama Management</footer>
    </main>
</div>

<script src="supabase-config.js"></script>
<script>
    const menuToggle = document.getElementById('menuToggle');
    const sidebar = document.getElementById('sidebar');
    const sidebarClose = document.getElementById('sidebarClose');
    const sidebarOverlay = document.getElementById('sidebarOverlay');
    
    function openSidebar() { sidebar.classList.add('open'); sidebarOverlay.classList.add('active'); }
    function closeSidebar() { sidebar.classList.remove('open'); sidebarOverlay.classList.remove('active'); }
    
    if (menuToggle) menuToggle.addEventListener('click', openSidebar);
    if (sidebarClose) sidebarClose.addEventListener('click', closeSidebar);
    if (sidebarOverlay) sidebarOverlay.addEventListener('click', closeSidebar);
    window.addEventListener('resize', () => { if (window.innerWidth > 768) closeSidebar(); });

    (async function() {
        const isAuth = await protectPage();
        if (!isAuth) return;
        const user = await getCurrentUser();
        if (user) document.getElementById('userEmail').textContent = user.email || 'Admin';
        await loadDashboardData();
    })();

    document.getElementById('logoutBtn').addEventListener('click', async () => {
        await logoutUser();
        window.location.href = 'index.html';
    });

    function formatNumber(num) { return (num || 0).toLocaleString('en-KE'); }

    async function loadDashboardData() {
        const container = document.getElementById('app-root');
        try {
            const { data: members } = await supabaseClient.from('members').select('*').order('name');
            const { data: contributions } = await supabaseClient.from('contributions').select('*, members:member_id (name)').order('date', { ascending: false }).limit(10);
            
            const totalMembers = members?.length || 0;
            const totalCollected = members?.reduce((sum, m) => sum + (m.total_contributed || 0), 0) || 0;
            const paidMembers = members?.filter(m => (m.balance || 0) === 0).length || 0;
            const totalBalance = members?.reduce((sum, m) => sum + (m.balance || 0), 0) || 0;
            const totalLoan = members?.reduce((sum, m) => sum + (m.loan_balance || 0), 0) || 0;
            
            const html = `
                <div class="welcome-card card"><h1>📊 CHAMAEASE DASHBOARD</h1><p>Your digital Chama management system</p></div>
                <div class="stats-grid">
                    <div class="stat-card"><h4>👥 TOTAL MEMBERS</h4><div class="stat-number">${totalMembers}</div></div>
                    <div class="stat-card"><h4>💰 TOTAL COLLECTED</h4><div class="stat-number">KES ${(totalCollected/1000).toFixed(0)}k</div><div class="stat-full">${formatNumber(totalCollected)}</div></div>
                    <div class="stat-card"><h4>✅ PAID MEMBERS</h4><div class="stat-number">${paidMembers}</div><div class="stat-full">OF ${totalMembers}</div></div>
                    <div class="stat-card"><h4>⏳ OUTSTANDING BALANCE</h4><div class="stat-number">KES ${(totalBalance/1000).toFixed(0)}k</div><div class="stat-full">${formatNumber(totalBalance)}</div></div>
                    <div class="stat-card"><h4>🏦 TOTAL LOAN BALANCE</h4><div class="stat-number">KES ${(totalLoan/1000).toFixed(0)}k</div><div class="stat-full">${formatNumber(totalLoan)}</div></div>
                    <div class="stat-card"><h4>📊 COLLECTION RATE</h4><div class="stat-number">${(totalCollected/(totalCollected+totalBalance)*100 || 0).toFixed(0)}%</div></div>
                </div>
                <div class="card">
                    <div class="flex-between"><h3>📋 RECENT CONTRIBUTIONS</h3><a href="contributions.html" class="btn-sm btn-outline">+ RECORD</a></div>
                    <div class="table-wrapper"><table><thead><tr><th>MEMBER</th><th>AMOUNT</th><th>DATE</th><th>METHOD</th></tr></thead><tbody>${contributions?.map(c => `<td><td>${c.members?.name || 'Unknown'}</td><td>KES ${formatNumber(c.amount)}</td><td>${c.date || '-'}</td><td>${c.method || '-'}</td></tr>`).join('') || '<tr><td colspan="4">No contributions yet</td></tr>'}</tbody></table></div>
                </div>
                <div class="flex-between"><a href="members.html" class="btn">📇 MANAGE MEMBERS</a><a href="contributions.html" class="btn-outline btn">💰 ADD CONTRIBUTION</a><a href="reports.html" class="btn-outline btn">📊 REPORTS</a></div>
            `;
            container.innerHTML = html;
        } catch (error) {
            container.innerHTML = `<div class="card"><h3>⚠️ ERROR</h3><p>${error.message}</p><button class="btn" onclick="location.reload()">RETRY</button></div>`;
        }
    }
</script>
</body>
</html>
