<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>ChamaEase | Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #eaf5ef 0%, #d4e8dc 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        .card {
            background: white;
            border-radius: 2rem;
            padding: 3rem 2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            border: 1px solid #e2e8f0;
        }

        .logo {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, #2c7a4d, #3b9b62);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 1rem;
        }

        .construction-icon {
            font-size: 5rem;
            margin: 1.5rem 0;
        }

        p {
            color: #5b6e8c;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }

        .small-text {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 1.5rem;
        }

        .btn {
            display: inline-block;
            background: #2c7a4d;
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 2rem;
            text-decoration: none;
            font-weight: 600;
            margin-top: 1.5rem;
            transition: 0.2s;
        }

        .btn:hover {
            background: #1f5a3a;
        }

        @media (max-width: 640px) {
            .card {
                padding: 2rem 1.5rem;
            }
            h1 {
                font-size: 1.5rem;
            }
            .construction-icon {
                font-size: 3.5rem;
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="logo">🌿</div>
            <h1>ChamaEase</h1>
            <div class="construction-icon">🚧👷‍♀️🔧</div>
            <p><strong>System Under Development</strong></p>
            <p>Working hard to bring you the complete Chama management experience.</p>
            <p>Please check back soon!</p>
            <div class="small-text">
                ⏳ Estimated completion: Coming Soon
            </div>
            
        </div>
    </div>

    <script src="supabase-config.js"></script>
    <script>
        // Check authentication and protect page
        (async function() {
            const isAuth = await protectPage();
            if (!isAuth) return;
            
            const user = await getCurrentUser();
            if (user) {
                // User is logged in, show the under development page
                console.log("Logged in as:", user.email);
            }
        })();

        // Logout functionality (optional - add if needed)
        // You can add a logout button if needed
    </script>
</body>
</html>
