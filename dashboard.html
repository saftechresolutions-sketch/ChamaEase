<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>ChamaEase | Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #1e2a3e;
        }

        :root {
            --primary: #2c7a4d;
            --primary-light: #eaf5ef;
            --primary-dark: #1f5a3a;
            --danger: #dc4c4c;
            --gray-border: #e2e8f0;
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.04);
            --radius-card: 16px;
            --radius-btn: 32px;
            --sidebar-width: 280px;
        }

        .app-wrapper {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: white;
            border-right: 1px solid var(--gray-border);
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            overflow-y: auto;
            transition: transform 0.3s ease;
            z-index: 1000;
            box-shadow: var(--shadow-sm);
            transform: translateX(0);
        }

        .sidebar-header {
            padding: 1rem;
            border-bottom: 1px solid var(--gray-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-logo {
            font-weight: 800;
            font-size: 1.2rem;
            background: linear-gradient(135deg, var(--primary), #3b9b62);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .sidebar-close {
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            color: #94a3b8;
            display: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            align-items: center;
            justify-content: center;
        }

        .sidebar-close:hover {
            background: #fee2e2;
            color: var(--danger);
        }

        .sidebar-nav {
            padding: 0.8rem 0;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0.7rem 1rem;
            margin: 0.2rem 0.8rem;
            border-radius: 12px;
            text-decoration: none;
            color: #4a5568;
            transition: all 0.2s;
            cursor: pointer;
        }

        .nav-item:hover {
            background: var(--primary-light);
            color: var(--primary);
        }

        .nav-item.active {
            background: var(--primary);
            color: white;
        }

        .nav-item .icon {
            font-size: 1.1rem;
            width: 26px;
            text-align: center;
        }

        .nav-item .label {
            font-weight: 500;
            font-size: 0.85rem;
        }

        .main-content {
            flex: 1;
            margin-left: var(--sidebar-width);
            transition: margin-left 0.3s ease;
            width: calc(100% - var(--sidebar-width));
        }

        .top-bar {
            background: white;
            padding: 0.7rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--gray-border);
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 0;
            z-index: 99;
        }

        .menu-toggle {
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            color: var(--primary);
            padding: 6px;
            border-radius: 50%;
        }

        .page-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1e2a3e;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .user-email {
            font-size: 0.7rem;
            color: #5b6e8c;
            display: none;
        }

        @media (min-width: 480px) {
            .user-email {
                display: inline;
            }
        }

        .logout-btn {
            background: transparent;
            border: 1px solid #dc2626;
            color: #dc2626;
            padding: 0.35rem 0.7rem;
            border-radius: 2rem;
            cursor: pointer;
            font-size: 0.7rem;
        }

        .logout-btn:hover {
            background: #dc2626;
            color: white;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem;
            width: 100%;
            min-height: 70vh;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.8rem;
            margin-bottom: 1.5rem;
        }

        @media (min-width: 640px) {
            .stats-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .stat-card {
            background: white;
            border-radius: 1rem;
            padding: 0.8rem;
            text-align: center;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--gray-border);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.1);
        }

        .stat-card h4 {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #5b6e8c;
            margin-bottom: 0.3rem;
        }

        .stat-number {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--primary);
        }

        .stat-full {
            font-size: 0.7rem;
            color: #6c757d;
            margin-top: 4px;
        }

        .card {
            background: white;
            border-radius: var(--radius-card);
            box-shadow: var(--shadow-sm);
            padding: 1rem;
            margin-bottom: 1rem;
            border: 1px solid var(--gray-border);
        }

        .btn {
            border: none;
            background: var(--primary);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: var(--radius-btn);
            font-weight: 600;
            cursor: pointer;
            font-size: 0.75rem;
            text-decoration: none;
            display: inline-block;
            transition: background 0.2s;
        }

        .btn:hover {
            background: var(--primary-dark);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
        }

        .btn-outline:hover {
            background: var(--primary-light);
        }

        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        footer {
            text-align: center;
            padding: 0.8rem;
            font-size: 0.7rem;
            color: #6c757d;
            border-top: 1px solid var(--gray-border);
            margin-top: 1rem;
        }

        .welcome-card {
            background: linear-gradient(135deg, var(--primary), #3b9b62);
            color: white;
            margin-bottom: 1rem;
        }
        
        .welcome-card h1 {
            font-size: 1.3rem;
            margin-bottom: 0.3rem;
        }

        .loading-spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid #e2e8f0;
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
        }

        .sidebar-overlay.active {
            display: block;
        }

        .recent-activity {
            max-height: 300px;
            overflow-y: auto;
        }

        .activity-item {
            padding: 0.5rem;
            border-bottom: 1px solid var(--gray-border);
            font-size: 0.75rem;
        }

        .activity-item:last-child {
            border-bottom: none;
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .main-content {
                margin-left: 0;
                width: 100%;
            }
            .sidebar-close {
                display: flex;
            }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
</head>
<body>
<div class="app-wrapper">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">ChamaEase</div>
            <button class="sidebar-close" id="sidebarClose">X</button>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item active"><span class="icon">📊</span><span class="label">DASHBOARD</span></a>
            <a href="members.html" class="nav-item"><span class="icon">👥</span><span class="label">MEMBERS</span></a>
           
            <a href="monthly-records.html" class="nav-item"><span class="icon">📅</span><span class="label">MONTHLY RECORDS</span></a>
            <a href="reports.html" class="nav-item"><span class="icon">📈</span><span class="label">REPORTS</span></a>
            <a href="settings.html" class="nav-item"><span class="icon">⚙️</span><span class="label">SETTINGS</span></a>
        </nav>
    </aside>

    <main class="main-content">
        <div class="top-bar">
            <button class="menu-toggle" id="menuToggle">☰</button>
            <div class="page-title">DASHBOARD</div>
            <div class="user-info">
                <span class="user-email" id="userEmail"></span>
                <button id="logoutBtn" class="logout-btn">LOGOUT</button>
            </div>
        </div>
        <div id="app-root" class="container">
            <div style="text-align: center; padding: 1.5rem;">
                <div class="loading-spinner"></div>
                <p>Loading dashboard...</p>
            </div>
        </div>
        <footer>Smart Chama Management</footer>
    </main>
</div>

<script>
// Using supabaseClient from supabase-config.js

const menuToggle = document.getElementById("menuToggle");
const sidebar = document.getElementById("sidebar");
const sidebarClose = document.getElementById("sidebarClose");
const sidebarOverlay = document.getElementById("sidebarOverlay");

function openSidebar() { 
    sidebar.classList.add("open"); 
    sidebarOverlay.classList.add("active"); 
}

function closeSidebar() { 
    sidebar.classList.remove("open"); 
    sidebarOverlay.classList.remove("active"); 
}

if (menuToggle) menuToggle.addEventListener("click", openSidebar);
if (sidebarClose) sidebarClose.addEventListener("click", closeSidebar);
if (sidebarOverlay) sidebarOverlay.addEventListener("click", closeSidebar);

window.addEventListener("resize", function() { 
    if (window.innerWidth > 768) closeSidebar(); 
});

// Helper functions
function formatNumber(num) {
    return (num || 0).toLocaleString("en-KE");
}

function safeValue(value) {
    if (value === null || value === undefined || isNaN(value)) {
        return 0;
    }
    return parseFloat(value);
}

async function loadDashboardData() {
    const container = document.getElementById("app-root");
    try {
        // Get members
        const membersRes = await supabaseClient.from("members").select("*");
        if (membersRes.error) throw membersRes.error;
        const members = membersRes.data || [];
        const totalMembers = members.length;
        
        // Get all records
        const recordsRes = await supabaseClient.from("monthly_records").select("*");
        if (recordsRes.error) throw recordsRes.error;
        const records = recordsRes.data || [];
        
        // Calculate totals
        let totalLoan = 0;
        let totalLoanBalance = 0;
        let totalMonthlyContribution = 0;
        let totalPenalties = 0;
        let totalLoanDeductions = 0;
        
        for (var i = 0; i < records.length; i++) {
            totalLoan += safeValue(records[i].loan);
            totalLoanBalance += safeValue(records[i].loan_balance);
            totalMonthlyContribution += safeValue(records[i].monthly_contribution);
            totalPenalties += safeValue(records[i].penalties);
            totalLoanDeductions += safeValue(records[i].loan_deductions);
        }
        
        // Calculate total collected (contributions + loan repayments)
        const totalCollected = totalMonthlyContribution + (totalLoan - totalLoanBalance);
        
        // Get recent activity (last 5 records)
        const recentRecords = [...records].sort(function(a, b) {
            return new Date(b.created_at) - new Date(a.created_at);
        }).slice(0, 5);
        
        // Get member names for recent activity
        const memberMap = {};
        for (var i = 0; i < members.length; i++) {
            memberMap[members[i].id] = members[i].name;
        }
        
        // Build recent activity HTML
        let recentHtml = "";
        if (recentRecords.length === 0) {
            recentHtml = "<div class='activity-item'>No recent activity</div>";
        } else {
            for (var i = 0; i < recentRecords.length; i++) {
                var record = recentRecords[i];
                var memberName = memberMap[record.member_id] || "Unknown";
                var monthNames = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
                var monthName = monthNames[record.month - 1];
                var date = monthName + " " + record.year;
                
                recentHtml += "<div class='activity-item'>";
                recentHtml += "<strong>" + escapeHtml(memberName) + "</strong> - ";
                recentHtml += "Contribution: KES " + formatNumber(record.monthly_contribution) + " | ";
                recentHtml += "Loan: KES " + formatNumber(record.loan) + " | ";
                recentHtml += "<small>" + date + "</small>";
                recentHtml += "</div>";
            }
        }
        
        // Calculate growth metrics
        const currentYear = new Date().getFullYear();
        const currentMonth = new Date().getMonth() + 1;
        
        let thisYearContributions = 0;
        let lastYearContributions = 0;
        
        for (var i = 0; i < records.length; i++) {
            if (records[i].year === currentYear) {
                thisYearContributions += safeValue(records[i].monthly_contribution);
            } else if (records[i].year === currentYear - 1) {
                lastYearContributions += safeValue(records[i].monthly_contribution);
            }
        }
        
        const growth = lastYearContributions > 0 
            ? ((thisYearContributions - lastYearContributions) / lastYearContributions * 100).toFixed(1)
            : 0;
        
        var html = "";
        html += "<div class='welcome-card card'>";
        html += "<h1>🏦 CHAMA DASHBOARD</h1>";
        html += "<p>Overview of your chama financial records</p>";
        html += "</div>";
        
        html += "<div class='stats-grid'>";
        html += "<div class='stat-card'><h4>TOTAL MEMBERS</h4><div class='stat-number'>" + totalMembers + "</div></div>";
        html += "<div class='stat-card'><h4>TOTAL LOANS</h4><div class='stat-number'>KES " + (totalLoan/1000).toFixed(0) + "k</div><div class='stat-full'>KES " + formatNumber(totalLoan) + "</div></div>";
        html += "<div class='stat-card'><h4>LOAN BALANCE</h4><div class='stat-number'>KES " + (totalLoanBalance/1000).toFixed(0) + "k</div><div class='stat-full'>KES " + formatNumber(totalLoanBalance) + "</div></div>";
        html += "<div class='stat-card'><h4>TOTAL CONTRIBUTIONS</h4><div class='stat-number'>KES " + (totalMonthlyContribution/1000).toFixed(0) + "k</div><div class='stat-full'>KES " + formatNumber(totalMonthlyContribution) + "</div></div>";
        html += "<div class='stat-card'><h4>TOTAL PENALTIES</h4><div class='stat-number'>KES " + (totalPenalties/1000).toFixed(0) + "k</div><div class='stat-full'>KES " + formatNumber(totalPenalties) + "</div></div>";
        html += "<div class='stat-card'><h4>TOTAL COLLECTED</h4><div class='stat-number'>KES " + (totalCollected/1000).toFixed(0) + "k</div><div class='stat-full'>KES " + formatNumber(totalCollected) + "</div></div>";
        html += "<div class='stat-card'><h4>YEARLY GROWTH</h4><div class='stat-number'>" + (growth >= 0 ? "+" : "") + growth + "%</div><div class='stat-full'>vs last year</div></div>";
        html += "<div class='stat-card'><h4>ACTIVE RECORDS</h4><div class='stat-number'>" + records.length + "</div><div class='stat-full'>total entries</div></div>";
        html += "</div>";
        
        html += "<div class='flex-between'>";
        html += "<a href='members.html' class='btn'>👥 MANAGE MEMBERS</a>";
        html += "<a href='monthly-records.html' class='btn-outline btn'>📅 VIEW RECORDS</a>";
        html += "<a href='reports.html' class='btn-outline btn'>📊 EXPORT REPORTS</a>";
        html += "</div>";
        
        html += "<div class='card'>";
        html += "<h3>📋 Recent Activity</h3>";
        html += "<div class='recent-activity'>";
        html += recentHtml;
        html += "</div>";
        html += "</div>";
        
        container.innerHTML = html;
        
    } catch (error) {
        console.error("Dashboard error:", error);
        container.innerHTML = "<div class='card'><h3>⚠️ ERROR</h3><p>" + error.message + "</p><button class='btn' onclick='location.reload()'>RETRY</button></div>";
    }
}

function escapeHtml(str) {
    if (!str) return "";
    return String(str).replace(/[&<>]/g, function(m) {
        if (m === "&") return "&amp;";
        if (m === "<") return "&lt;";
        if (m === ">") return "&gt;";
        return m;
    });
}

// Initialize page
(async function() {
    const isAuth = await protectPage();
    if (!isAuth) return;
    const user = await getCurrentUser();
    if (user && document.getElementById("userEmail")) {
        document.getElementById("userEmail").textContent = user.email || "Admin";
    }
    await loadDashboardData();
})();

document.getElementById("logoutBtn").addEventListener("click", async function() {
    await logoutUser();
    window.location.href = "index.html";
});
</script>
</body>
</html>
