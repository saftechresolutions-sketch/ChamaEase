<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>ChamaEase | Reports</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .container {
            max-width: 1400px;
        }

        /* Reports Page Styles */
        .report-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border-radius: 20px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            color: white;
            text-align: center;
        }
        
        .report-header h1 {
            font-size: 1.5rem;
            margin-bottom: 0.25rem;
        }
        
        .report-header p {
            font-size: 0.75rem;
            opacity: 0.9;
        }
        
        /* Filter Section - Auto Filter (no apply button) */
        .filter-section {
            background: white;
            border-radius: 20px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--gray-border);
        }
        
        .filter-title {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--primary);
            display: inline-block;
        }
        
        .filter-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: flex-end;
        }
        
        .filter-group {
            flex: 1;
            min-width: 150px;
        }
        
        .filter-label {
            font-size: 0.7rem;
            font-weight: 600;
            margin-bottom: 0.3rem;
            color: #1e2a3e;
            display: block;
        }
        
        .filter-select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--gray-border);
            border-radius: 12px;
            font-size: 0.8rem;
            background: white;
            cursor: pointer;
        }
        
        .filter-select:focus {
            outline: none;
            border-color: var(--primary);
        }
        
        .btn-reset {
            background: #f1f5f9;
            color: #64748b;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.75rem;
        }
        
        .active-filter-badge {
            display: inline-block;
            background: var(--primary-light);
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            margin-top: 0.8rem;
        }
        
        /* Stats Grid */
        .stats-container {
            background: white;
            border-radius: 20px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--gray-border);
        }
        
        .stats-title {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--primary);
            display: inline-block;
        }
        
        .stats-grid-clean {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }
        
        @media (min-width: 640px) {
            .stats-grid-clean {
                grid-template-columns: repeat(4, 1fr);
            }
        }
        
        .stat-item {
            text-align: center;
            padding: 0.8rem;
            background: #f8fafc;
            border-radius: 16px;
        }
        
        .stat-value-large {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--primary);
        }
        
        .stat-label-clean {
            font-size: 0.7rem;
            color: #6c757d;
            margin-top: 0.25rem;
        }
        
        .stat-sub {
            font-size: 0.6rem;
            color: #94a3b8;
            margin-top: 0.2rem;
        }
        
        /* Action Buttons */
        .action-buttons-container {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        
        .action-btn-clean {
            padding: 10px 20px;
            border-radius: 40px;
            border: none;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        
        .btn-whatsapp { background: #25D366; color: white; }
        .btn-whatsapp:hover { background: #128C7E; transform: translateY(-1px); }
        .btn-excel { background: #10b981; color: white; }
        .btn-excel:hover { background: #059669; transform: translateY(-1px); }
        .btn-print { background: #3b82f6; color: white; }
        .btn-print:hover { background: #2563eb; transform: translateY(-1px); }
        
        /* Member Rankings Table */
        .rankings-container {
            background: white;
            border-radius: 20px;
            border: 1px solid var(--gray-border);
            margin-bottom: 1.5rem;
            overflow: hidden;
        }
        
        .rankings-header {
            background: #f8fafc;
            padding: 1rem;
            border-bottom: 1px solid var(--gray-border);
        }
        
        .rankings-header h3 {
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .rankings-table-wrapper {
            overflow-x: auto;
        }
        
        .rankings-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .rankings-table th,
        .rankings-table td {
            padding: 12px 10px;
            text-align: left;
            border-bottom: 1px solid var(--gray-border);
        }
        
        .rankings-table th {
            background: #fafbfc;
            font-weight: 600;
            font-size: 0.75rem;
            color: #1e2a3e;
        }
        
        .rankings-table tr:hover {
            background: var(--primary-light);
        }
        
        .rank-number {
            display: inline-block;
            width: 28px;
            height: 28px;
            background: #e2e8f0;
            border-radius: 50%;
            text-align: center;
            line-height: 28px;
            font-size: 0.75rem;
            font-weight: 700;
            color: #475569;
        }
        
        .rank-1 { background: #fbbf24; color: #92400e; }
        .rank-2 { background: #e5e7eb; color: #374151; }
        .rank-3 { background: #fdba74; color: #9a3412; }
        
        .member-name {
            font-weight: 600;
            color: #1e2a3e;
        }
        
        .amount {
            font-weight: 500;
            color: var(--primary);
        }
        
        /* Charts Section */
        .charts-section {
            background: white;
            border-radius: 20px;
            border: 1px solid var(--gray-border);
            margin-bottom: 1.5rem;
            overflow: hidden;
        }
        
        .charts-header {
            background: #f8fafc;
            padding: 1rem;
            border-bottom: 1px solid var(--gray-border);
        }
        
        .charts-header h3 {
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .charts-grid-bottom {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
            padding: 1.5rem;
        }
        
        @media (min-width: 768px) {
            .charts-grid-bottom {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        .chart-box {
            background: white;
            border-radius: 16px;
            padding: 1rem;
            border: 1px solid var(--gray-border);
        }
        
        .chart-title {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1rem;
            text-align: center;
            color: #1e2a3e;
        }
        
        .chart-canvas {
            position: relative;
            height: 250px;
        }
        
        .report-footer {
            text-align: center;
            padding: 1rem;
            font-size: 0.65rem;
            color: #94a3b8;
            border-top: 1px solid var(--gray-border);
            margin-top: 1rem;
        }
        
        @media (max-width: 768px) {
            .filter-controls {
                flex-direction: column;
            }
            .action-buttons-container {
                flex-direction: column;
            }
            .action-btn-clean {
                justify-content: center;
            }
        }
        
        @media print {
            .filter-section,
            .action-buttons-container,
            .sidebar,
            .top-bar,
            footer {
                display: none;
            }
        }
    </style>
</head>

<script src="supabase-config.js"></script>
<script>
// ============================================
// REPORTS PAGE - AUTO FILTER (No Apply Button)
// Filters update immediately when selection changes
// ============================================

let allMembers = [];
let allRecords = [];
let filteredRecords = [];
let trendsChart = null;
let topMembersChart = null;

// Filter state - saved to localStorage for persistence
let currentFilter = {
    year: 'all',
    month: 'all'
};

let availableYears = [];
let monthNames = ["JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE", "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"];

// Sidebar functions
function openSidebar() {
    document.getElementById("sidebar").classList.add("open");
    document.getElementById("sidebarOverlay").classList.add("active");
}

function closeSidebar() {
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("sidebarOverlay").classList.remove("active");
}

document.getElementById("menuToggle").addEventListener("click", openSidebar);
document.getElementById("sidebarClose").addEventListener("click", closeSidebar);
document.getElementById("sidebarOverlay").addEventListener("click", closeSidebar);
document.getElementById("logoutBtn").addEventListener("click", async function() {
    await logoutUser();
    window.location.href = "index.html";
});

function showToast(message) {
    const toast = document.createElement('div');
    toast.className = 'toast-notification';
    toast.textContent = '✓ ' + message;
    document.body.appendChild(toast);
    setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}

function escapeHtml(str) {
    if (!str) return "";
    return String(str).replace(/[&<>"']/g, function(m) {
        if (m === "&") return "&amp;";
        if (m === "<") return "&lt;";
        if (m === ">") return "&gt;";
        if (m === '"') return "&quot;";
        if (m === "'") return "&#39;";
        return m;
    });
}

function safeValue(value) {
    if (value === null || value === undefined || value === '' || isNaN(value)) {
        return 0;
    }
    return parseFloat(value);
}

function formatNumber(num) {
    if (num === null || num === undefined) return "0";
    return num.toLocaleString('en-KE');
}

// Save filter selection to localStorage
function saveFilterSelection() {
    localStorage.setItem("chama_report_year", currentFilter.year);
    localStorage.setItem("chama_report_month", currentFilter.month);
}

// Load saved filter selection
function loadSavedFilter() {
    const savedYear = localStorage.getItem("chama_report_year");
    const savedMonth = localStorage.getItem("chama_report_month");
    if (savedYear && savedYear !== 'null') {
        currentFilter.year = savedYear;
    }
    if (savedMonth && savedMonth !== 'null') {
        currentFilter.month = savedMonth;
    }
}

async function loadData() {
    try {
        const membersResult = await supabaseClient.from("members").select("*").order("name");
        if (membersResult.error) throw membersResult.error;
        allMembers = membersResult.data || [];
        
        const recordsResult = await supabaseClient.from("monthly_records").select("*");
        if (recordsResult.error) throw recordsResult.error;
        allRecords = recordsResult.data || [];
        
        // Extract available years from records
        var yearsSet = new Set();
        for (var i = 0; i < allRecords.length; i++) {
            yearsSet.add(allRecords[i].year);
        }
        // Add current year and surrounding years
        var currentYearNum = new Date().getFullYear();
        yearsSet.add(currentYearNum - 1);
        yearsSet.add(currentYearNum);
        yearsSet.add(currentYearNum + 1);
        
        availableYears = Array.from(yearsSet).sort((a, b) => b - a);
        
        // Apply filter and render
        applyFilterAndRender();
    } catch (error) {
        document.getElementById("app-root").innerHTML = '<div style="padding:2rem;text-align:center"><h3>⚠️ Error</h3><p>' + error.message + '</p><button class="btn" onclick="location.reload()">Retry</button></div>';
    }
}

// Apply filter and render - called on page load and when filter changes
function applyFilterAndRender() {
    if (currentFilter.year === 'all' && currentFilter.month === 'all') {
        filteredRecords = [...allRecords];
    } else {
        filteredRecords = allRecords.filter(function(record) {
            if (currentFilter.year !== 'all' && record.year != currentFilter.year) return false;
            if (currentFilter.month !== 'all' && record.month != currentFilter.month) return false;
            return true;
        });
    }
    renderReports();
}

// Called when filter selection changes - auto updates
function onFilterChange() {
    saveFilterSelection();
    applyFilterAndRender();
}

function getSummaryStats() {
    var totalMembers = allMembers.length;
    var totalLoan = 0;
    var totalLoanBalance = 0;
    var totalContributions = 0;
    var totalPenalties = 0;
    var membersInFilter = new Set();
    
    for (var i = 0; i < filteredRecords.length; i++) {
        var record = filteredRecords[i];
        totalLoan += safeValue(record.loan);
        totalLoanBalance += safeValue(record.loan_balance);
        totalContributions += safeValue(record.monthly_contribution);
        totalPenalties += safeValue(record.penalties);
        membersInFilter.add(record.member_id);
    }
    
    return {
        totalMembers: totalMembers,
        activeMembers: membersInFilter.size,
        totalLoan: totalLoan,
        totalLoanBalance: totalLoanBalance,
        totalContributions: totalContributions,
        totalPenalties: totalPenalties
    };
}

function getFilterDisplayText() {
    if (currentFilter.year === 'all' && currentFilter.month === 'all') {
        return "All Time";
    } else if (currentFilter.year !== 'all' && currentFilter.month === 'all') {
        return "Year " + currentFilter.year;
    } else if (currentFilter.year === 'all' && currentFilter.month !== 'all') {
        return monthNames[currentFilter.month - 1];
    } else {
        return monthNames[currentFilter.month - 1] + " " + currentFilter.year;
    }
}

function getMonthlyTrends() {
    var monthlyMap = {};
    
    for (var i = 0; i < filteredRecords.length; i++) {
        var record = filteredRecords[i];
        var key = record.year + '-' + record.month;
        var label = monthNames[record.month - 1] + ' ' + record.year;
        
        if (!monthlyMap[key]) {
            monthlyMap[key] = { label: label, contributions: 0, loans: 0 };
        }
        monthlyMap[key].contributions += safeValue(record.monthly_contribution);
        monthlyMap[key].loans += safeValue(record.loan);
    }
    
    var sortedKeys = Object.keys(monthlyMap).sort();
    return {
        labels: sortedKeys.map(k => monthlyMap[k].label),
        contributions: sortedKeys.map(k => monthlyMap[k].contributions),
        loans: sortedKeys.map(k => monthlyMap[k].loans)
    };
}

function getMemberRankings() {
    var memberMap = {};
    
    for (var i = 0; i < filteredRecords.length; i++) {
        var record = filteredRecords[i];
        if (!memberMap[record.member_id]) {
            memberMap[record.member_id] = { contributions: 0, loans: 0 };
        }
        memberMap[record.member_id].contributions += safeValue(record.monthly_contribution);
        memberMap[record.member_id].loans += safeValue(record.loan);
    }
    
    var rankings = [];
    for (var id in memberMap) {
        var member = allMembers.find(m => m.id === id);
        if (member) {
            rankings.push({
                name: member.name,
                contributions: memberMap[id].contributions,
                loans: memberMap[id].loans
            });
        }
    }
    
    rankings.sort(function(a, b) { return b.contributions - a.contributions; });
    return rankings;
}

function getTopContributors() {
    var rankings = getMemberRankings();
    var top5 = rankings.slice(0, 5);
    
    return {
        names: top5.map(m => m.name.length > 12 ? m.name.substring(0, 10) + '...' : m.name),
        amounts: top5.map(m => m.contributions)
    };
}

function createCharts() {
    var trends = getMonthlyTrends();
    var topContributors = getTopContributors();
    
    if (trendsChart) trendsChart.destroy();
    if (topMembersChart) topMembersChart.destroy();
    
    // Trends Chart
    var ctx1 = document.getElementById('trendsChart');
    if (ctx1) {
        trendsChart = new Chart(ctx1.getContext('2d'), {
            type: 'line',
            data: {
                labels: trends.labels,
                datasets: [
                    {
                        label: 'Monthly Contributions',
                        data: trends.contributions,
                        borderColor: '#b6552a',
                        backgroundColor: 'rgba(182, 85, 42, 0.1)',
                        borderWidth: 2,
                        tension: 0.3,
                        fill: true,
                        pointBackgroundColor: '#b6552a',
                        pointBorderColor: 'white',
                        pointRadius: 4,
                        pointHoverRadius: 6
                    },
                    {
                        label: 'Loans Given',
                        data: trends.loans,
                        borderColor: '#f59e0b',
                        backgroundColor: 'rgba(245, 158, 11, 0.1)',
                        borderWidth: 2,
                        tension: 0.3,
                        fill: true,
                        pointBackgroundColor: '#f59e0b',
                        pointBorderColor: 'white',
                        pointRadius: 4,
                        pointHoverRadius: 6
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'bottom', labels: { font: { size: 10 } } },
                    tooltip: { 
                        callbacks: { 
                            label: function(context) { 
                                return context.dataset.label + ': KES ' + context.raw.toLocaleString(); 
                            } 
                        } 
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: { callback: function(value) { return 'KES ' + value.toLocaleString('en-KE'); } }
                    }
                }
            }
        });
    }
    
    // Top Contributors Bar Chart
    var ctx2 = document.getElementById('topMembersChart');
    if (ctx2) {
        topMembersChart = new Chart(ctx2.getContext('2d'), {
            type: 'bar',
            data: {
                labels: topContributors.names,
                datasets: [{
                    label: 'Total Contributions (KES)',
                    data: topContributors.amounts,
                    backgroundColor: '#b6552a',
                    borderRadius: 8,
                    barPercentage: 0.7
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'bottom', labels: { font: { size: 10 } } },
                    tooltip: { 
                        callbacks: { 
                            label: function(context) { 
                                return 'KES ' + context.raw.toLocaleString(); 
                            } 
                        } 
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: { callback: function(value) { return 'KES ' + value.toLocaleString('en-KE'); } }
                    }
                }
            }
        });
    }
}

function shareToWhatsApp() {
    var stats = getSummaryStats();
    var rankings = getMemberRankings();
    var filterText = getFilterDisplayText();
    
    var message = "🏦 *CHAMA FINANCIAL REPORT*\n";
    message += "📅 *Period:* " + filterText + "\n";
    message += "📊 *Generated:* " + new Date().toLocaleString() + "\n";
    message += "━━━━━━━━━━━━━━━━━━━━━\n\n";
    
    message += "📊 *SUMMARY STATISTICS*\n";
    message += "👥 Total Members: *" + stats.totalMembers + "*\n";
    message += "⭐ Active Members: *" + stats.activeMembers + "*\n";
    message += "💰 Total Contributions: *KES " + formatNumber(stats.totalContributions) + "*\n";
    message += "🏦 Total Loans Given: *KES " + formatNumber(stats.totalLoan) + "*\n";
    message += "⚖️ Outstanding Balance: *KES " + formatNumber(stats.totalLoanBalance) + "*\n";
    message += "⚠️ Total Penalties: *KES " + formatNumber(stats.totalPenalties) + "*\n\n";
    
    message += "━━━━━━━━━━━━━━━━━━━━━\n\n";
    message += "🏆 *TOP CONTRIBUTORS*\n";
    
    for (var i = 0; i < Math.min(10, rankings.length); i++) {
        var m = rankings[i];
        var medal = i === 0 ? "🥇" : (i === 1 ? "🥈" : (i === 2 ? "🥉" : "📌"));
        message += medal + " *" + m.name + "*\n";
        message += "   └─ KES " + formatNumber(m.contributions) + "\n";
    }
    
    message += "\n━━━━━━━━━━━━━━━━━━━━━\n";
    message += "📊 Generated by ChamaEase";
    
    var encodedMessage = encodeURIComponent(message);
    var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    
    if (isMobile) {
        window.location.href = "whatsapp://send?text=" + encodedMessage;
        setTimeout(function() {
            window.open("https://wa.me/?text=" + encodedMessage, "_blank");
        }, 500);
    } else {
        window.open("https://wa.me/?text=" + encodedMessage, "_blank");
    }
    
    showToast("Opening WhatsApp...");
}

function exportToExcel() {
    var stats = getSummaryStats();
    var rankings = getMemberRankings();
    var filterText = getFilterDisplayText();
    
    var csvRows = [];
    csvRows.push(["CHAMA FINANCIAL REPORT"]);
    csvRows.push(["Period:", filterText]);
    csvRows.push(["Generated:", new Date().toLocaleString()]);
    csvRows.push([]);
    csvRows.push(["SUMMARY STATISTICS"]);
    csvRows.push(["Total Members", stats.totalMembers]);
    csvRows.push(["Active Members", stats.activeMembers]);
    csvRows.push(["Total Contributions", "KES " + formatNumber(stats.totalContributions)]);
    csvRows.push(["Total Loans Given", "KES " + formatNumber(stats.totalLoan)]);
    csvRows.push(["Outstanding Balance", "KES " + formatNumber(stats.totalLoanBalance)]);
    csvRows.push(["Total Penalties", "KES " + formatNumber(stats.totalPenalties)]);
    csvRows.push([]);
    csvRows.push(["MEMBER RANKINGS"]);
    csvRows.push(["RANK", "MEMBER NAME", "TOTAL CONTRIBUTIONS", "TOTAL LOANS"]);
    
    for (var i = 0; i < rankings.length; i++) {
        var m = rankings[i];
        csvRows.push([i + 1, m.name, "KES " + formatNumber(m.contributions), "KES " + formatNumber(m.loans)]);
    }
    
    var csv = "";
    for (var i = 0; i < csvRows.length; i++) {
        csv += csvRows[i].join(",") + "\n";
    }
    
    var blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    var link = document.createElement("a");
    var url = URL.createObjectURL(blob);
    link.href = url;
    link.setAttribute("download", "chama_report_" + getFilterDisplayText().replace(/ /g, '_') + ".csv");
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
    showToast("Report exported to Excel!");
}

function printReport() {
    window.print();
}

function renderReports() {
    var container = document.getElementById("app-root");
    var stats = getSummaryStats();
    var rankings = getMemberRankings();
    var filterText = getFilterDisplayText();
    
    // Build year options
    var yearOptions = '<option value="all" ' + (currentFilter.year === 'all' ? 'selected' : '') + '>All Years</option>';
    for (var i = 0; i < availableYears.length; i++) {
        yearOptions += '<option value="' + availableYears[i] + '" ' + (currentFilter.year == availableYears[i] ? 'selected' : '') + '>' + availableYears[i] + '</option>';
    }
    
    // Build month options
    var monthOptions = '<option value="all" ' + (currentFilter.month === 'all' ? 'selected' : '') + '>All Months</option>';
    for (var i = 1; i <= 12; i++) {
        monthOptions += '<option value="' + i + '" ' + (currentFilter.month == i ? 'selected' : '') + '>' + monthNames[i - 1] + '</option>';
    }
    
    // Build rankings table rows
    var tableRows = '';
    for (var i = 0; i < rankings.length; i++) {
        var m = rankings[i];
        var rankClass = '';
        if (i === 0) rankClass = 'rank-1';
        else if (i === 1) rankClass = 'rank-2';
        else if (i === 2) rankClass = 'rank-3';
        
        tableRows += `<tr>
            <td style="width: 60px; text-align: center;">
                <span class="rank-number ${rankClass}">${i + 1}</span>
            </td>
            <td class="member-name">${escapeHtml(m.name)}</td>
            <td class="amount">KES ${formatNumber(m.contributions)}</td>
            <td>KES ${formatNumber(m.loans)}</td>
        </tr>`;
    }
    
    if (rankings.length === 0) {
        tableRows = `<tr><td colspan="4" style="text-align:center; padding:2rem;">No records found for selected period</td></tr>`;
    }
    
    var html = `
        <div class="report-header">
            <h1>📊 Chama Financial Report</h1>
            <p>Generated on ${new Date().toLocaleDateString()} at ${new Date().toLocaleTimeString()}</p>
        </div>
        
        <!-- Filter Section - Auto updates, no Apply button needed -->
        <div class="filter-section">
            <div class="filter-title">🔍 Filter Reports</div>
            <div class="filter-controls">
                <div class="filter-group">
                    <label class="filter-label">Select Year</label>
                    <select id="yearFilter" class="filter-select">${yearOptions}</select>
                </div>
                <div class="filter-group">
                    <label class="filter-label">Select Month</label>
                    <select id="monthFilter" class="filter-select">${monthOptions}</select>
                </div>
                <div class="filter-group">
                    <button class="btn-reset" id="resetFilterBtn">Reset Filters</button>
                </div>
            </div>
            <div class="active-filter-badge">
                📅 Showing: <strong>${filterText}</strong> (${filteredRecords.length} records)
            </div>
        </div>
        
        <!-- Statistics Section -->
        <div class="stats-container">
            <div class="stats-title">📈 Key Statistics (${filterText})</div>
            <div class="stats-grid-clean">
                <div class="stat-item">
                    <div class="stat-value-large">${stats.totalMembers}</div>
                    <div class="stat-label-clean">Total Members</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value-large">${stats.activeMembers}</div>
                    <div class="stat-label-clean">Active Members</div>
                    <div class="stat-sub">with transactions</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value-large">KES ${(stats.totalContributions/1000).toFixed(1)}k</div>
                    <div class="stat-label-clean">Total Contributions</div>
                    <div class="stat-sub">KES ${formatNumber(stats.totalContributions)}</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value-large">KES ${(stats.totalLoan/1000).toFixed(1)}k</div>
                    <div class="stat-label-clean">Total Loans Given</div>
                    <div class="stat-sub">KES ${formatNumber(stats.totalLoan)}</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value-large">KES ${(stats.totalLoanBalance/1000).toFixed(1)}k</div>
                    <div class="stat-label-clean">Outstanding Balance</div>
                    <div class="stat-sub">KES ${formatNumber(stats.totalLoanBalance)}</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value-large">KES ${(stats.totalPenalties/1000).toFixed(1)}k</div>
                    <div class="stat-label-clean">Total Penalties</div>
                    <div class="stat-sub">KES ${formatNumber(stats.totalPenalties)}</div>
                </div>
            </div>
        </div>
        
        <!-- Action Buttons -->
        <div class="action-buttons-container">
            <button class="action-btn-clean btn-whatsapp" id="shareWABtn">
                📱 Share on WhatsApp
            </button>
            <button class="action-btn-clean btn-excel" id="exportExcelBtn">
                📊 Export to Excel
            </button>
            <button class="action-btn-clean btn-print" id="printBtn">
                🖨️ Print Report
            </button>
        </div>
        
        <!-- Member Rankings Table -->
        <div class="rankings-container">
            <div class="rankings-header">
                <h3>🏆 Member Rankings (${filterText})</h3>
            </div>
            <div class="rankings-table-wrapper">
                <table class="rankings-table">
                    <thead>
                        <tr>
                            <th style="width:60px;">Rank</th>
                            <th>Member Name</th>
                            <th>Total Contributions</th>
                            <th>Total Loans</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${tableRows}
                    </tbody>
                </table>
            </div>
        </div>
        
        <!-- Charts Section -->
        <div class="charts-section">
            <div class="charts-header">
                <h3>📊 Financial Charts (${filterText})</h3>
            </div>
            <div class="charts-grid-bottom">
                <div class="chart-box">
                    <div class="chart-title">Monthly Trends (Contributions vs Loans)</div>
                    <div class="chart-canvas">
                        <canvas id="trendsChart"></canvas>
                    </div>
                </div>
                <div class="chart-box">
                    <div class="chart-title">Top 5 Contributors</div>
                    <div class="chart-canvas">
                        <canvas id="topMembersChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="report-footer">
            Report generated by ChamaEase · All amounts are in Kenyan Shillings (KES)
        </div>
    `;
    
    container.innerHTML = html;
    
    // Create charts
    setTimeout(function() {
        createCharts();
    }, 100);
    
    // Bind filter events - AUTO UPDATE (no apply button needed)
    document.getElementById("yearFilter").addEventListener("change", function() {
        currentFilter.year = this.value;
        onFilterChange();
    });
    
    document.getElementById("monthFilter").addEventListener("change", function() {
        currentFilter.month = this.value;
        onFilterChange();
    });
    
    document.getElementById("resetFilterBtn").addEventListener("click", function() {
        currentFilter = { year: 'all', month: 'all' };
        document.getElementById("yearFilter").value = 'all';
        document.getElementById("monthFilter").value = 'all';
        onFilterChange();
    });
    
    document.getElementById("shareWABtn").addEventListener("click", shareToWhatsApp);
    document.getElementById("exportExcelBtn").addEventListener("click", exportToExcel);
    document.getElementById("printBtn").addEventListener("click", printReport);
}

</script>
