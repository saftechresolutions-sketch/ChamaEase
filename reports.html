<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>ChamaEase | Reports</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <style>
        /* Reports Page Styles */
        .hero-report {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border-radius: 20px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            color: white;
        }
        
        .hero-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }
        
        .hero-subtitle {
            font-size: 0.75rem;
            opacity: 0.9;
        }
        
        /* Chart Containers */
        .charts-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        
        @media (min-width: 768px) {
            .charts-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        .chart-card {
            background: white;
            border-radius: 16px;
            padding: 1rem;
            border: 1px solid var(--gray-border);
        }
        
        .chart-title {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #1e2a3e;
        }
        
        .chart-container {
            position: relative;
            height: 220px;
        }
        
        /* Action Buttons */
        .report-actions {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
            justify-content: center;
        }
        
        .action-btn {
            padding: 10px 20px;
            border-radius: 40px;
            border: none;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        
        .action-btn-wa {
            background: #25D366;
            color: white;
        }
        
        .action-btn-wa:hover {
            background: #128C7E;
            transform: translateY(-1px);
        }
        
        .action-btn-excel {
            background: #10b981;
            color: white;
        }
        
        .action-btn-excel:hover {
            background: #059669;
            transform: translateY(-1px);
        }
        
        .action-btn-pdf {
            background: #dc2626;
            color: white;
        }
        
        .action-btn-pdf:hover {
            background: #b91c1c;
            transform: translateY(-1px);
        }
        
        /* Member Table */
        .member-table-wrapper {
            overflow-x: auto;
        }
        
        .member-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.75rem;
        }
        
        .member-table th,
        .member-table td {
            padding: 10px 8px;
            text-align: left;
            border-bottom: 1px solid var(--gray-border);
        }
        
        .member-table th {
            background: #f8fafc;
            font-weight: 600;
            position: sticky;
            top: 0;
        }
        
        .member-table tr:hover {
            background: var(--primary-light);
        }
        
        .rank-badge {
            display: inline-block;
            width: 24px;
            height: 24px;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: 50%;
            text-align: center;
            line-height: 24px;
            font-size: 0.7rem;
            font-weight: 700;
        }
        
        .rank-1 { background: #fbbf24; color: #92400e; }
        .rank-2 { background: #e5e7eb; color: #374151; }
        .rank-3 { background: #fdba74; color: #9a3412; }
        
        @media (max-width: 768px) {
            .report-actions {
                flex-direction: column;
            }
            .action-btn {
                justify-content: center;
            }
            .member-table th,
            .member-table td {
                padding: 6px 4px;
                font-size: 0.65rem;
            }
        }
        
        /* Toast */
        .toast-msg {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary);
            color: white;
            padding: 10px 20px;
            border-radius: 40px;
            font-size: 0.75rem;
            z-index: 1002;
            animation: fadeInUp 0.3s ease;
        }
        
        @keyframes fadeInUp {
            from {
                transform: translateX(-50%) translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
<div class="app-wrapper">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">ChamaEase</div>
            <button class="sidebar-close" id="sidebarClose">✕</button>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item"><span class="icon">📊</span><span class="label">DASHBOARD</span></a>
            <a href="members.html" class="nav-item"><span class="icon">👥</span><span class="label">MEMBERS</span></a>
            <a href="member-history.html" class="nav-item"><span class="icon">📜</span><span class="label">MEMBER HISTORY</span></a>
            <a href="monthly-records.html" class="nav-item"><span class="icon">📅</span><span class="label">MONTHLY RECORDS</span></a>
            <a href="reports.html" class="nav-item active"><span class="icon">📈</span><span class="label">REPORTS</span></a>
            <a href="settings.html" class="nav-item"><span class="icon">⚙️</span><span class="label">SETTINGS</span></a>
        </nav>
    </aside>

    <main class="main-content">
        <div class="top-bar">
            <button class="menu-toggle" id="menuToggle">☰</button>
            <div class="page-title">📈 REPORTS</div>
            <div class="user-info">
                <span class="user-email" id="userEmail"></span>
                <button id="logoutBtn" class="logout-btn">LOGOUT</button>
            </div>
        </div>
        <div id="app-root" class="container">
            <div style="text-align: center; padding: 2rem;">
                <div class="loading-spinner"></div>
                <p>Loading reports...</p>
            </div>
        </div>
        <footer>Smart Chama Management · Reports and analytics</footer>
    </main>
</div>

<script>
// Using supabaseClient from supabase-config.js
let allMembers = [];
let allRecords = [];
let contributionChart = null;

// Sidebar functions
function openSidebar() {
    document.getElementById("sidebar").classList.add("open");
    document.getElementById("sidebarOverlay").classList.add("active");
}

function closeSidebar() {
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("sidebarOverlay").classList.remove("active");
}

document.getElementById("menuToggle").addEventListener("click", openSidebar);
document.getElementById("sidebarClose").addEventListener("click", closeSidebar);
document.getElementById("sidebarOverlay").addEventListener("click", closeSidebar);
document.getElementById("logoutBtn").addEventListener("click", async function() {
    await logoutUser();
    window.location.href = "index.html";
});

function showMessage(message, isError = false) {
    const toast = document.createElement('div');
    toast.className = 'toast-msg';
    toast.style.background = isError ? '#dc2626' : '#2c7a4d';
    toast.textContent = isError ? '⚠️ ' + message : '✓ ' + message;
    document.body.appendChild(toast);
    setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}

function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/[&<>]/g, function(m) {
        if (m === "&") return "&amp;";
        if (m === "<") return "&lt;";
        if (m === ">") return "&gt;";
        return m;
    });
}

function safeValue(value) {
    if (value === null || value === undefined || value === '' || isNaN(value)) {
        return 0;
    }
    return parseFloat(value);
}

function formatNumber(num) {
    if (num === null || num === undefined) return "0";
    return num.toLocaleString('en-KE');
}

async function loadData() {
    try {
        const membersResult = await supabaseClient.from("members").select("*").order("name");
        if (membersResult.error) throw membersResult.error;
        allMembers = membersResult.data || [];
        
        const recordsResult = await supabaseClient.from("monthly_records").select("*");
        if (recordsResult.error) throw recordsResult.error;
        allRecords = recordsResult.data || [];
        
        renderReports();
    } catch (error) {
        document.getElementById("app-root").innerHTML = '<div style="padding:2rem;text-align:center"><h3>⚠️ Error</h3><p>' + error.message + '</p><button class="btn" onclick="location.reload()">Retry</button></div>';
    }
}

function getSummaryStats() {
    var totalMembers = allMembers.length;
    var totalLoan = 0;
    var totalLoanBalance = 0;
    var totalContributions = 0;
    var totalPenalties = 0;
    
    for (var i = 0; i < allRecords.length; i++) {
        var record = allRecords[i];
        totalLoan += safeValue(record.loan);
        totalLoanBalance += safeValue(record.loan_balance);
        totalContributions += safeValue(record.monthly_contribution);
        totalPenalties += safeValue(record.penalties);
    }
    
    return {
        totalMembers: totalMembers,
        totalLoan: totalLoan,
        totalLoanBalance: totalLoanBalance,
        totalContributions: totalContributions,
        totalPenalties: totalPenalties,
        totalCollected: totalContributions + (totalLoan - totalLoanBalance)
    };
}

function getMonthlyData() {
    var monthlyMap = {};
    var monthNames = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
    
    for (var i = 0; i < allRecords.length; i++) {
        var record = allRecords[i];
        var key = record.year + '-' + record.month;
        var label = monthNames[record.month - 1] + ' ' + record.year;
        
        if (!monthlyMap[key]) {
            monthlyMap[key] = { label: label, contributions: 0, loans: 0 };
        }
        monthlyMap[key].contributions += safeValue(record.monthly_contribution);
        monthlyMap[key].loans += safeValue(record.loan);
    }
    
    var sortedKeys = Object.keys(monthlyMap).sort();
    var result = {
        labels: [],
        contributions: [],
        loans: []
    };
    
    for (var i = 0; i < sortedKeys.length; i++) {
        var data = monthlyMap[sortedKeys[i]];
        result.labels.push(data.label);
        result.contributions.push(data.contributions);
        result.loans.push(data.loans);
    }
    
    return result;
}

function getMemberRankings() {
    var memberData = {};
    
    for (var i = 0; i < allRecords.length; i++) {
        var record = allRecords[i];
        if (!memberData[record.member_id]) {
            memberData[record.member_id] = { contributions: 0, loans: 0, months: 0 };
        }
        memberData[record.member_id].contributions += safeValue(record.monthly_contribution);
        memberData[record.member_id].loans += safeValue(record.loan);
        memberData[record.member_id].months++;
    }
    
    var rankings = [];
    for (var id in memberData) {
        var member = allMembers.find(m => m.id === id);
        if (member) {
            rankings.push({
                name: member.name,
                contributions: memberData[id].contributions,
                loans: memberData[id].loans,
                months: memberData[id].months
            });
        }
    }
    
    rankings.sort(function(a, b) { return b.contributions - a.contributions; });
    return rankings;
}

function createChart() {
    var monthlyData = getMonthlyData();
    
    if (contributionChart) contributionChart.destroy();
    
    var ctx = document.getElementById('trendsChart').getContext('2d');
    contributionChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: monthlyData.labels,
            datasets: [
                {
                    label: 'Contributions (KES)',
                    data: monthlyData.contributions,
                    borderColor: '#2c7a4d',
                    backgroundColor: 'rgba(44, 122, 77, 0.1)',
                    tension: 0.3,
                    fill: true,
                    pointBackgroundColor: '#2c7a4d',
                    pointBorderColor: 'white',
                    pointRadius: 4
                },
                {
                    label: 'Loans (KES)',
                    data: monthlyData.loans,
                    borderColor: '#f59e0b',
                    backgroundColor: 'rgba(245, 158, 11, 0.1)',
                    tension: 0.3,
                    fill: true,
                    pointBackgroundColor: '#f59e0b',
                    pointBorderColor: 'white',
                    pointRadius: 4
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { position: 'bottom', labels: { font: { size: 10 } } },
                tooltip: { callbacks: { label: function(context) { return 'KES ' + context.raw.toLocaleString(); } } }
            }
        }
    });
}

function renderStatsCards() {
    var stats = getSummaryStats();
    
    return `
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number">${stats.totalMembers}</div>
                <div class="stat-label">Total Members</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">KES ${(stats.totalContributions/1000).toFixed(0)}k</div>
                <div class="stat-label">Contributions</div>
                <div class="stat-full">KES ${formatNumber(stats.totalContributions)}</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">KES ${(stats.totalLoan/1000).toFixed(0)}k</div>
                <div class="stat-label">Loans Given</div>
                <div class="stat-full">KES ${formatNumber(stats.totalLoan)}</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">KES ${(stats.totalLoanBalance/1000).toFixed(0)}k</div>
                <div class="stat-label">Outstanding</div>
                <div class="stat-full">KES ${formatNumber(stats.totalLoanBalance)}</div>
            </div>
        </div>
    `;
}

function renderMemberTable() {
    var rankings = getMemberRankings();
    
    if (rankings.length === 0) {
        return '<div style="text-align:center; padding:2rem;">No member records found</div>';
    }
    
    var tableRows = '';
    for (var i = 0; i < rankings.length; i++) {
        var m = rankings[i];
        var rankClass = '';
        if (i === 0) rankClass = 'rank-1';
        else if (i === 1) rankClass = 'rank-2';
        else if (i === 2) rankClass = 'rank-3';
        
        tableRows += `<tr>
            <td style="text-align:center; width:50px;"><span class="rank-badge ${rankClass}">${i + 1}</span></td>
            <td><strong>${escapeHtml(m.name)}</strong></td>
            <td>KES ${formatNumber(m.contributions)}</td>
            <td>KES ${formatNumber(m.loans)}</td>
            <td>${m.months}</td>
        </tr>`;
    }
    
    return `
        <div class="member-table-wrapper">
            <table class="member-table">
                <thead>
                    <tr>
                        <th style="width:50px;">#</th>
                        <th>Member</th>
                        <th>Contributions</th>
                        <th>Loans</th>
                        <th>Months</th>
                    </tr>
                </thead>
                <tbody>
                    ${tableRows}
                </tbody>
            </table>
        </div>
    `;
}

function exportToExcel() {
    var rankings = getMemberRankings();
    var stats = getSummaryStats();
    
    var csvRows = [];
    csvRows.push(["CHAMA REPORT - " + new Date().toLocaleString()]);
    csvRows.push([]);
    csvRows.push(["SUMMARY"]);
    csvRows.push(["Total Members", stats.totalMembers]);
    csvRows.push(["Total Contributions", "KES " + formatNumber(stats.totalContributions)]);
    csvRows.push(["Total Loans", "KES " + formatNumber(stats.totalLoan)]);
    csvRows.push(["Outstanding Balance", "KES " + formatNumber(stats.totalLoanBalance)]);
    csvRows.push([]);
    csvRows.push(["MEMBER RANKINGS"]);
    csvRows.push(["RANK", "MEMBER", "CONTRIBUTIONS", "LOANS", "ACTIVE MONTHS"]);
    
    for (var i = 0; i < rankings.length; i++) {
        var m = rankings[i];
        csvRows.push([i + 1, m.name, "KES " + formatNumber(m.contributions), "KES " + formatNumber(m.loans), m.months]);
    }
    
    var csv = "";
    for (var i = 0; i < csvRows.length; i++) {
        csv += csvRows[i].join(",") + "\n";
    }
    
    var blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    var link = document.createElement("a");
    var url = URL.createObjectURL(blob);
    link.href = url;
    link.setAttribute("download", "chama_report_" + new Date().toISOString().slice(0,10) + ".csv");
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
    showMessage("Report exported as Excel!");
}

function shareToWhatsApp() {
    var stats = getSummaryStats();
    var rankings = getMemberRankings();
    
    var message = "🏦 *CHAMA REPORT*\n";
    message += "📅 " + new Date().toLocaleDateString() + "\n\n";
    message += "📊 *SUMMARY*\n";
    message += "👥 Members: " + stats.totalMembers + "\n";
    message += "💰 Total Contributions: KES " + formatNumber(stats.totalContributions) + "\n";
    message += "🏦 Total Loans: KES " + formatNumber(stats.totalLoan) + "\n";
    message += "⚖️ Outstanding: KES " + formatNumber(stats.totalLoanBalance) + "\n\n";
    
    message += "🏆 *TOP MEMBERS*\n";
    for (var i = 0; i < Math.min(5, rankings.length); i++) {
        var m = rankings[i];
        message += (i + 1) + ". " + m.name + " - KES " + formatNumber(m.contributions) + "\n";
    }
    
    var encodedMessage = encodeURIComponent(message);
    window.open("https://web.whatsapp.com/send?text=" + encodedMessage, "_blank");
    showMessage("Opening WhatsApp...");
}

function printReport() {
    window.print();
}

function renderReports() {
    var container = document.getElementById("app-root");
    
    var html = `
        <div class="hero-report">
            <div class="hero-title">📊 Chama Reports</div>
            <div class="hero-subtitle">View your chama's financial performance</div>
        </div>
        
        ${renderStatsCards()}
        
        <div class="report-actions">
            <button class="action-btn action-btn-wa" id="shareWABtn">📱 Share on WhatsApp</button>
            <button class="action-btn action-btn-excel" id="exportExcelBtn">📊 Export to Excel</button>
            <button class="action-btn action-btn-pdf" id="printBtn">🖨️ Print Report</button>
        </div>
        
        <div class="chart-card">
            <div class="chart-title">📈 Monthly Trends (Contributions vs Loans)</div>
            <div class="chart-container">
                <canvas id="trendsChart"></canvas>
            </div>
        </div>
        
        <div class="card">
            <div class="flex-between">
                <h3>🏆 Member Rankings</h3>
                <span style="font-size:0.7rem; color:#6c757d;">Sorted by contributions</span>
            </div>
            ${renderMemberTable()}
        </div>
    `;
    
    container.innerHTML = html;
    
    createChart();
    
    document.getElementById("shareWABtn").addEventListener("click", shareToWhatsApp);
    document.getElementById("exportExcelBtn").addEventListener("click", exportToExcel);
    document.getElementById("printBtn").addEventListener("click", printReport);
}

// Initialize
(async function() {
    const isAuth = await protectPage();
    if (isAuth) {
        const user = await getCurrentUser();
        if (user && document.getElementById("userEmail")) {
            document.getElementById("userEmail").textContent = user.email || "Admin";
        }
        await loadData();
    }
})();
</script>
</body>
</html>
