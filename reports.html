<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>ChamaEase | Reports</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <style>
        /* Reports Page Styles */
        .report-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border-radius: 20px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            color: white;
            text-align: center;
        }
        
        .report-header h1 {
            font-size: 1.5rem;
            margin-bottom: 0.25rem;
        }
        
        .report-header p {
            font-size: 0.75rem;
            opacity: 0.9;
        }
        
        /* Stats Grid - Clean and Clear */
        .stats-container {
            background: white;
            border-radius: 20px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--gray-border);
        }
        
        .stats-title {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--primary);
            display: inline-block;
        }
        
        .stats-grid-clean {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }
        
        @media (min-width: 640px) {
            .stats-grid-clean {
                grid-template-columns: repeat(4, 1fr);
            }
        }
        
        .stat-item {
            text-align: center;
            padding: 0.8rem;
            background: #f8fafc;
            border-radius: 16px;
        }
        
        .stat-value-large {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--primary);
        }
        
        .stat-label-clean {
            font-size: 0.7rem;
            color: #6c757d;
            margin-top: 0.25rem;
        }
        
        .stat-sub {
            font-size: 0.6rem;
            color: #94a3b8;
            margin-top: 0.2rem;
        }
        
        /* Action Buttons */
        .action-buttons-container {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        
        .action-btn-clean {
            padding: 12px 24px;
            border-radius: 40px;
            border: none;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        
        .btn-whatsapp {
            background: #25D366;
            color: white;
        }
        
        .btn-whatsapp:hover {
            background: #128C7E;
            transform: translateY(-2px);
        }
        
        .btn-excel {
            background: #10b981;
            color: white;
        }
        
        .btn-excel:hover {
            background: #059669;
            transform: translateY(-2px);
        }
        
        .btn-print {
            background: #3b82f6;
            color: white;
        }
        
        .btn-print:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }
        
        /* Member Rankings Table - Clean Design */
        .rankings-container {
            background: white;
            border-radius: 20px;
            border: 1px solid var(--gray-border);
            margin-bottom: 1.5rem;
            overflow: hidden;
        }
        
        .rankings-header {
            background: #f8fafc;
            padding: 1rem;
            border-bottom: 1px solid var(--gray-border);
        }
        
        .rankings-header h3 {
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .rankings-table-wrapper {
            overflow-x: auto;
        }
        
        .rankings-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .rankings-table th,
        .rankings-table td {
            padding: 12px 10px;
            text-align: left;
            border-bottom: 1px solid var(--gray-border);
        }
        
        .rankings-table th {
            background: #fafbfc;
            font-weight: 600;
            font-size: 0.75rem;
            color: #1e2a3e;
        }
        
        .rankings-table tr:hover {
            background: var(--primary-light);
        }
        
        .rank-number {
            display: inline-block;
            width: 28px;
            height: 28px;
            background: #e2e8f0;
            border-radius: 50%;
            text-align: center;
            line-height: 28px;
            font-size: 0.75rem;
            font-weight: 700;
            color: #475569;
        }
        
        .rank-1 { background: #fbbf24; color: #92400e; }
        .rank-2 { background: #e5e7eb; color: #374151; }
        .rank-3 { background: #fdba74; color: #9a3412; }
        
        .member-name {
            font-weight: 600;
            color: #1e2a3e;
        }
        
        .amount {
            font-weight: 500;
            color: var(--primary);
        }
        
        /* Charts Section - At Bottom */
        .charts-section {
            background: white;
            border-radius: 20px;
            border: 1px solid var(--gray-border);
            margin-bottom: 1.5rem;
            overflow: hidden;
        }
        
        .charts-header {
            background: #f8fafc;
            padding: 1rem;
            border-bottom: 1px solid var(--gray-border);
        }
        
        .charts-header h3 {
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .charts-grid-bottom {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
            padding: 1.5rem;
        }
        
        @media (min-width: 768px) {
            .charts-grid-bottom {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        .chart-box {
            background: white;
            border-radius: 16px;
            padding: 1rem;
            border: 1px solid var(--gray-border);
        }
        
        .chart-title {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1rem;
            text-align: center;
            color: #1e2a3e;
        }
        
        .chart-canvas {
            position: relative;
            height: 250px;
        }
        
        /* Footer Note */
        .report-footer {
            text-align: center;
            padding: 1rem;
            font-size: 0.65rem;
            color: #94a3b8;
            border-top: 1px solid var(--gray-border);
            margin-top: 1rem;
        }
        
        /* Toast Message */
        .toast-success {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary);
            color: white;
            padding: 10px 20px;
            border-radius: 40px;
            font-size: 0.75rem;
            z-index: 1002;
            animation: fadeInUp 0.3s ease;
        }
        
        @keyframes fadeInUp {
            from {
                transform: translateX(-50%) translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
        }
        
        @media (max-width: 640px) {
            .action-buttons-container {
                flex-direction: column;
            }
            .action-btn-clean {
                justify-content: center;
            }
            .rankings-table th,
            .rankings-table td {
                padding: 8px 6px;
                font-size: 0.7rem;
            }
        }
        
        @media print {
            .action-buttons-container,
            .sidebar,
            .top-bar,
            footer {
                display: none;
            }
            .main-content {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
<div class="app-wrapper">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">ChamaEase</div>
            <button class="sidebar-close" id="sidebarClose">✕</button>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item"><span class="icon">📊</span><span class="label">DASHBOARD</span></a>
            <a href="members.html" class="nav-item"><span class="icon">👥</span><span class="label">MEMBERS</span></a>
            <a href="member-history.html" class="nav-item"><span class="icon">📜</span><span class="label">MEMBER HISTORY</span></a>
            <a href="monthly-records.html" class="nav-item"><span class="icon">📅</span><span class="label">MONTHLY RECORDS</span></a>
            <a href="reports.html" class="nav-item active"><span class="icon">📈</span><span class="label">REPORTS</span></a>
            <a href="settings.html" class="nav-item"><span class="icon">⚙️</span><span class="label">SETTINGS</span></a>
        </nav>
    </aside>

    <main class="main-content">
        <div class="top-bar">
            <button class="menu-toggle" id="menuToggle">☰</button>
            <div class="page-title">📈 REPORTS</div>
            <div class="user-info">
                <span class="user-email" id="userEmail"></span>
                <button id="logoutBtn" class="logout-btn">LOGOUT</button>
            </div>
        </div>
        <div id="app-root" class="container">
            <div style="text-align: center; padding: 2rem;">
                <div class="loading-spinner"></div>
                <p>Loading reports...</p>
            </div>
        </div>
        <footer>Smart Chama Management · Reports and analytics</footer>
    </main>
</div>

<script>
// Using supabaseClient from supabase-config.js
let allMembers = [];
let allRecords = [];
let trendsChart = null;
let topMembersChart = null;

// Sidebar functions
function openSidebar() {
    document.getElementById("sidebar").classList.add("open");
    document.getElementById("sidebarOverlay").classList.add("active");
}

function closeSidebar() {
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("sidebarOverlay").classList.remove("active");
}

document.getElementById("menuToggle").addEventListener("click", openSidebar);
document.getElementById("sidebarClose").addEventListener("click", closeSidebar);
document.getElementById("sidebarOverlay").addEventListener("click", closeSidebar);
document.getElementById("logoutBtn").addEventListener("click", async function() {
    await logoutUser();
    window.location.href = "index.html";
});

function showToast(message) {
    const toast = document.createElement('div');
    toast.className = 'toast-success';
    toast.textContent = '✓ ' + message;
    document.body.appendChild(toast);
    setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
    }, 3000);
}

function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/[&<>]/g, function(m) {
        if (m === "&") return "&amp;";
        if (m === "<") return "&lt;";
        if (m === ">") return "&gt;";
        return m;
    });
}

function safeValue(value) {
    if (value === null || value === undefined || value === '' || isNaN(value)) {
        return 0;
    }
    return parseFloat(value);
}

function formatNumber(num) {
    if (num === null || num === undefined) return "0";
    return num.toLocaleString('en-KE');
}

async function loadData() {
    try {
        const membersResult = await supabaseClient.from("members").select("*").order("name");
        if (membersResult.error) throw membersResult.error;
        allMembers = membersResult.data || [];
        
        const recordsResult = await supabaseClient.from("monthly_records").select("*");
        if (recordsResult.error) throw recordsResult.error;
        allRecords = recordsResult.data || [];
        
        renderReports();
    } catch (error) {
        document.getElementById("app-root").innerHTML = '<div style="padding:2rem;text-align:center"><h3>⚠️ Error</h3><p>' + error.message + '</p><button class="btn" onclick="location.reload()">Retry</button></div>';
    }
}

function getSummaryStats() {
    var totalMembers = allMembers.length;
    var totalLoan = 0;
    var totalLoanBalance = 0;
    var totalContributions = 0;
    var totalPenalties = 0;
    
    for (var i = 0; i < allRecords.length; i++) {
        var record = allRecords[i];
        totalLoan += safeValue(record.loan);
        totalLoanBalance += safeValue(record.loan_balance);
        totalContributions += safeValue(record.monthly_contribution);
        totalPenalties += safeValue(record.penalties);
    }
    
    return {
        totalMembers: totalMembers,
        totalLoan: totalLoan,
        totalLoanBalance: totalLoanBalance,
        totalContributions: totalContributions,
        totalPenalties: totalPenalties
    };
}

function getMonthlyTrends() {
    var monthlyMap = {};
    var monthNames = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
    
    for (var i = 0; i < allRecords.length; i++) {
        var record = allRecords[i];
        var key = record.year + '-' + record.month;
        var label = monthNames[record.month - 1] + ' ' + record.year;
        
        if (!monthlyMap[key]) {
            monthlyMap[key] = { label: label, contributions: 0, loans: 0 };
        }
        monthlyMap[key].contributions += safeValue(record.monthly_contribution);
        monthlyMap[key].loans += safeValue(record.loan);
    }
    
    var sortedKeys = Object.keys(monthlyMap).sort();
    return {
        labels: sortedKeys.map(k => monthlyMap[k].label),
        contributions: sortedKeys.map(k => monthlyMap[k].contributions),
        loans: sortedKeys.map(k => monthlyMap[k].loans)
    };
}

function getMemberRankings() {
    var memberMap = {};
    
    for (var i = 0; i < allRecords.length; i++) {
        var record = allRecords[i];
        if (!memberMap[record.member_id]) {
            memberMap[record.member_id] = { contributions: 0, loans: 0 };
        }
        memberMap[record.member_id].contributions += safeValue(record.monthly_contribution);
        memberMap[record.member_id].loans += safeValue(record.loan);
    }
    
    var rankings = [];
    for (var id in memberMap) {
        var member = allMembers.find(m => m.id === id);
        if (member) {
            rankings.push({
                name: member.name,
                contributions: memberMap[id].contributions,
                loans: memberMap[id].loans
            });
        }
    }
    
    rankings.sort(function(a, b) { return b.contributions - a.contributions; });
    return rankings;
}

function getTopContributors() {
    var rankings = getMemberRankings();
    var top5 = rankings.slice(0, 5);
    
    return {
        names: top5.map(m => m.name.length > 12 ? m.name.substring(0, 10) + '...' : m.name),
        amounts: top5.map(m => m.contributions)
    };
}

function createCharts() {
    var trends = getMonthlyTrends();
    var topContributors = getTopContributors();
    
    // Destroy existing charts
    if (trendsChart) trendsChart.destroy();
    if (topMembersChart) topMembersChart.destroy();
    
    // Trends Chart
    var ctx1 = document.getElementById('trendsChart').getContext('2d');
    trendsChart = new Chart(ctx1, {
        type: 'line',
        data: {
            labels: trends.labels,
            datasets: [
                {
                    label: 'Monthly Contributions',
                    data: trends.contributions,
                    borderColor: '#2c7a4d',
                    backgroundColor: 'rgba(44, 122, 77, 0.1)',
                    borderWidth: 2,
                    tension: 0.3,
                    fill: true,
                    pointBackgroundColor: '#2c7a4d',
                    pointBorderColor: 'white',
                    pointRadius: 4,
                    pointHoverRadius: 6
                },
                {
                    label: 'Loans Given',
                    data: trends.loans,
                    borderColor: '#f59e0b',
                    backgroundColor: 'rgba(245, 158, 11, 0.1)',
                    borderWidth: 2,
                    tension: 0.3,
                    fill: true,
                    pointBackgroundColor: '#f59e0b',
                    pointBorderColor: 'white',
                    pointRadius: 4,
                    pointHoverRadius: 6
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { position: 'bottom', labels: { font: { size: 10 } } },
                tooltip: { 
                    callbacks: { 
                        label: function(context) { 
                            return context.dataset.label + ': KES ' + context.raw.toLocaleString(); 
                        } 
                    } 
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: { callback: function(value) { return 'KES ' + (value/1000).toFixed(0) + 'k'; } }
                }
            }
        }
    });
    
    // Top Contributors Bar Chart
    var ctx2 = document.getElementById('topMembersChart').getContext('2d');
    topMembersChart = new Chart(ctx2, {
        type: 'bar',
        data: {
            labels: topContributors.names,
            datasets: [{
                label: 'Total Contributions (KES)',
                data: topContributors.amounts,
                backgroundColor: '#2c7a4d',
                borderRadius: 8,
                barPercentage: 0.7
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { position: 'bottom', labels: { font: { size: 10 } } },
                tooltip: { 
                    callbacks: { 
                        label: function(context) { 
                            return 'KES ' + context.raw.toLocaleString(); 
                        } 
                    } 
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: { callback: function(value) { return 'KES ' + (value/1000).toFixed(0) + 'k'; } }
                }
            }
        }
    });
}

function shareToWhatsApp() {
    var stats = getSummaryStats();
    var rankings = getMemberRankings();
    
    var message = "🏦 *CHAMA FINANCIAL REPORT*\n";
    message += "📅 *Date:* " + new Date().toLocaleDateString() + "\n";
    message += "━━━━━━━━━━━━━━━━━━━━━\n\n";
    
    message += "📊 *SUMMARY STATISTICS*\n";
    message += "👥 Total Members: *" + stats.totalMembers + "*\n";
    message += "💰 Total Contributions: *KES " + formatNumber(stats.totalContributions) + "*\n";
    message += "🏦 Total Loans Given: *KES " + formatNumber(stats.totalLoan) + "*\n";
    message += "⚖️ Outstanding Balance: *KES " + formatNumber(stats.totalLoanBalance) + "*\n";
    message += "⚠️ Total Penalties: *KES " + formatNumber(stats.totalPenalties) + "*\n\n";
    
    message += "━━━━━━━━━━━━━━━━━━━━━\n\n";
    message += "🏆 *TOP CONTRIBUTORS*\n";
    
    for (var i = 0; i < Math.min(10, rankings.length); i++) {
        var m = rankings[i];
        var medal = i === 0 ? "🥇" : (i === 1 ? "🥈" : (i === 2 ? "🥉" : "📌"));
        message += medal + " *" + m.name + "*\n";
        message += "   └─ KES " + formatNumber(m.contributions) + "\n";
    }
    
    message += "\n━━━━━━━━━━━━━━━━━━━━━\n";
    message += "📊 Generated by ChamaEase";
    
    var encodedMessage = encodeURIComponent(message);
    // Opens WhatsApp directly
    window.open("https://wa.me/?text=" + encodedMessage, "_blank");
    showToast("Opening WhatsApp...");
}

function exportToExcel() {
    var stats = getSummaryStats();
    var rankings = getMemberRankings();
    
    var csvRows = [];
    csvRows.push(["CHAMA FINANCIAL REPORT"]);
    csvRows.push(["Generated:", new Date().toLocaleString()]);
    csvRows.push([]);
    csvRows.push(["SUMMARY STATISTICS"]);
    csvRows.push(["Total Members", stats.totalMembers]);
    csvRows.push(["Total Contributions", "KES " + formatNumber(stats.totalContributions)]);
    csvRows.push(["Total Loans Given", "KES " + formatNumber(stats.totalLoan)]);
    csvRows.push(["Outstanding Balance", "KES " + formatNumber(stats.totalLoanBalance)]);
    csvRows.push(["Total Penalties", "KES " + formatNumber(stats.totalPenalties)]);
    csvRows.push([]);
    csvRows.push(["MEMBER RANKINGS"]);
    csvRows.push(["RANK", "MEMBER NAME", "TOTAL CONTRIBUTIONS", "TOTAL LOANS"]);
    
    for (var i = 0; i < rankings.length; i++) {
        var m = rankings[i];
        csvRows.push([i + 1, m.name, "KES " + formatNumber(m.contributions), "KES " + formatNumber(m.loans)]);
    }
    
    var csv = "";
    for (var i = 0; i < csvRows.length; i++) {
        csv += csvRows[i].join(",") + "\n";
    }
    
    var blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    var link = document.createElement("a");
    var url = URL.createObjectURL(blob);
    link.href = url;
    link.setAttribute("download", "chama_report_" + new Date().toISOString().slice(0,10) + ".csv");
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
    showToast("Report exported to Excel!");
}

function printReport() {
    window.print();
}

function renderReports() {
    var container = document.getElementById("app-root");
    var stats = getSummaryStats();
    var rankings = getMemberRankings();
    
    // Build rankings table rows
    var tableRows = '';
    for (var i = 0; i < rankings.length; i++) {
        var m = rankings[i];
        var rankClass = '';
        if (i === 0) rankClass = 'rank-1';
        else if (i === 1) rankClass = 'rank-2';
        else if (i === 2) rankClass = 'rank-3';
        
        tableRows += `<tr>
            <td style="width: 60px; text-align: center;">
                <span class="rank-number ${rankClass}">${i + 1}</span>
            </td>
            <td class="member-name">${escapeHtml(m.name)}</td>
            <td class="amount">KES ${formatNumber(m.contributions)}</td>
            <td>KES ${formatNumber(m.loans)}</td>
        </tr>`;
    }
    
    var html = `
        <div class="report-header">
            <h1>📊 Chama Financial Report</h1>
            <p>Generated on ${new Date().toLocaleDateString()} at ${new Date().toLocaleTimeString()}</p>
        </div>
        
        <!-- Statistics Section -->
        <div class="stats-container">
            <div class="stats-title">📈 Key Statistics</div>
            <div class="stats-grid-clean">
                <div class="stat-item">
                    <div class="stat-value-large">${stats.totalMembers}</div>
                    <div class="stat-label-clean">Total Members</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value-large">KES ${(stats.totalContributions/1000).toFixed(1)}k</div>
                    <div class="stat-label-clean">Total Contributions</div>
                    <div class="stat-sub">KES ${formatNumber(stats.totalContributions)}</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value-large">KES ${(stats.totalLoan/1000).toFixed(1)}k</div>
                    <div class="stat-label-clean">Total Loans Given</div>
                    <div class="stat-sub">KES ${formatNumber(stats.totalLoan)}</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value-large">KES ${(stats.totalLoanBalance/1000).toFixed(1)}k</div>
                    <div class="stat-label-clean">Outstanding Balance</div>
                    <div class="stat-sub">KES ${formatNumber(stats.totalLoanBalance)}</div>
                </div>
            </div>
        </div>
        
        <!-- Action Buttons -->
        <div class="action-buttons-container">
            <button class="action-btn-clean btn-whatsapp" id="shareWABtn">
                📱 Share on WhatsApp
            </button>
            <button class="action-btn-clean btn-excel" id="exportExcelBtn">
                📊 Export to Excel
            </button>
            <button class="action-btn-clean btn-print" id="printBtn">
                🖨️ Print Report
            </button>
        </div>
        
        <!-- Member Rankings Table -->
        <div class="rankings-container">
            <div class="rankings-header">
                <h3>🏆 Member Rankings</h3>
            </div>
            <div class="rankings-table-wrapper">
                <table class="rankings-table">
                    <thead>
                        <tr>
                            <th style="width:60px;">Rank</th>
                            <th>Member Name</th>
                            <th>Total Contributions</th>
                            <th>Total Loans</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${tableRows || '<tr><td colspan="4" style="text-align:center; padding:2rem;">No member records found<td</tr>'}
                    </tbody>
                </table>
            </div>
        </div>
        
        <!-- Charts Section at Bottom -->
        <div class="charts-section">
            <div class="charts-header">
                <h3>📊 Financial Charts</h3>
            </div>
            <div class="charts-grid-bottom">
                <div class="chart-box">
                    <div class="chart-title">Monthly Trends (Contributions vs Loans)</div>
                    <div class="chart-canvas">
                        <canvas id="trendsChart"></canvas>
                    </div>
                </div>
                <div class="chart-box">
                    <div class="chart-title">Top 5 Contributors</div>
                    <div class="chart-canvas">
                        <canvas id="topMembersChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="report-footer">
            Report generated by ChamaEase · All amounts are in Kenyan Shillings (KES)
        </div>
    `;
    
    container.innerHTML = html;
    
    // Create charts
    createCharts();
    
    // Bind events
    document.getElementById("shareWABtn").addEventListener("click", shareToWhatsApp);
    document.getElementById("exportExcelBtn").addEventListener("click", exportToExcel);
    document.getElementById("printBtn").addEventListener("click", printReport);
}

// Initialize
(async function() {
    const isAuth = await protectPage();
    if (isAuth) {
        const user = await getCurrentUser();
        if (user && document.getElementById("userEmail")) {
            document.getElementById("userEmail").textContent = user.email || "Admin";
        }
        await loadData();
    }
})();
</script>
