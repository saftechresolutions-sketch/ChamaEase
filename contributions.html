<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>ChamaEase | Monthly Records</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Inter', -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #1e2a3e;
        }

        :root {
            --primary: #2c7a4d;
            --primary-light: #eaf5ef;
            --primary-dark: #1f5a3a;
            --danger: #dc4c4c;
            --gray-border: #e2e8f0;
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.04);
            --radius-card: 16px;
            --radius-btn: 32px;
            --sidebar-width: 280px;
        }

        .app-wrapper {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: white;
            border-right: 1px solid var(--gray-border);
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            overflow-y: auto;
            transition: transform 0.3s ease;
            z-index: 1000;
            box-shadow: var(--shadow-sm);
            transform: translateX(0);
        }

        .sidebar-header {
            padding: 1rem;
            border-bottom: 1px solid var(--gray-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-logo {
            font-weight: 800;
            font-size: 1.2rem;
            background: linear-gradient(135deg, var(--primary), #3b9b62);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .sidebar-close {
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            color: #94a3b8;
            display: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            align-items: center;
            justify-content: center;
        }

        .sidebar-close:hover {
            background: #fee2e2;
            color: var(--danger);
        }

        .sidebar-nav {
            padding: 0.8rem 0;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0.7rem 1rem;
            margin: 0.2rem 0.8rem;
            border-radius: 12px;
            text-decoration: none;
            color: #4a5568;
            transition: all 0.2s;
            cursor: pointer;
        }

        .nav-item:hover {
            background: var(--primary-light);
            color: var(--primary);
        }

        .nav-item.active {
            background: var(--primary);
            color: white;
        }

        .nav-item .icon {
            font-size: 1.1rem;
            width: 26px;
            text-align: center;
        }

        .nav-item .label {
            font-weight: 500;
            font-size: 0.85rem;
        }

        .main-content {
            flex: 1;
            margin-left: var(--sidebar-width);
            transition: margin-left 0.3s ease;
            width: calc(100% - var(--sidebar-width));
        }

        .top-bar {
            background: white;
            padding: 0.7rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--gray-border);
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 0;
            z-index: 99;
        }

        .menu-toggle {
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            color: var(--primary);
            padding: 6px;
            border-radius: 50%;
        }

        .page-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1e2a3e;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .user-email {
            font-size: 0.7rem;
            color: #5b6e8c;
            display: none;
        }

        @media (min-width: 480px) {
            .user-email {
                display: inline;
            }
        }

        .logout-btn {
            background: transparent;
            border: 1px solid #dc2626;
            color: #dc2626;
            padding: 0.35rem 0.7rem;
            border-radius: 2rem;
            cursor: pointer;
            font-size: 0.7rem;
        }

        .logout-btn:hover {
            background: #dc2626;
            color: white;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1rem;
            width: 100%;
            min-height: 70vh;
        }

        .btn {
            border: none;
            background: var(--primary);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: var(--radius-btn);
            font-weight: 600;
            cursor: pointer;
            font-size: 0.75rem;
            text-decoration: none;
            display: inline-block;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
        }

        .spreadsheet-container {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid var(--gray-border);
            background: white;
        }

        .spreadsheet-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            min-width: 800px;
        }

        .spreadsheet-table th,
        .spreadsheet-table td {
            border: 1px solid var(--gray-border);
            padding: 10px 8px;
            text-align: left;
            vertical-align: middle;
        }

        .spreadsheet-table th {
            background: #f8fafc;
            font-weight: 600;
        }

        .spreadsheet-table td input {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid transparent;
            border-radius: 6px;
            font-size: 0.8rem;
            background: transparent;
        }

        .spreadsheet-table td input:focus {
            outline: none;
            border-color: var(--primary);
            background: #fff;
        }

        .member-name-cell {
            font-weight: 600;
            background: #f8fafc;
        }

        .totals-row {
            background: #f1f5f9;
            font-weight: 600;
        }

        .totals-row td {
            border-top: 2px solid var(--primary);
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }

        .month-year-selector {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }

        .month-year-selector select {
            padding: 0.5rem 1rem;
            border-radius: 40px;
            border: 1px solid var(--gray-border);
            background: white;
            font-size: 0.85rem;
        }

        .saving-indicator {
            font-size: 0.7rem;
            color: #94a3b8;
            display: inline-block;
            margin-left: 1rem;
        }

        .saving {
            color: var(--primary);
        }

        footer {
            text-align: center;
            padding: 0.8rem;
            font-size: 0.65rem;
            color: #6c757d;
            border-top: 1px solid var(--gray-border);
            margin-top: 1rem;
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 999;
        }

        .sidebar-overlay.active {
            display: block;
        }

        .loading-spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid #e2e8f0;
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .main-content {
                margin-left: 0;
                width: 100%;
            }
            .sidebar-close {
                display: flex;
            }
            .container {
                padding: 0.8rem;
            }
            .spreadsheet-table th,
            .spreadsheet-table td {
                padding: 6px 4px;
                font-size: 0.7rem;
            }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<script>

const SUPABASE_URL = 'https://qfihebqomluleywpgufv.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFmaWhlYnFvbWx1bGV5d3BndWZ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgxOTM5NDEsImV4cCI6MjA5Mzc2OTk0MX0.yKFXsCDYReshZKL9oosvm5ZwHh4GUZy1SYwFyqhDv9I';

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let allMembers = [];
let allRecords = [];
let currentMonth = new Date().getMonth() + 1;
let currentYear = new Date().getFullYear();
let saveTimeout = null;
let currentUser = null;

// Auth functions
async function checkAuth() {
    const { data: { session }, error } = await supabaseClient.auth.getSession();
    if (error || !session) {
        window.location.href = "index.html";
        return false;
    }
    currentUser = session.user;
    document.getElementById("userEmail").textContent = currentUser.email || "Admin";
    return true;
}

async function logoutUser() {
    await supabaseClient.auth.signOut();
    window.location.href = "index.html";
}

// Sidebar functions
function openSidebar() {
    document.getElementById("sidebar").classList.add("open");
    document.getElementById("sidebarOverlay").classList.add("active");
}

function closeSidebar() {
    document.getElementById("sidebar").classList.remove("open");
    document.getElementById("sidebarOverlay").classList.remove("active");
}

document.getElementById("menuToggle").addEventListener("click", openSidebar);
document.getElementById("sidebarClose").addEventListener("click", closeSidebar);
document.getElementById("sidebarOverlay").addEventListener("click", closeSidebar);
document.getElementById("logoutBtn").addEventListener("click", logoutUser);

// Helper functions
function safeValue(value) {
    if (value === null || value === undefined || value === '' || isNaN(value)) {
        return 0;
    }
    return parseFloat(value);
}

function formatNumber(num) {
    if (num === null || num === undefined) return "0";
    return num.toLocaleString("en-KE");
}

function escapeHtml(str) {
    if (!str) return "";
    return str.replace(/[&<>]/g, function(m) {
        if (m === "&") return "&amp;";
        if (m === "<") return "&lt;";
        if (m === ">") return "&gt;";
        return m;
    });
}

function showSavedIndicator(success) {
    const indicator = document.getElementById("saving-indicator");
    if (indicator) {
        indicator.textContent = success ? "Saved" : "Error";
        setTimeout(function() {
            indicator.textContent = "";
        }, 1500);
    }
}

// Data functions
async function loadData() {
    try {
        const { data: membersData, error: membersError } = await supabaseClient
            .from("members")
            .select("*")
            .order("name");
        
        if (membersError) throw membersError;
        allMembers = membersData || [];
        
        const { data: recordsData, error: recordsError } = await supabaseClient
            .from("monthly_records")
            .select("*");
        
        if (recordsError) throw recordsError;
        allRecords = recordsData || [];
        
        renderSpreadsheet();
    } catch (error) {
        document.getElementById("app-root").innerHTML = '<div style="padding:2rem;text-align:center"><h3>Error</h3><p>' + error.message + '</p><button class="btn" onclick="location.reload()">Retry</button></div>';
    }
}

function getRecordForMember(memberId) {
    for (var i = 0; i < allRecords.length; i++) {
        var record = allRecords[i];
        if (record.member_id === memberId && record.month === currentMonth && record.year === currentYear) {
            return record;
        }
    }
    return null;
}

function getRecordValue(memberId, field) {
    var record = getRecordForMember(memberId);
    if (record && record[field] !== null && record[field] !== undefined) {
        return record[field];
    }
    return 0;
}

async function updateRecordValue(memberId, field, value) {
    var record = getRecordForMember(memberId);
    var numValue = safeValue(value);
    
    try {
        if (record) {
            var updateData = {};
            updateData[field] = numValue;
            updateData.updated_at = new Date().toISOString();
            
            var { error } = await supabaseClient
                .from("monthly_records")
                .update(updateData)
                .eq("id", record.id);
            
            if (error) throw error;
            record[field] = numValue;
        } else {
            var newRecord = {
                member_id: memberId,
                month: currentMonth,
                year: currentYear,
                loan: 0,
                loan_deductions: 0,
                loan_balance: 0,
                monthly_contribution: 0,
                penalties: 0
            };
            newRecord[field] = numValue;
            
            var { data, error } = await supabaseClient
                .from("monthly_records")
                .insert([newRecord])
                .select();
            
            if (error) throw error;
            if (data && data[0]) {
                allRecords.push(data[0]);
            }
        }
        updateTotalsRow();
        showSavedIndicator(true);
    } catch (error) {
        console.error("Update error:", error);
        showSavedIndicator(false);
    }
}

function updateTotalsRow() {
    var totalLoan = 0;
    var totalLoanDeductions = 0;
    var totalLoanBalance = 0;
    var totalMonthlyContribution = 0;
    var totalPenalties = 0;
    
    for (var i = 0; i < allMembers.length; i++) {
        var member = allMembers[i];
        totalLoan += safeValue(getRecordValue(member.id, "loan"));
        totalLoanDeductions += safeValue(getRecordValue(member.id, "loan_deductions"));
        totalLoanBalance += safeValue(getRecordValue(member.id, "loan_balance"));
        totalMonthlyContribution += safeValue(getRecordValue(member.id, "monthly_contribution"));
        totalPenalties += safeValue(getRecordValue(member.id, "penalties"));
    }
    
    var totalsRow = document.getElementById("totals-row");
    if (totalsRow) {
        var cells = totalsRow.getElementsByTagName("td");
        if (cells.length >= 6) {
            cells[1].innerHTML = "KES " + formatNumber(totalLoan);
            cells[2].innerHTML = "KES " + formatNumber(totalLoanDeductions);
            cells[3].innerHTML = "KES " + formatNumber(totalLoanBalance);
            cells[4].innerHTML = "KES " + formatNumber(totalMonthlyContribution);
            cells[5].innerHTML = "KES " + formatNumber(totalPenalties);
        }
    }
}

window.handleCellChange = function(memberId, field, event) {
    var newValue = event.target.value;
    var indicator = document.getElementById("saving-indicator");
    if (indicator) {
        indicator.textContent = "Saving...";
    }
    
    if (saveTimeout) clearTimeout(saveTimeout);
    saveTimeout = setTimeout(function() {
        updateRecordValue(memberId, field, newValue);
    }, 500);
};

// Export functions
function exportToExcel() {
    var monthNames = ["JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE", "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"];
    var monthName = monthNames[currentMonth - 1];
    
    var csvRows = [];
    csvRows.push(["CHAMA RECORDS - " + monthName + " " + currentYear]);
    csvRows.push([]);
    csvRows.push(["MEMBER", "LOAN", "LOAN DEDUCTIONS", "LOAN BALANCE", "MONTHLY CONTRIBUTION", "PENALTIES"]);
    
    for (var i = 0; i < allMembers.length; i++) {
        var member = allMembers[i];
        csvRows.push([
            member.name,
            safeValue(getRecordValue(member.id, "loan")),
            safeValue(getRecordValue(member.id, "loan_deductions")),
            safeValue(getRecordValue(member.id, "loan_balance")),
            safeValue(getRecordValue(member.id, "monthly_contribution")),
            safeValue(getRecordValue(member.id, "penalties"))
        ]);
    }
    
    var totalLoan = 0, totalLoanDeductions = 0, totalLoanBalance = 0, totalMonthlyContribution = 0, totalPenalties = 0;
    for (var i = 0; i < allMembers.length; i++) {
        var member = allMembers[i];
        totalLoan += safeValue(getRecordValue(member.id, "loan"));
        totalLoanDeductions += safeValue(getRecordValue(member.id, "loan_deductions"));
        totalLoanBalance += safeValue(getRecordValue(member.id, "loan_balance"));
        totalMonthlyContribution += safeValue(getRecordValue(member.id, "monthly_contribution"));
        totalPenalties += safeValue(getRecordValue(member.id, "penalties"));
    }
    csvRows.push(["TOTAL", totalLoan, totalLoanDeductions, totalLoanBalance, totalMonthlyContribution, totalPenalties]);
    
    var csv = "";
    for (var i = 0; i < csvRows.length; i++) {
        csv += csvRows[i].join(",") + "\n";
    }
    
    var blob = new Blob([csv], { type: "application/vnd.ms-excel" });
    var link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "chama_" + monthName + "_" + currentYear + ".xls";
    link.click();
    URL.revokeObjectURL(link.href);
    alert("Excel file downloaded!");
}

function renderSpreadsheet() {
    var container = document.getElementById("app-root");
    
    var months = [
        { value: 1, name: "JANUARY" },
        { value: 2, name: "FEBRUARY" },
        { value: 3, name: "MARCH" },
        { value: 4, name: "APRIL" },
        { value: 5, name: "MAY" },
        { value: 6, name: "JUNE" },
        { value: 7, name: "JULY" },
        { value: 8, name: "AUGUST" },
        { value: 9, name: "SEPTEMBER" },
        { value: 10, name: "OCTOBER" },
        { value: 11, name: "NOVEMBER" },
        { value: 12, name: "DECEMBER" }
    ];
    
    var currentYearNum = new Date().getFullYear();
    var availableYears = [currentYearNum - 1, currentYearNum, currentYearNum + 1, currentYearNum + 2];
    
    var monthOptions = "";
    for (var i = 0; i < months.length; i++) {
        var selected = (currentMonth === months[i].value) ? "selected" : "";
        monthOptions += "<option value=\"" + months[i].value + "\" " + selected + ">" + months[i].name + "</option>";
    }
    
    var yearOptions = "";
    for (var i = 0; i < availableYears.length; i++) {
        var selected = (currentYear === availableYears[i]) ? "selected" : "";
        yearOptions += "<option value=\"" + availableYears[i] + "\" " + selected + ">" + availableYears[i] + "</option>";
    }
    
    var tableRows = "";
    
    for (var i = 0; i < allMembers.length; i++) {
        var member = allMembers[i];
        var loan = safeValue(getRecordValue(member.id, "loan"));
        var loanDeductions = safeValue(getRecordValue(member.id, "loan_deductions"));
        var loanBalance = safeValue(getRecordValue(member.id, "loan_balance"));
        var monthlyContribution = safeValue(getRecordValue(member.id, "monthly_contribution"));
        var penalties = safeValue(getRecordValue(member.id, "penalties"));
        
        tableRows += "<tr>";
        tableRows += "<td class=\"member-name-cell\"><strong>" + escapeHtml(member.name) + "</strong></td>";
        tableRows += "<td><input type=\"number\" value=\"" + loan + "\" step=\"any\" onchange=\"handleCellChange('" + member.id + "', 'loan', event)\"></td>";
        tableRows += "<td><input type=\"number\" value=\"" + loanDeductions + "\" step=\"any\" onchange=\"handleCellChange('" + member.id + "', 'loan_deductions', event)\"></td>";
        tableRows += "<td><input type=\"number\" value=\"" + loanBalance + "\" step=\"any\" onchange=\"handleCellChange('" + member.id + "', 'loan_balance', event)\"></td>";
        tableRows += "<td><input type=\"number\" value=\"" + monthlyContribution + "\" step=\"any\" onchange=\"handleCellChange('" + member.id + "', 'monthly_contribution', event)\"></td>";
        tableRows += "<td><input type=\"number\" value=\"" + penalties + "\" step=\"any\" onchange=\"handleCellChange('" + member.id + "', 'penalties', event)\"></td>";
        tableRows += "</tr>";
    }
    
    if (allMembers.length === 0) {
        tableRows = "<tr><td colspan=\"6\" style=\"text-align:center;\">No members found. Please add members first.</td></tr>";
    }
    
    var totalLoan = 0, totalLoanDeductions = 0, totalLoanBalance = 0, totalMonthlyContribution = 0, totalPenalties = 0;
    
    for (var i = 0; i < allMembers.length; i++) {
        var member = allMembers[i];
        totalLoan += safeValue(getRecordValue(member.id, "loan"));
        totalLoanDeductions += safeValue(getRecordValue(member.id, "loan_deductions"));
        totalLoanBalance += safeValue(getRecordValue(member.id, "loan_balance"));
        totalMonthlyContribution += safeValue(getRecordValue(member.id, "monthly_contribution"));
        totalPenalties += safeValue(getRecordValue(member.id, "penalties"));
    }
    
    var html = `
        <div class="action-buttons">
            <a href="members.html" class="btn">MANAGE MEMBERS</a>
            <button id="exportExcelBtn" class="btn-outline btn">EXPORT EXCEL</button>
            <button id="exportPDFBtn" class="btn-outline btn">EXPORT PDF</button>
            <button id="shareWhatsAppBtn" class="btn-outline btn">SHARE</button>
        </div>
        
        <div class="month-year-selector">
            <select id="monthSelect">${monthOptions}</select>
            <select id="yearSelect">${yearOptions}</select>
            <span id="saving-indicator" class="saving-indicator"></span>
        </div>
        
        <div class="spreadsheet-container">
            <table class="spreadsheet-table" id="data-table">
                <thead>
                    <tr>
                        <th style="min-width:120px;">MEMBER</th>
                        <th style="min-width:100px;">LOAN</th>
                        <th style="min-width:130px;">LOAN DEDUCTIONS</th>
                        <th style="min-width:120px;">LOAN BALANCE</th>
                        <th style="min-width:150px;">MONTHLY CONTRIBUTION</th>
                        <th style="min-width:100px;">PENALTIES</th>
                    </tr>
                </thead>
                <tbody>
                    ${tableRows}
                    <tr id="totals-row" class="totals-row">
                        <td><strong>TOTAL</strong></td>
                        <td><strong>KES ${formatNumber(totalLoan)}</strong></td>
                        <td><strong>KES ${formatNumber(totalLoanDeductions)}</strong></td>
                        <td><strong>KES ${formatNumber(totalLoanBalance)}</strong></td>
                        <td><strong>KES ${formatNumber(totalMonthlyContribution)}</strong></td>
                        <td><strong>KES ${formatNumber(totalPenalties)}</strong></td>
                    </tr>
                </tbody>
            </table>
        </div>
    `;
    
    container.innerHTML = html;
    
    document.getElementById("monthSelect").addEventListener("change", function(e) {
        currentMonth = parseInt(e.target.value);
        renderSpreadsheet();
    });
    
    document.getElementById("yearSelect").addEventListener("change", function(e) {
        currentYear = parseInt(e.target.value);
        renderSpreadsheet();
    });
    
    document.getElementById("exportExcelBtn").addEventListener("click", exportToExcel);
    document.getElementById("exportPDFBtn").addEventListener("click", exportToPDF);
    document.getElementById("shareWhatsAppBtn").addEventListener("click", shareToWhatsApp);
}

// Initialize
(async function() {
    var isAuth = await checkAuth();
    if (isAuth) {
        await loadData();
    }
})();
</script>
</body>
</html>
